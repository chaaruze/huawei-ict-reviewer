ged, except those in the port's PVID VLAN, which are sent untagged. <code>port trunk allow-pass vlan 10 20<\/code>.","<b>Hybrid port<\/b> (Huawei): per-VLAN choice of tagged or untagged — can act like access or trunk. On many Huawei S-series switches (and in eNSP) ports are hybrid with PVID 1 by default.","Config: <code>vlan batch 10 20<\/code> · access: <code>port link-type access<\/code> + <code>port default vlan 10<\/code> · trunk: <code>port link-type trunk<\/code> + <code>port trunk allow-pass vlan 10 20<\/code> · hybrid: <code>port hybrid pvid vlan 10<\/code> + <code>port hybrid untagged vlan 10<\/code> / <code>tagged vlan 20<\/code>.","Verify: <code>display vlan<\/code>, <code>display port vlan<\/code>, <code>display interface brief<\/code>.","VLAN assignment methods: port-based (most common), MAC-based, IP subnet-based, protocol-based, policy-based."],"video":"Huawei VLAN access trunk hybrid configuration eNSP","do":{"kind":"lab","ref":"LAB2","text":"Lab 2: two switches, four PCs in VLAN 10 and 20, trunk between them. Prove same-VLAN pings work and cross-VLAN pings fail."},"teach":"Explain what happens to a frame from PC1 (VLAN 10) as it goes access → trunk → access, including when the tag is added and removed.","simple":["Without VLANs, every device on a switch hears every broadcast and can talk to everyone. A <b>VLAN<\/b> splits one physical switch into several virtual switches. VLAN 10 (Staff) and VLAN 20 (Students) can't hear each other, even on the same box.","Ports that connect a PC are <b>access ports<\/b>: they belong to one VLAN and the PC never knows VLANs exist — the switch adds the VLAN label internally and removes it before sending to the PC.","Between switches, one cable must carry many VLANs. That's a <b>trunk<\/b>. Each frame on a trunk carries a 4-byte <b>802.1Q tag<\/b> with a 12-bit VLAN ID so the other switch knows which VLAN it belongs to. One VLAN (the PVID, VLAN 1 by default) travels untagged.","Huawei adds a flexible third type, <b>hybrid<\/b>: you choose per VLAN whether it leaves tagged or untagged.","Remember: different VLANs = different subnets = you need a router or Layer 3 switch to talk between them (next lesson)."],"terms":[["VLAN","A virtual LAN — its own broadcast domain."],["Access port","One VLAN, untagged, for end devices."],["Trunk port","Many VLANs, tagged, between switches."],["PVID","The port's default VLAN for untagged frames."],["802.1Q","The VLAN tagging standard (4-byte tag)."]],"visuals":[{"type":"bar","title":"802.1Q tag inserted after the source MAC","segs":[["Dst MAC 6",6,"datacom"],["Src MAC 6",6,"datacom"],["TPID 0x8100 · 2",3,"sec"],["PRI 3b · CFI 1b · VID 12b",5,"sec"],["Type 2",2,"muted"],["Data",14,"wlan"],["FCS 4",3,"dcn"]]},{"type":"compare","title":"Access vs trunk vs hybrid","cols":[["Access","datacom",["One VLAN","Frames to PC untagged","port default vlan 10"]],["Trunk","sec",["Many VLANs","Tagged (except PVID)","port trunk allow-pass vlan 10 20"]],["Hybrid","wlan",["Huawei-specific","Tagged/untagged chosen per VLAN","port hybrid untagged/tagged vlan …"]]]}],"cards":[{"id":"L20-c1","q":"802.1Q tag size","a":"4 bytes (TPID 0x8100 + PRI + CFI + 12-bit VID)."},{"id":"L20-c2","q":"Usable VLAN ID range","a":"1–4094."},{"id":"L20-c3","q":"Default VLAN on Huawei switches","a":"VLAN 1."},{"id":"L20-c4","q":"Create VLANs 10 and 20 in one command","a":"vlan batch 10 20"},{"id":"L20-c5","q":"Make a port an access port in VLAN 10","a":"port link-type access → port default vlan 10"},{"id":"L20-c6","q":"Allow VLANs 10 and 20 on a trunk","a":"port link-type trunk → port trunk allow-pass vlan 10 20"},{"id":"L20-c7","q":"Trunk sends which VLAN untagged?","a":"The PVID VLAN (VLAN 1 by default)."},{"id":"L20-c8","q":"Hybrid port","a":"Huawei port type that can send each VLAN tagged or untagged."},{"id":"L20-c9","q":"Show VLAN membership","a":"display vlan / display port vlan"}],"qs":[{"id":"L20-q1","t":"one","q":"How many bits make up the VLAN ID in an 802.1Q tag?","o":["8","10","12","16"],"a":[2],"e":"12 bits → 4096 values, 1–4094 usable."},{"id":"L20-q2","t":"one","q":"An access port with PVID 10 receives an untagged frame. What happens?","o":["It is dropped","It is tagged with VLAN 10 inside the switch","It is tagged with VLAN 1","It is flooded to all VLANs"],"a":[1],"e":"Untagged frames on an access port belong to its PVID."},{"id":"L20-q3","t":"tf","q":"A trunk port sends frames of its PVID VLAN without a tag.","o":["True","False"],"a":[0],"e":"PVID frames leave untagged; others are tagged."},{"id":"L20-q4","t":"multi","q":"Which Huawei port types exist?","o":["Access","Trunk","Hybrid","Dynamic-desirable"],"a":[0,1,2],"e":"Dynamic-desirable is Cisco DTP terminology."},{"id":"L20-q5","t":"one","q":"PC1 (VLAN 10) and PC2 (VLAN 20) are on the same switch with correct IPs on different subnets. What do they need to communicate?","o":["A trunk","A Layer 3 device (router or VLANIF)","A hub","Nothing"],"a":[1],"e":"Different VLANs = different broadcast domains → routing is needed."},{"id":"L20-q6","t":"one","q":"Which command lets VLANs 10–20 pass on a trunk?","o":["port trunk allow-pass vlan 10 to 20","switchport trunk allowed vlan 10-20","port trunk vlan 10-20","trunk permit 10 20"],"a":[0],"e":"Huawei: port trunk allow-pass vlan 10 to 20."}]},{"id":"L21","week":2,"domain":"datacom","pri":1,"mins":20,"title":"Inter-VLAN routing: router-on-a-stick and VLANIF","book":"Ch 7 · §7.4 · pp. 254–264","hook":{"analogy":"Router-on-a-stick: one door (trunk) into a room with several virtual doors (sub-interfaces), one per VLAN. A VLANIF is that virtual door built into the switch itself.","mnemonic":"Sub-interface: interface G0/0/1.10 → dot1q termination vid 10 → ip address → arp broadcast enable. L3 switch: interface Vlanif10 → ip address.","diagram":{"type":"topo","w":620,"h":220,"nodes":[["R1","router",310,50],["SW","sw",310,130],["PC1 VLAN10","pc",150,195],["PC2 VLAN20","pc",470,195]],"links":[["R1","SW","trunk · G0/0/1.10 + .20"],["SW","PC1 VLAN10"],["SW","PC2 VLAN20"]],"path":["PC1 VLAN10","SW","R1","SW","PC2 VLAN20"]}},"learn":["Hosts in different VLANs are on different subnets, so traffic must be <b>routed<\/b>. Each host's gateway is the L3 interface for its VLAN.","<b>Router-on-a-stick<\/b>: one physical router link (switch side = trunk), split into <b>sub-interfaces<\/b>: <code>interface GigabitEthernet0/0/1.10<\/code> → <code>dot1q termination vid 10<\/code> → <code>ip address 192.168.10.254 24<\/code> → <code>arp broadcast enable<\/code>.","Without <code>arp broadcast enable<\/code> the sub-interface can't send ARP broadcasts, and routing fails (on many AR versions it's disabled by default on termination sub-interfaces).","<b>Layer 3 switch<\/b>: create a <b>VLANIF<\/b> per VLAN: <code>interface Vlanif10<\/code> → <code>ip address 192.168.10.254 24<\/code>. Faster (hardware), no single-link bottleneck — the usual campus design.","A VLANIF is up only if the VLAN exists and at least one port in that VLAN is up.","Verify with <code>display ip interface brief<\/code>, <code>display ip routing-table<\/code> (direct routes for each VLAN subnet), and pings from hosts to their gateway first."],"video":"Huawei router on a stick dot1q termination vlanif eNSP","do":{"kind":"lab","ref":"LAB3","text":"Lab 3: make Lab 2 route between VLANs — first with router-on-a-stick, then by replacing it with VLANIF interfaces on a Layer 3 switch."},"teach":"Explain why the router's switch-facing port must be a trunk in router-on-a-stick.","simple":["VLAN 10 and VLAN 20 are separate networks, so a PC in VLAN 10 needs a <b>gateway<\/b> to reach VLAN 20 — exactly like reaching another building.","<b>Router-on-a-stick<\/b>: connect one router port to a switch trunk, and split that router port into virtual <b>sub-interfaces<\/b>, one per VLAN (G0/0/1.10, G0/0/1.20). Each gets the gateway IP for its VLAN. Traffic goes up the trunk to the router and back down tagged with the other VLAN. Cheap, but the one cable can become a bottleneck.","<b>Layer 3 switch<\/b>: the switch itself gets a virtual IP interface per VLAN called a <b>VLANIF<\/b>. Routing happens inside the switch at full speed — the normal choice in companies.","Huawei gotcha: on a router sub-interface, add <code>arp broadcast enable<\/code> or ARP (and therefore routing) won't work."],"terms":[["Sub-interface","A virtual slice of a physical router port (G0/0/1.10)."],["dot1q termination","Maps a sub-interface to a VLAN tag."],["VLANIF","Layer 3 interface for a VLAN on a switch."]],"visuals":[{"type":"compare","title":"Two ways to route between VLANs","cols":[["Router-on-a-stick","sec",["Router sub-interfaces .10/.20","Switch port = trunk","One link carries everything","Good for small labs"]],["Layer 3 switch (VLANIF)","datacom",["interface Vlanif10/20","Routing in switch hardware","No single-link bottleneck","Standard campus design"]]]}],"cards":[{"id":"L21-c1","q":"Sub-interface command that maps it to VLAN 10","a":"dot1q termination vid 10"},{"id":"L21-c2","q":"Command needed on a dot1q sub-interface so ARP works","a":"arp broadcast enable"},{"id":"L21-c3","q":"Create a Layer 3 interface for VLAN 10 on a switch","a":"interface Vlanif10 → ip address …"},{"id":"L21-c4","q":"Switch port facing a router-on-a-stick must be…","a":"A trunk (allowing the VLANs)."},{"id":"L21-c5","q":"When is a VLANIF interface up?","a":"When the VLAN exists and at least one port in it is up."},{"id":"L21-c6","q":"Advantage of VLANIF over router-on-a-stick","a":"Hardware routing, no single-link bottleneck, simpler."}],"qs":[{"id":"L21-q1","t":"one","q":"Which command associates sub-interface G0/0/1.20 with VLAN 20 on a Huawei AR router?","o":["encapsulation dot1q 20","dot1q termination vid 20","vlan 20","port default vlan 20"],"a":[1],"e":"dot1q termination vid is the Huawei command."},{"id":"L21-q2","t":"tf","q":"A Vlanif interface can be up even if no port in that VLAN is up.","o":["True","False"],"a":[1],"e":"At least one port in the VLAN must be up."},{"id":"L21-q3","t":"multi","q":"Which are valid ways to route between VLANs?","o":["Router-on-a-stick with sub-interfaces","VLANIF interfaces on a Layer 3 switch","A hub between the VLANs","A separate router interface per VLAN"],"a":[0,1,3],"e":"A hub doesn't route."},{"id":"L21-q4","t":"one","q":"PCs in VLAN 10 can ping their gateway sub-interface, but routing to VLAN 20 fails and the router's ARP table stays empty for VLAN 20. What is likely missing on the .20 sub-interface?","o":["arp broadcast enable","undo shutdown on the switch","ospf enable","port trunk pvid"],"a":[0],"e":"Termination sub-interfaces need ARP broadcast enabled to resolve hosts."},{"id":"L21-q5","t":"one","q":"What should a PC in VLAN 10 use as its default gateway?","o":["The switch management IP","The IP of the VLANIF10 or the .10 sub-interface","Any IP in VLAN 20","The DNS server"],"a":[1],"e":"The L3 interface for its own VLAN."}]},{"id":"L22","week":2,"domain":"datacom","pri":1,"mins":25,"title":"Spanning Tree: STP, RSTP and MSTP","book":"Ch 8 · §8.1 · pp. 265–280","hook":{"analogy":"Redundant links are like extra roads, but at Layer 2 a loop makes broadcasts circle forever (a broadcast storm). STP closes some roads with “road closed” signs and reopens them if the main road breaks.","mnemonic":"Elect: 1 Root Bridge (lowest Bridge ID) → Root Port on each non-root (lowest cost to root) → Designated Port per segment → everything else BLOCKS. Timers 2 / 15 / 20.","diagram":{"type":"topo","w":620,"h":230,"nodes":[["SW1 ROOT (4096)","sw",310,50],["SW2","sw",140,180],["SW3","sw",480,180]],"links":[["SW1 ROOT (4096)","SW2","DP → RP"],["SW1 ROOT (4096)","SW3","DP → RP"],["SW2","SW3","DP | ✕ blocked (alternate)"]],"path":["SW2","SW1 ROOT (4096)","SW3"]}},"learn":["Layer 2 loops cause <b>broadcast storms<\/b>, MAC table instability and duplicate frames (Ethernet frames have no TTL). STP blocks redundant ports to make a loop-free tree.","<b>Bridge ID<\/b> = priority (default <b>32768<\/b>, steps of 4096) + MAC. Lowest BID = <b>root bridge<\/b>. Set it: <code>stp root primary<\/code> or <code>stp priority 4096<\/code>.","Each non-root switch picks one <b>root port<\/b> (lowest root path cost → lowest sender BID → lowest sender port ID). Each segment gets one <b>designated port<\/b>. Remaining ports become <b>alternate/blocked<\/b>.","STP (802.1D) port states: Disabled, <b>Blocking<\/b>, Listening, Learning, Forwarding. Timers: <b>Hello 2 s<\/b>, <b>Forward Delay 15 s<\/b>, <b>Max Age 20 s<\/b> → convergence of 30–50 s.","<b>RSTP<\/b> (802.1w): states Discarding/Learning/Forwarding; roles root, designated, <b>alternate<\/b> (backup root port), <b>backup<\/b> (backup designated port); <b>edge ports<\/b> (to hosts) go straight to forwarding; proposal/agreement → convergence in about a second.","<b>MSTP<\/b> (802.1s): maps groups of VLANs to <b>instances<\/b>, each with its own tree → load-balances VLANs across links. It is the <b>Huawei default mode<\/b>.","Commands: <code>stp mode rstp<\/code>, <code>stp enable<\/code>, <code>stp edged-port enable<\/code> (interface), <code>display stp brief<\/code>, <code>display stp<\/code>. BPDU protection: <code>stp bpdu-protection<\/code>.","Path cost is based on link speed (faster = lower cost)."],"video":"spanning tree protocol root bridge root port designated port explained","do":{"kind":"lab","ref":"LAB6","text":"Lab 6: three switches in a triangle. Find the root and blocked port with display stp brief, then change priorities to move the root."},"teach":"Explain how STP decides which port to block in a triangle of three switches.","simple":["Engineers add extra links between switches so one broken cable doesn't cut people off. But in Layer 2, loops are deadly: a broadcast goes round and round forever (frames have no TTL), multiplying until the network melts — a <b>broadcast storm<\/b>.","<b>STP<\/b> fixes this by temporarily disabling just enough ports to break every loop, and re-enabling them if an active link fails.","How it decides: (1) elect a <b>root bridge<\/b> — the switch with the lowest Bridge ID (priority, default 32768, then MAC). (2) Every other switch picks its <b>root port<\/b>: the port with the cheapest path to the root. (3) Every link picks one <b>designated port<\/b> (the side closer to the root). (4) Any port that is neither is <b>blocked<\/b>.","Classic STP is slow (30–50 seconds to recover). <b>RSTP<\/b> recovers in about a second, keeps a ready <b>alternate<\/b> port, and lets PC ports (<b>edge ports<\/b>) go straight to forwarding. <b>MSTP<\/b> (Huawei's default) runs separate trees for groups of VLANs so different VLANs can use different links.","In practice: choose your root deliberately with <code>stp root primary<\/code> on the core switch rather than letting the lowest MAC win by accident."],"terms":[["Root bridge","The centre of the spanning tree (lowest BID)."],["Root port","A switch's best port towards the root."],["Designated port","The forwarding port on each link."],["Alternate port","Blocked backup for the root port (RSTP)."],["Edge port","PC-facing port, forwards immediately."]],"visuals":[{"type":"flow","title":"STP's four decisions","steps":[["Root bridge","lowest Bridge ID","datacom"],["Root ports","cheapest path to root, per switch","sec"],["Designated ports","one per link, closer to root","wlan"],["Block the rest","alternate/backup ports","dcn"]]},{"type":"compare","title":"STP vs RSTP vs MSTP","cols":[["STP 802.1D","muted",["5 port states","30–50 s convergence","One tree for all VLANs"]],["RSTP 802.1w","datacom",["Discarding/Learning/Forwarding","~1 s convergence","Alternate + edge ports"]],["MSTP 802.1s","sec",["Huawei default","Instances for VLAN groups","Load-balances across links"]]]}],"cards":[{"id":"L22-c1","q":"Default Huawei STP bridge priority","a":"32768 (multiples of 4096)."},{"id":"L22-c2","q":"Root bridge = switch with…","a":"The lowest Bridge ID (priority, then MAC)."},{"id":"L22-c3","q":"STP timers: Hello / Forward Delay / Max Age","a":"2 s / 15 s / 20 s."},{"id":"L22-c4","q":"STP (802.1D) port states","a":"Disabled, Blocking, Listening, Learning, Forwarding."},{"id":"L22-c5","q":"RSTP port states","a":"Discarding, Learning, Forwarding."},{"id":"L22-c6","q":"RSTP alternate port","a":"A backup for the root port (blocked until needed)."},{"id":"L22-c7","q":"Edge port","a":"Host-facing port that goes straight to forwarding; stp edged-port enable."},{"id":"L22-c8","q":"Huawei default STP mode","a":"MSTP."},{"id":"L22-c9","q":"MSTP advantage","a":"Maps VLANs to instances, each with its own tree → load balancing across links."},{"id":"L22-c10","q":"Make a switch the root","a":"stp root primary (or stp priority 0/4096)."}],"qs":[{"id":"L22-q1","t":"one","q":"Which switch becomes the STP root bridge?","o":["The one with the highest MAC","The one with the lowest Bridge ID","The one with the most ports","The first switch powered on"],"a":[1],"e":"Lowest priority + MAC wins."},{"id":"L22-q2","t":"one","q":"What is the default STP Forward Delay?","o":["2 s","10 s","15 s","20 s"],"a":[2],"e":"Hello 2, Forward Delay 15, Max Age 20."},{"id":"L22-q3","t":"tf","q":"On a non-root switch, the root port is the port with the lowest root path cost.","o":["True","False"],"a":[0],"e":"Ties are broken by sender BID, then sender port ID."},{"id":"L22-q4","t":"multi","q":"Which are RSTP port roles?","o":["Root","Designated","Alternate","Listening"],"a":[0,1,2],"e":"Listening is an STP state, not an RSTP role (Backup and Edge also exist)."},{"id":"L22-q5","t":"one","q":"Which is the default spanning tree mode on Huawei switches?","o":["STP","RSTP","MSTP","PVST+"],"a":[2],"e":"MSTP is the default; PVST+ is Cisco."},{"id":"L22-q6","t":"one","q":"Valid STP bridge priority values must be multiples of…","o":["1024","2048","4096","8192"],"a":[2],"e":"0–61440 in steps of 4096."}]},{"id":"L23","week":2,"domain":"datacom","pri":2,"mins":20,"title":"Link aggregation (Eth-Trunk, LACP), Smart Link and Monitor Link","book":"Ch 8 · §8.2–8.5 · pp. 280–304","hook":{"analogy":"Eth-Trunk ties several cables into one thick rope: more bandwidth, and if one strand breaks the rope still holds. STP sees one logical link, so it won't block any strand.","mnemonic":"Manual mode = all links active, no negotiation. LACP mode = negotiated, can have backup links; system priority 32768 by default, lower = actor decides.","diagram":{"type":"topo","w":620,"h":170,"nodes":[["SW1","sw",140,85],["SW2","sw",480,85]],"links":[["SW1","SW2","Eth-Trunk 1 = G0/0/1 + G0/0/2 + G0/0/3"]],"path":["SW1","SW2"]}},"learn":["<b>Link aggregation<\/b> bundles several physical ports into one logical <b>Eth-Trunk<\/b>: more bandwidth, redundancy and load balancing.","<b>Manual mode<\/b>: you add the ports and all are active; no protocol, so faults on the far side may go unnoticed.","<b>LACP mode<\/b> (802.3ad): the ends exchange LACPDUs; supports <b>active and backup<\/b> links (<code>max active-linknumber<\/code>). The end with the lower <b>system priority<\/b> (default 32768) is the actor and picks active links by <b>port priority<\/b> (default 32768, lower is better).","Members must match: speed, duplex, VLAN settings. Traffic is load-balanced <b>per flow<\/b> (source/destination MAC or IP hash), so a single flow uses one link.","Config: <code>interface Eth-Trunk 1<\/code> → <code>mode lacp<\/code> (or <code>mode manual load-balance<\/code>) → <code>trunkport GigabitEthernet 0/0/1 to 0/0/3<\/code>, then configure VLANs on the Eth-Trunk interface. Check: <code>display eth-trunk 1<\/code>.","<b>Smart Link<\/b>: a master and a slave uplink; only one forwards; fast (millisecond) switchover without STP — for dual-homed access switches.","<b>Monitor Link<\/b>: ties downlink ports to an uplink; if the uplink fails, the downlinks are shut so the downstream device switches over.","Stacking (iStack/CSS) makes several switches act as one; combined with Eth-Trunk across members it removes the need for STP blocking."],"video":"Huawei eth-trunk LACP configuration","do":{"kind":"lab","ref":"LAB6","text":"Lab 6, part 2: bundle two links between switches into an LACP Eth-Trunk; shut one member and check display eth-trunk."},"teach":"Explain why STP does not block the links inside an Eth-Trunk, and what LACP adds over manual mode.","simple":["If one cable between two switches is too slow, you can add more — but STP would block the extras. <b>Link aggregation<\/b> bundles several cables into one logical link, an <b>Eth-Trunk<\/b>. STP sees just one link, so nothing is blocked, and you get more bandwidth plus redundancy.","<b>Manual mode<\/b>: you list the ports and they're all active. <b>LACP mode<\/b>: the two switches talk (LACPDUs) to agree which ports are bundled, detect mis-cabling, and can keep some links as hot spares.","Traffic is shared per <b>flow<\/b> (based on MAC/IP hashes), not per packet, so one download uses one link — the bundle helps when there are many users.","<b>Smart Link<\/b> and <b>Monitor Link<\/b> are Huawei tools for dual-uplink access switches: Smart Link keeps a standby uplink ready and switches in milliseconds; Monitor Link shuts downstream ports when an uplink dies so the downstream device notices and fails over."],"terms":[["Eth-Trunk","Huawei's aggregated link interface."],["LACP","Protocol that negotiates link aggregation (802.3ad)."],["Actor","The LACP side with the better (lower) system priority that picks active links."],["Per-flow load balancing","Each conversation sticks to one member link."]],"visuals":[{"type":"compare","title":"Manual vs LACP Eth-Trunk","cols":[["Manual","muted",["No negotiation","All member links active","Misconnections may go unnoticed"]],["LACP","datacom",["LACPDUs exchanged","Active + backup links","Detects faults on the far end"]]]}],"cards":[{"id":"L23-c1","q":"Two Eth-Trunk modes","a":"Manual (no negotiation) and LACP (802.3ad negotiation)."},{"id":"L23-c2","q":"LACP default system priority","a":"32768 (lower = actor)."},{"id":"L23-c3","q":"Why can LACP detect more faults than manual mode?","a":"It exchanges LACPDUs, so it notices a misconnected or failed far end."},{"id":"L23-c4","q":"Load balancing in an Eth-Trunk is per…","a":"Flow (hash of MAC/IP), not per packet."},{"id":"L23-c5","q":"Add ports to Eth-Trunk 1","a":"interface Eth-Trunk 1 → trunkport GigabitEthernet 0/0/1 to 0/0/3"},{"id":"L23-c6","q":"Smart Link","a":"Master/slave uplinks with fast switchover, an STP alternative for dual-homing."},{"id":"L23-c7","q":"Monitor Link","a":"Shuts downlinks when the monitored uplink fails."}],"qs":[{"id":"L23-q1","t":"one","q":"In LACP mode, which device chooses the active links?","o":["The device with the higher system priority value","The device with the lower system priority value (the actor)","Both, randomly","The STP root bridge"],"a":[1],"e":"Lower system priority = actor."},{"id":"L23-q2","t":"tf","q":"All member links of a manual-mode Eth-Trunk are active.","o":["True","False"],"a":[0],"e":"Manual mode has no backup links."},{"id":"L23-q3","t":"multi","q":"Which must be consistent across Eth-Trunk member ports?","o":["Speed","Duplex mode","Interface description","VLAN configuration"],"a":[0,1,3],"e":"Descriptions don't matter."},{"id":"L23-q4","t":"one","q":"What is the main benefit of link aggregation?","o":["It encrypts traffic","It increases bandwidth and adds redundancy","It replaces VLANs","It assigns IP addresses"],"a":[1],"e":"Several links act as one: more bandwidth, and the trunk survives a member failure."},{"id":"L23-q5","t":"one","q":"Which technology shuts downstream ports when an uplink fails, so downstream devices switch to their backup path?","o":["Smart Link","Monitor Link","LACP","VRRP"],"a":[1],"e":"Monitor Link mirrors uplink state onto downlinks."}]},{"id":"L24","week":3,"domain":"datacom","pri":1,"mins":20,"title":"DHCP: DORA, leases, pools and relay","book":"Ch 11 · pp. 345–358","hook":{"analogy":"DHCP is a hotel front desk: you ask for a room (Discover), they offer one (Offer), you say “I'll take it” (Request), they hand you the key (ACK) — with a checkout time (the lease).","mnemonic":"D-O-R-A: Discover, Offer, Request, ACK. Renew at 50% of the lease (T1), rebind at 87.5% (T2).","diagram":{"type":"seq","actors":["Client (no IP)","DHCP server"],"steps":[[0,1,"DHCP Discover","broadcast · UDP 68 → 67"],[1,0,"DHCP Offer","proposed IP + options"],[0,1,"DHCP Request","broadcast · “I accept this one”"],[1,0,"DHCP ACK","IP, mask, gateway, DNS, lease"],[0,1,"Request (renew at T1 = 50%)","unicast"],[1,0,"ACK","lease extended"]]}},"learn":["DHCP assigns IP address, mask, <b>gateway<\/b>, <b>DNS<\/b> and a lease automatically. Server UDP <b>67<\/b>, client UDP <b>68<\/b>.","<b>DORA<\/b>: Discover (broadcast) → Offer → Request (broadcast, so other servers learn their offer wasn't chosen) → ACK. Other messages: <b>NAK<\/b> (refuse), <b>Decline<\/b> (client found the IP already in use), <b>Release<\/b> (client gives the IP back), Inform.","Lease renewal: at <b>T1 = 50%<\/b> the client unicasts a Request to its server; at <b>T2 = 87.5%<\/b> it broadcasts to any server (rebind); at 100% it must stop using the address.","Huawei <b>global address pool<\/b>: <code>dhcp enable<\/code> → <code>ip pool LAN<\/code> → <code>network 192.168.1.0 mask 24<\/code> → <code>gateway-list 192.168.1.254<\/code> → <code>dns-list 8.8.8.8<\/code> → <code>lease day 1<\/code> (default lease 1 day) → <code>excluded-ip-address …<\/code>. On the interface: <code>dhcp select global<\/code>.","<b>Interface address pool<\/b>: the pool is the interface's own subnet: <code>dhcp select interface<\/code> + <code>dhcp server dns-list …<\/code>, <code>dhcp server lease day 0 hour 4<\/code>.","DHCP Discover is a broadcast, so it can't cross a router. A <b>DHCP relay<\/b> on the gateway forwards it as unicast to a remote server: <code>dhcp select relay<\/code> + <code>dhcp relay server-ip 10.0.0.10<\/code>.","Check: <code>display ip pool<\/code>, <code>display ip pool name LAN used<\/code>. Clients on PC: <code>ipconfig /release<\/code> / <code>/renew<\/code>."],"video":"DHCP DORA process explained","do":{"kind":"lab","ref":"LAB7","text":"Lab 7, part 1: global pool on the router for VLAN users. Watch DORA in Wireshark and check display ip pool."},"teach":"Explain why both Discover and Request are broadcasts, and why a relay agent is needed when the server is on another subnet.","simple":["Typing IP settings into hundreds of PCs by hand is slow and error-prone, so a <b>DHCP server<\/b> hands them out automatically: IP address, mask, gateway, DNS — and a <b>lease<\/b> time (like a library loan).","A new PC has no IP, so it can only shout: <b>Discover<\/b> (broadcast: “any DHCP server out there?”). The server answers with an <b>Offer<\/b> (“you can have 192.168.1.23”). The PC broadcasts a <b>Request<\/b> (“I'll take that one!” — broadcast so other servers know). The server confirms with an <b>ACK<\/b>. That's <b>DORA<\/b>.","Halfway through the lease (<b>T1 = 50%<\/b>) the PC quietly asks its server to renew. If no answer by <b>87.5%<\/b> (T2), it asks any server. If the lease runs out, it must stop using the address.","Broadcasts can't cross routers. If the DHCP server is in another network, the gateway acts as a <b>DHCP relay<\/b>: it catches the broadcast and forwards it to the server as a normal unicast packet.","On a Huawei router: create a pool (network, gateway-list, dns-list, lease), then on the LAN interface say <code>dhcp select global<\/code>."],"terms":[["Lease","How long a client may keep its address."],["DORA","Discover, Offer, Request, ACK."],["Address pool","The range of addresses a server can hand out."],["Excluded address","Kept out of the pool (servers, printers, gateway)."],["DHCP relay","Forwards client broadcasts to a remote server."]],"visuals":[{"type":"topo","w":640,"h":200,"title":"DHCP relay across a router","nodes":[["PC (no IP yet)","pc",70,100],["Gateway = relay","router",320,100],["DHCP server 10.0.0.10","server",570,100]],"links":[["PC (no IP yet)","Gateway = relay","Discover = broadcast"],["Gateway = relay","DHCP server 10.0.0.10","forwarded as unicast"]],"path":["PC (no IP yet)","Gateway = relay","DHCP server 10.0.0.10"]},{"type":"stack","title":"Lease timeline","rows":[["0%","address assigned (ACK)","wlan"],["50% · T1","unicast Request to the same server (renew)","datacom"],["87.5% · T2","broadcast Request to any server (rebind)","sec"],["100%","lease expired — stop using the address","dcn"]]}],"cards":[{"id":"L24-c1","q":"DORA","a":"Discover, Offer, Request, ACK."},{"id":"L24-c2","q":"DHCP UDP ports","a":"Server 67, client 68."},{"id":"L24-c3","q":"When does a DHCP client first try to renew?","a":"At T1 = 50% of the lease (unicast to its server)."},{"id":"L24-c4","q":"T2 rebinding time","a":"87.5% of the lease (broadcast to any server)."},{"id":"L24-c5","q":"DHCP Decline means…","a":"The client found the offered IP already in use (conflict)."},{"id":"L24-c6","q":"Bind a Huawei interface to a global pool","a":"dhcp select global"},{"id":"L24-c7","q":"Why is DHCP relay needed?","a":"Discover is a broadcast and can't cross routers; the relay forwards it as unicast."},{"id":"L24-c8","q":"Relay configuration on the gateway","a":"dhcp select relay → dhcp relay server-ip &lt;server&gt;"},{"id":"L24-c9","q":"Default lease time of a Huawei global pool","a":"1 day."}],"qs":[{"id":"L24-q1","t":"one","q":"Which is the correct order of DHCP messages for a new client?","o":["Request, Offer, Discover, ACK","Discover, Offer, Request, ACK","Discover, Request, Offer, ACK","Offer, Discover, ACK, Request"],"a":[1],"e":"DORA."},{"id":"L24-q2","t":"one","q":"At what percentage of its lease does a client first try to renew with its original server?","o":["25%","50%","75%","87.5%"],"a":[1],"e":"T1 = 50%, T2 = 87.5%."},{"id":"L24-q3","t":"tf","q":"A DHCP relay agent is needed when the DHCP server is on a different subnet from the clients.","o":["True","False"],"a":[0],"e":"Broadcasts don't cross routers."},{"id":"L24-q4","t":"multi","q":"Which parameters can a DHCP server hand to a client?","o":["IP address and mask","Default gateway","DNS server","The client's MAC address"],"a":[0,1,2],"e":"The MAC is the client's own hardware address."},{"id":"L24-q5","t":"one","q":"Which interface command makes a Huawei router assign addresses from a global pool?","o":["dhcp select interface","dhcp select global","dhcp enable pool","ip dhcp pool"],"a":[1],"e":"dhcp select global."},{"id":"L24-q6","t":"one","q":"Which message does a client send if it finds the offered address is already used?","o":["DHCP NAK","DHCP Release","DHCP Decline","DHCP Inform"],"a":[2],"e":"Decline."}]},{"id":"L25","week":3,"domain":"security","pri":1,"mins":25,"title":"NAT: static, dynamic, NAPT, Easy IP and NAT Server","book":"Ch 10 · pp. 329–343","hook":{"analogy":"NAPT is an office receptionist with one outside phone number: every call out gets a different extension (port) so replies reach the right desk.","mnemonic":"Static = 1:1 fixed. Dynamic = pool, 1:1 while in use. NAPT = many:few with ports. Easy IP = NAPT using the outgoing interface's own IP. NAT Server = lets outsiders in to an inside server.","diagram":{"type":"topo","w":620,"h":200,"nodes":[["PC 192.168.1.10","pc",70,100],["R1 (NAT)","router",310,100],["Web 8.8.8.8","server",550,100]],"links":[["PC 192.168.1.10","R1 (NAT)","src 192.168.1.10:5000"],["R1 (NAT)","Web 8.8.8.8","src 202.0.0.1:2001"]],"path":["PC 192.168.1.10","R1 (NAT)","Web 8.8.8.8"]}},"learn":["<b>NAT<\/b> translates private addresses to public ones, saving IPv4 space and hiding inside addresses. The router keeps a translation table.","<b>Static NAT<\/b>: fixed 1:1 mapping (<code>nat static global 202.0.0.10 inside 192.168.1.10<\/code> on the outbound interface).","<b>Dynamic NAT<\/b> (No-PAT): inside hosts take public IPs from a pool 1:1 while in use: <code>nat address-group 1 202.0.0.10 202.0.0.20<\/code> + <code>nat outbound 2000 address-group 1 no-pat<\/code>.","<b>NAPT<\/b> (PAT): many inside hosts share a few public IPs by also translating <b>ports<\/b>: <code>nat outbound 2000 address-group 1<\/code> (without no-pat).","<b>Easy IP<\/b>: NAPT using the IP of the outbound interface itself — ideal for dial-up/DHCP Internet links: <code>nat outbound 2000<\/code>.","<b>NAT Server<\/b>: publishes an inside server to the outside: <code>nat server protocol tcp global 202.0.0.5 www inside 192.168.1.100 www<\/code>.","An <b>ACL<\/b> (basic 2000–2999) selects which inside addresses get translated: <code>acl 2000<\/code> → <code>rule permit source 192.168.1.0 0.0.0.255<\/code>.","Downsides: breaks end-to-end addressing, complicates some protocols (FTP, IPsec AH) — ALG/NAT-T help — and outsiders can't start connections without NAT Server/static NAT.","Check: <code>display nat session all<\/code>, <code>display nat outbound<\/code>, <code>display nat server<\/code>."],"video":"NAT vs PAT explained static dynamic NAT","do":{"kind":"lab","ref":"LAB7","text":"Lab 7, part 2: Easy IP so LAN users reach the “ISP” loopback, then NAT Server so the ISP can open the inside web server."},"teach":"Explain how NAPT lets 50 PCs share one public IP, and how replies find the right PC.","simple":["There aren't enough public IPv4 addresses for every device, so companies and homes use private addresses inside (192.168.x.x etc.) and <b>NAT<\/b> on the edge router swaps them for a public address on the way out — and back on the way in.","<b>Static NAT<\/b>: one private address permanently mapped to one public address (good for a server). <b>Dynamic NAT<\/b>: inside hosts borrow public addresses from a pool, one each, while they need them.","<b>NAPT (PAT)<\/b> is what almost everyone uses: many inside hosts share one (or a few) public addresses, and the router also changes the <b>source port<\/b> so it can tell the replies apart. <b>Easy IP<\/b> is Huawei's name for NAPT using the outside interface's own address — perfect when your ISP gives you just one IP.","<b>NAT Server<\/b> works in the other direction: it lets outsiders reach an inside server (e.g. “public IP port 80 → 192.168.1.100 port 80”).","An ACL decides <i>which<\/i> inside addresses get translated. If the ACL doesn't match your PCs' subnet, nothing happens — a very common mistake."],"terms":[["Inside local","The private address of the inside host."],["Inside global","The public address it appears as."],["NAPT/PAT","Many-to-one NAT using port numbers."],["Easy IP","NAPT with the outbound interface's IP."],["NAT Server","Publishes an inside server to the outside."]],"visuals":[{"type":"cli","title":"NAPT translation table (what the router remembers)","lines":["Inside (private)        Outside (public)        Destination","192.168.1.10 : 5000  →  202.0.0.1 : 2001  →  8.8.8.8 : 53","192.168.1.11 : 5000  →  202.0.0.1 : 2002  →  8.8.8.8 : 53","192.168.1.12 : 6100  →  202.0.0.1 : 2003  →  93.184.216.34 : 443"],"notes":{"1":"same public IP, different public ports…","2":"…so replies to :2001 and :2002 go back to different PCs"}},{"type":"compare","title":"Which NAT when?","cols":[["Static NAT","datacom",["1 private ↔ 1 public, fixed","Servers that must be reachable"]],["Dynamic NAT (no-pat)","muted",["Pool, 1:1 while in use","Rare today"]],["NAPT / Easy IP","sec",["Many → one public IP with ports","Every office/home"]],["NAT Server","wlan",["Outside → inside server","Publishing a website"]]]}],"cards":[{"id":"L25-c1","q":"NAPT translates…","a":"IP addresses and port numbers (many inside hosts → few public IPs)."},{"id":"L25-c2","q":"Easy IP","a":"NAPT that uses the outbound interface's own IP: nat outbound &lt;acl&gt;."},{"id":"L25-c3","q":"Dynamic NAT without port translation keyword","a":"no-pat"},{"id":"L25-c4","q":"NAT Server is used to…","a":"Let outside users reach an inside server via a public IP/port."},{"id":"L25-c5","q":"Which ACL type usually selects traffic for NAT?","a":"Basic ACL (2000–2999) matching source addresses."},{"id":"L25-c6","q":"Create a NAT address pool","a":"nat address-group 1 &lt;start&gt; &lt;end&gt;"},{"id":"L25-c7","q":"Static NAT command","a":"nat static global &lt;public&gt; inside &lt;private&gt;"},{"id":"L25-c8","q":"View NAT translations","a":"display nat session all"}],"qs":[{"id":"L25-q1","t":"one","q":"A small office has one public IP assigned by DHCP to the router's WAN interface. Which NAT type is most suitable?","o":["Static NAT","Dynamic NAT (no-pat)","Easy IP","NAT Server"],"a":[2],"e":"Easy IP uses the interface's current address with port translation."},{"id":"L25-q2","t":"one","q":"Which NAT type maps one private address to one public address permanently?","o":["Static NAT","NAPT","Easy IP","Dynamic NAT"],"a":[0],"e":"Static = fixed 1:1."},{"id":"L25-q3","t":"tf","q":"NAPT translates both IP addresses and port numbers.","o":["True","False"],"a":[0],"e":"Ports let many hosts share one IP."},{"id":"L25-q4","t":"multi","q":"Which statements about NAT Server are correct?","o":["It maps a public IP/port to an inside server","It lets external users start connections to the inside server","It is used for outbound Internet access of PCs","It hides the server's private IP from outsiders"],"a":[0,1,3],"e":"Outbound PC access is NAPT/Easy IP."},{"id":"L25-q5","t":"one","q":"What does the no-pat keyword in “nat outbound 2000 address-group 1 no-pat” do?","o":["Disables NAT","Translates addresses only, without ports (1:1 dynamic NAT)","Enables port translation","Applies NAT inbound"],"a":[1],"e":"no-pat = dynamic 1:1 NAT."},{"id":"L25-q6","t":"one","q":"A user configures Easy IP but no hosts are translated. The ACL has rule permit source 10.1.1.0 0.0.0.255, while the PCs use 192.168.1.0/24. What's wrong?","o":["The ACL doesn't match the PCs' source subnet","Easy IP needs an address group","NAT must be applied inbound","The ACL must be advanced"],"a":[0],"e":"The ACL decides which sources are translated."}]},{"id":"L26","week":3,"domain":"security","pri":1,"mins":25,"title":"ACLs: basic and advanced rules, wildcards, matching","book":"Ch 9 · §9.1 · pp. 307–319","hook":{"analogy":"An ACL is a bouncer's list read top to bottom: the first line that matches you decides — let in or turn away. Nobody reads further.","mnemonic":"2000s = Basic (source only). 3000s = Advanced (src, dst, protocol, ports). 4000s = Layer 2 (MAC). Wildcard 0 = must match, 1 = don't care.","diagram":{"type":"stack","title":"acl 3000 applied inbound on G0/0/1","rows":[["rule 5 permit tcp source 10.1.1.0 0.0.0.255 destination 10.2.2.10 0 destination-port eq 80","match? → permit, stop","wlan"],["rule 10 deny ip source 10.1.1.0 0.0.0.255 destination 10.2.2.0 0.0.0.255","match? → deny, stop","sec"],["rule 15 permit ip","everything else allowed","datacom"],["(no rule matched)","traffic-filter default on Huawei: permit","muted"]]}},"learn":["An <b>ACL<\/b> is an ordered list of <b>rules<\/b> (permit/deny). It is used for traffic filtering, NAT, routing policy, QoS and controlling remote login.","Types by number: <b>basic 2000–2999<\/b> (source IP only), <b>advanced 3000–3999<\/b> (source/destination IP, protocol, source/destination ports, etc.), <b>Layer 2 4000–4999<\/b> (MAC, VLAN), <b>user-defined 5000–5999<\/b>. Named ACLs are also possible.","Rules are matched in order (by default by rule ID ascending, <b>config<\/b> order); <b>the first match wins<\/b>. Rule IDs default to steps of 5 so you can insert rules between them.","<b>Wildcard mask<\/b>: 0 bits must match, 1 bits are ignored. 0.0.0.255 = any host in a /24; 0 (or 0.0.0.0) = exactly one host; <code>any<\/code> = everything.","Apply on an interface: <code>traffic-filter inbound acl 3000<\/code> (or outbound).","<b>Huawei default<\/b>: with traffic-filter, packets that match <b>no rule are permitted<\/b>. Add an explicit final deny if you want “deny everything else” (Cisco is the opposite: implicit deny).","Placement tips: basic ACLs close to the <b>destination<\/b> (they only see the source); advanced ACLs close to the <b>source<\/b> (stop traffic early).","Example: <code>acl 3000<\/code> → <code>rule 5 deny tcp source 192.168.1.0 0.0.0.255 destination 10.1.1.10 0 destination-port eq telnet<\/code>. View hits: <code>display acl 3000<\/code>.","Restrict VTY logins: <code>user-interface vty 0 4<\/code> → <code>acl 2001 inbound<\/code>."],"video":"ACL wildcard mask explained basic advanced ACL","do":{"kind":"lab","ref":"LAB8","text":"Lab 8, part 1: block one PC from the server's web port with an advanced ACL while everything else works; check rule hits with display acl."},"teach":"Explain first-match ordering and Huawei's default action for unmatched packets, with an example where order matters.","simple":["An <b>ACL<\/b> (access control list) is a numbered checklist of rules, each saying <b>permit<\/b> or <b>deny<\/b> for traffic that matches. The device checks rules from the top and stops at the <b>first match<\/b>, so order matters a lot.","<b>Basic ACLs<\/b> (2000–2999) only look at the source IP — like a bouncer who only checks where you came from. <b>Advanced ACLs<\/b> (3000–3999) can check source and destination IP, protocol and port — “block 192.168.1.10 from reaching the server's web port 80, but allow ping”.","ACLs use <b>wildcard masks<\/b>: 0 bits must match, 1 bits don't matter. <code>192.168.1.0 0.0.0.255<\/code> = the whole 192.168.1.x range; <code>192.168.1.10 0<\/code> = exactly that host.","An ACL does nothing until you <b>apply<\/b> it, e.g. <code>traffic-filter inbound acl 3000<\/code> on an interface. Important Huawei difference: with traffic-filter, traffic that matches <b>no<\/b> rule is <b>permitted<\/b> by default (Cisco denies it). Add <code>rule deny ip<\/code> at the end if you want “block everything else”."],"terms":[["Rule","One permit/deny line in an ACL."],["First match","Processing stops at the first matching rule."],["Wildcard mask","0 = must match, 1 = ignore."],["traffic-filter","Applies an ACL to an interface direction."],["Inbound / outbound","Traffic entering / leaving that interface."]],"visuals":[{"type":"flow","title":"How a packet is checked","steps":[["Rule 5","match? → permit/deny, stop","datacom"],["Rule 10","match? → permit/deny, stop","sec"],["Rule 15 …","and so on, top to bottom","wlan"],["No match","traffic-filter default: permit","muted"]]},{"type":"compare","title":"Basic vs advanced ACL","cols":[["Basic 2000–2999","datacom",["Source IP only","Place near the destination","Used for NAT, VTY access"]],["Advanced 3000–3999","sec",["Src/dst IP, protocol, ports","Place near the source","Precise traffic filtering"]]]}],"cards":[{"id":"L26-c1","q":"Basic ACL range and match fields","a":"2000–2999; source IP only."},{"id":"L26-c2","q":"Advanced ACL range","a":"3000–3999; src/dst IP, protocol, ports…"},{"id":"L26-c3","q":"Layer 2 ACL range","a":"4000–4999 (MAC-based)."},{"id":"L26-c4","q":"Wildcard 0.0.0.255 matches…","a":"Any value in the last octet (a /24)."},{"id":"L26-c5","q":"Wildcard for one exact host","a":"0 (0.0.0.0)."},{"id":"L26-c6","q":"Apply ACL 3000 to inbound traffic on an interface","a":"traffic-filter inbound acl 3000"},{"id":"L26-c7","q":"Huawei traffic-filter default for unmatched packets","a":"Permit."},{"id":"L26-c8","q":"Default rule ID step","a":"5."},{"id":"L26-c9","q":"Where to place a basic ACL","a":"Close to the destination."},{"id":"L26-c10","q":"ACL matching principle","a":"Top-down, first match wins, then stop."}],"qs":[{"id":"L26-q1","t":"one","q":"Which ACL number range can match destination port numbers?","o":["2000–2999","3000–3999","4000–4999","1–99"],"a":[1],"e":"Only advanced ACLs match ports."},{"id":"L26-q2","t":"one","q":"Which wildcard matches all hosts in 172.16.4.0/22?","o":["0.0.3.255","0.0.0.255","255.255.252.0","0.0.4.255"],"a":[0],"e":"A /22 mask 255.255.252.0 → wildcard 0.0.3.255."},{"id":"L26-q3","t":"tf","q":"On a Huawei device using traffic-filter, packets that match no ACL rule are denied by default.","o":["True","False"],"a":[1],"e":"The traffic-filter default is permit; add an explicit deny rule if needed."},{"id":"L26-q4","t":"one","q":"An ACL has rule 5 permit ip source 10.1.1.0 0.0.0.255 and rule 10 deny ip source 10.1.1.5 0. What happens to traffic from 10.1.1.5?","o":["Denied by rule 10","Permitted by rule 5","Denied by default","Both rules apply"],"a":[1],"e":"First match wins; rule 5 matches first."},{"id":"L26-q5","t":"multi","q":"What can an advanced ACL match on?","o":["Source IP","Destination IP","Protocol type","Source MAC address"],"a":[0,1,2],"e":"MAC matching needs a Layer 2 ACL (4000–4999)."},{"id":"L26-q6","t":"one","q":"Which command restricts Telnet/SSH logins to sources allowed by ACL 2001?","o":["traffic-filter inbound acl 2001 (on VTY)","acl 2001 inbound (in user-interface vty 0 4)","ssh acl 2001","aaa acl 2001"],"a":[1],"e":"In the VTY user-interface view: acl 2001 inbound."}]},{"id":"L27","week":3,"domain":"security","pri":1,"mins":20,"title":"AAA, local users and secure remote management (SSH)","book":"Ch 9 · §9.2 · pp. 319–325; Ch 3 · §3.3 · pp. 82–95","hook":{"analogy":"AAA is airport security: Authentication = showing your passport (who are you?), Authorization = your boarding pass (what may you do?), Accounting = the log of where you went.","mnemonic":"RADIUS = UDP, combines authN + authZ, encrypts only the password. HWTACACS = TCP 49, separates all three, encrypts the whole body.","diagram":{"type":"seq","actors":["Admin (SSH client)","Switch (NAS)","RADIUS server"],"steps":[[0,1,"SSH login: user + password","TCP 22"],[1,2,"Access-Request","UDP 1812"],[2,1,"Access-Accept + privilege level",""],[1,0,"Login OK, level 15",""],[1,2,"Accounting-Request (start)","UDP 1813"]]}},"learn":["<b>AAA<\/b> = <b>Authentication<\/b> (who are you), <b>Authorization<\/b> (what may you do), <b>Accounting<\/b> (what did you do).","Authentication methods: <b>local<\/b> (users stored on the device), <b>RADIUS<\/b>, <b>HWTACACS<\/b>, or none. Huawei devices use AAA <b>domains<\/b> (e.g. <code>default<\/code>, <code>default_admin<\/code>) that reference schemes.","<b>RADIUS<\/b>: UDP (1812 authentication, 1813 accounting), authentication and authorization combined, only the password encrypted — common for network access (Wi-Fi 802.1X).","<b>HWTACACS<\/b> (Huawei's TACACS+-compatible protocol): TCP 49, separates authentication, authorization and accounting, encrypts the whole payload — common for device administration and command authorization.","Local user: <code>aaa<\/code> → <code>local-user admin password irreversible-cipher Huawei@123<\/code> → <code>local-user admin privilege level 15<\/code> → <code>local-user admin service-type ssh telnet terminal<\/code>.","<b>SSH (STelnet)<\/b>: <code>stelnet server enable<\/code> → <code>rsa local-key-pair create<\/code> (or <code>dsa<\/code>/<code>ecc<\/code>) → <code>ssh user admin authentication-type password<\/code> → <code>ssh user admin service-type stelnet<\/code> → VTY: <code>authentication-mode aaa<\/code> + <code>protocol inbound ssh<\/code>.","Good practice: SSH not Telnet, strong passwords, an ACL on the VTYs, idle timeouts (<code>idle-timeout 5 0<\/code>), log in with named accounts so accounting is meaningful."],"video":"AAA authentication authorization accounting RADIUS vs TACACS","do":{"kind":"lab","ref":"LAB8","text":"Lab 8, part 2: create a local AAA admin, enable STelnet, and SSH from another router (stelnet 10.1.1.1)."},"teach":"Explain the three As with an example of each, and when you'd pick RADIUS vs HWTACACS.","simple":["<b>AAA<\/b> is how a device decides who you are and what you can do. <b>Authentication<\/b>: prove who you are (username + password). <b>Authorization<\/b>: what you're allowed to do (e.g. privilege level 15 = everything). <b>Accounting<\/b>: a record of what you did and when.","Accounts can live on the device itself (<b>local<\/b>) or on a central server. <b>RADIUS<\/b> (UDP 1812/1813) is the common choice for users joining the network (like Wi-Fi). <b>HWTACACS<\/b> (TCP 49) is preferred for administrators because it encrypts everything and can authorise each command separately.","For managing devices remotely, always use <b>SSH<\/b> (encrypted) rather than Telnet (anyone sniffing the cable can read your password). On Huawei: create a local user, enable <code>stelnet server enable<\/code>, generate keys (<code>rsa local-key-pair create<\/code>), and set the VTY lines to <code>authentication-mode aaa<\/code> and <code>protocol inbound ssh<\/code>."],"terms":[["Authentication","Proving identity."],["Authorization","Granting permissions."],["Accounting","Logging activity."],["RADIUS","UDP AAA protocol, combines authN+authZ."],["HWTACACS","TCP 49, separates AAA, encrypts whole packet."]],"visuals":[{"type":"compare","title":"RADIUS vs HWTACACS","cols":[["RADIUS","datacom",["UDP 1812 / 1813","AuthN + AuthZ combined","Encrypts only the password","Network access (802.1X, Wi-Fi)"]],["HWTACACS","sec",["TCP 49","AuthN, AuthZ, accounting separate","Encrypts the whole body","Device admin, per-command authorization"]]]}],"cards":[{"id":"L27-c1","q":"AAA stands for…","a":"Authentication, Authorization, Accounting."},{"id":"L27-c2","q":"RADIUS transport/ports","a":"UDP 1812 (authentication), 1813 (accounting)."},{"id":"L27-c3","q":"HWTACACS transport/port","a":"TCP 49."},{"id":"L27-c4","q":"Which of RADIUS/HWTACACS encrypts the entire packet body?","a":"HWTACACS (RADIUS encrypts only the password)."},{"id":"L27-c5","q":"Create local user with level 15","a":"aaa → local-user admin privilege level 15 (+ password, service-type)"},{"id":"L27-c6","q":"Enable the SSH server on VRP","a":"stelnet server enable (+ rsa local-key-pair create)"},{"id":"L27-c7","q":"Force VTY lines to use AAA logins","a":"authentication-mode aaa"},{"id":"L27-c8","q":"Huawei default AAA domains","a":"default and default_admin."}],"qs":[{"id":"L27-q1","t":"one","q":"Which AAA component decides which commands a logged-in user may run?","o":["Authentication","Authorization","Accounting","Auditing"],"a":[1],"e":"Authorization = what you're allowed to do."},{"id":"L27-q2","t":"one","q":"Which protocol uses TCP port 49 and separates authentication, authorization and accounting?","o":["RADIUS","HWTACACS","LDAP","SNMP"],"a":[1],"e":"HWTACACS is TCP 49."},{"id":"L27-q3","t":"tf","q":"RADIUS encrypts the whole packet, including the username.","o":["True","False"],"a":[1],"e":"RADIUS only encrypts the password attribute."},{"id":"L27-q4","t":"multi","q":"Which steps are needed to log in to a Huawei router using SSH with a local account?","o":["stelnet server enable","Create an RSA key pair","Configure the user with service-type ssh","Enable Telnet on port 23"],"a":[0,1,2],"e":"Telnet isn't required."},{"id":"L27-q5","t":"one","q":"Which command, in the VTY user-interface view, allows only SSH logins?","o":["protocol inbound ssh","transport input ssh","ssh only","stelnet enable"],"a":[0],"e":"transport input ssh is Cisco syntax."}]},{"id":"L28","week":3,"domain":"datacom","pri":1,"mins":25,"title":"IPv6 addressing: format, compression and address types","book":"Ch 13 · §13.1–13.2 · pp. 405–421","hook":{"analogy":"IPv4 is a 32-bit phone number that ran out. IPv6 is 128 bits — enough for every grain of sand to have its own network.","mnemonic":"Compress: drop leading zeros in each group; replace ONE run of all-zero groups with ::. Types: 2000::/3 global, FE80::/10 link-local, FC00::/7 ULA, FF00::/8 multicast, ::1 loopback.","diagram":{"type":"bar","title":"2001:0DB8:0000:0001:0000:0000:0000:0010/64  →  2001:DB8:0:1::10/64","segs":[["Global routing prefix (48)",48,"datacom"],["Subnet ID (16)",16,"sec"],["Interface ID (64)",64,"wlan"]]}},"learn":["IPv6 = <b>128 bits<\/b>, written as 8 groups of 4 hex digits: <code>2001:0DB8:0000:0001:0000:0000:0000:0010<\/code>.","<b>Compression<\/b>: (1) drop leading zeros in each group → <code>2001:DB8:0:1:0:0:0:10<\/code>; (2) replace <b>one<\/b> run of consecutive all-zero groups with <code>::<\/code> → <code>2001:DB8:0:1::10<\/code>. <code>::<\/code> may appear only once.","Usually <b>/64<\/b> per LAN: 64-bit network prefix + 64-bit <b>interface ID<\/b>.","<b>Unicast<\/b>: <b>global unicast<\/b> 2000::/3 (Internet-routable), <b>link-local<\/b> FE80::/10 (auto-created on every IPv6 interface, never routed), <b>unique local<\/b> FC00::/7 (private-like), loopback <code>::1<\/code>, unspecified <code>::<\/code>.","<b>Multicast<\/b> FF00::/8: FF02::1 all nodes, FF02::2 all routers, <b>solicited-node<\/b> FF02::1:FFxx:xxxx (used for address resolution). <b>Anycast<\/b>: one address on several devices; the nearest answers.","<b>No broadcast<\/b> in IPv6 — multicast replaces it.","<b>EUI-64<\/b> interface ID: split the 48-bit MAC, insert <b>FFFE<\/b> in the middle and flip the 7th bit (U/L). MAC 00-1E-10-AA-BB-CC → 021E:10FF:FEAA:BBCC.","IPv6 header: fixed <b>40 bytes<\/b>, simpler (Version, Traffic Class, Flow Label, Payload Length, <b>Next Header<\/b>, <b>Hop Limit<\/b>, addresses); options move to extension headers; routers don't fragment.","Why IPv6: address exhaustion, no NAT needed, auto-configuration, simpler header, built-in support for IPsec."],"video":"IPv6 address types compression explained","do":{"kind":"drill","ref":"ipv6","text":"IPv6 compression drill: compress and expand 10 addresses."},"teach":"Explain the two compression rules and why :: can only be used once.","simple":["IPv4 ran out of addresses, so <b>IPv6<\/b> uses 128 bits — written as 8 groups of 4 hex digits: <code>2001:0DB8:0000:0001:0000:0000:0000:0010<\/code>.","That's long, so there are two shortening rules. <b>Rule 1<\/b>: drop leading zeros in each group (<code>0DB8<\/code> → <code>DB8<\/code>, <code>0000<\/code> → <code>0<\/code>). <b>Rule 2<\/b>: replace ONE run of consecutive all-zero groups with <code>::<\/code>. Result: <code>2001:DB8:0:1::10<\/code>. Only once, because otherwise you couldn't tell how many zeros each :: hides.","LANs normally use <b>/64<\/b>: the first 64 bits are the network (prefix), the last 64 bits identify the device (interface ID).","Address types to recognise by their start: <b>2000::/3<\/b> (starts with 2 or 3) = global unicast, like a public IPv4. <b>FE80::/10<\/b> = link-local, automatically on every interface, only works on that link. <b>FC00::/7<\/b> (FD…) = unique local, like private IPv4. <b>FF00::/8<\/b> = multicast. <b>::1<\/b> = loopback.","IPv6 has <b>no broadcast<\/b>; it uses multicast instead. Its header is a fixed 40 bytes and simpler than IPv4's (TTL becomes <b>Hop Limit<\/b>)."],"terms":[["Prefix","The network part, e.g. 2001:DB8:1::/64."],["Interface ID","The host part (last 64 bits)."],["Link-local","FE80:: address, valid only on one link."],["Global unicast","Internet-routable, 2000::/3."],["::","Stands for one run of zero groups."]],"visuals":[{"type":"flow","title":"Compressing 2001:0DB8:0000:0000:0000:0000:0000:0001","steps":[["Start","2001:0DB8:0000:0000:0000:0000:0000:0001","muted"],["Rule 1","2001:DB8:0:0:0:0:0:1","datacom"],["Rule 2","2001:DB8::1","sec"]]},{"type":"stack","title":"Recognise the type from the first digits","rows":[["2… / 3…","global unicast 2000::/3","datacom"],["FE80::","link-local (every interface)","wlan"],["FC… / FD…","unique local (private-like)","sec"],["FF…","multicast (FF02::1 all nodes, FF02::2 all routers)","dcn"],["::1 / ::","loopback / unspecified","muted"]]}],"cards":[{"id":"L28-c1","q":"IPv6 address length","a":"128 bits."},{"id":"L28-c2","q":"Compress 2001:0DB8:0000:0000:0000:0000:0000:0001","a":"2001:DB8::1."},{"id":"L28-c3","q":"Link-local prefix","a":"FE80::/10."},{"id":"L28-c4","q":"Global unicast range","a":"2000::/3."},{"id":"L28-c5","q":"Unique local range","a":"FC00::/7."},{"id":"L28-c6","q":"Multicast prefix","a":"FF00::/8."},{"id":"L28-c7","q":"FF02::1 / FF02::2","a":"All nodes / all routers."},{"id":"L28-c8","q":"IPv6 loopback","a":"::1."},{"id":"L28-c9","q":"Does IPv6 have broadcast?","a":"No — multicast replaces it."},{"id":"L28-c10","q":"EUI-64 inserts which value into the MAC?","a":"FFFE in the middle (and flips the 7th bit)."},{"id":"L28-c11","q":"IPv6 base header size","a":"40 bytes (fixed)."}],"qs":[{"id":"L28-q1","t":"one","q":"Which is a valid compression of 2001:0DB8:0000:0000:0001:0000:0000:0001?","o":["2001:DB8::1::1","2001:DB8::1:0:0:1","2001:DB8:0:0:1::1:1","2001:DB8::1:1"],"a":[1],"e":":: can be used only once; here it replaces the first run of zero groups."},{"id":"L28-q2","t":"one","q":"Which address type is automatically configured on every IPv6-enabled interface?","o":["Global unicast","Link-local (FE80::/10)","Unique local","Anycast"],"a":[1],"e":"Every IPv6 interface gets a link-local address."},{"id":"L28-q3","t":"tf","q":"IPv6 uses broadcast addresses for neighbour discovery.","o":["True","False"],"a":[1],"e":"IPv6 has no broadcast; NDP uses solicited-node multicast."},{"id":"L28-q4","t":"multi","q":"Which are IPv6 multicast addresses?","o":["FF02::1","FE80::1","FF02::1:FF00:1","2001:DB8::1"],"a":[0,2],"e":"FF00::/8 is multicast; FE80:: is link-local unicast."},{"id":"L28-q5","t":"one","q":"How long is the IPv6 basic header?","o":["20 bytes","32 bytes","40 bytes","Variable, up to 60 bytes"],"a":[2],"e":"Fixed 40 bytes; options go into extension headers."},{"id":"L28-q6","t":"one","q":"Which IPv6 header field replaces IPv4's TTL?","o":["Flow Label","Hop Limit","Next Header","Traffic Class"],"a":[1],"e":"Hop Limit."}]},{"id":"L29","week":3,"domain":"datacom","pri":2,"mins":20,"title":"IPv6 configuration: NDP, SLAAC, DHCPv6 and IPv6 routing","book":"Ch 13 · §13.3–13.5 · pp. 421–438","hook":{"analogy":"SLAAC is a new student who asks the teacher “what's this classroom's code?” (RS), hears the answer (RA prefix), writes their own name after it (interface ID), then asks “is anyone else called that?” (DAD).","mnemonic":"NDP ICMPv6 types: RS 133, RA 134, NS 135, NA 136, Redirect 137. RA flags: M=1 → stateful DHCPv6; O=1 → other info via DHCPv6.","diagram":{"type":"seq","actors":["Host","Router"],"steps":[[0,1,"RS (ICMPv6 133)","to FF02::2"],[1,0,"RA (ICMPv6 134)","prefix 2001:DB8:1::/64, M/O flags"],[0,0,"build address = prefix + interface ID",""],[0,1,"NS for DAD (135)","anyone using this address?"],[0,0,"no NA → address is unique ✓",""]]}},"learn":["<b>NDP<\/b> (Neighbor Discovery Protocol) runs over <b>ICMPv6<\/b> and replaces ARP plus more: <b>RS 133<\/b>, <b>RA 134<\/b>, <b>NS 135<\/b>, <b>NA 136<\/b>, Redirect 137.","Address resolution: send NS to the target's solicited-node multicast address; the target replies with NA (its MAC).","<b>DAD<\/b> (Duplicate Address Detection): before using an address, a host sends an NS for it; if an NA comes back, the address is a duplicate.","Address configuration: <b>manual<\/b>; <b>SLAAC<\/b> (stateless — prefix from RA + self-generated interface ID via EUI-64 or random); <b>stateful DHCPv6<\/b> (server assigns the address, M flag = 1); <b>stateless DHCPv6<\/b> (SLAAC address + DNS etc. from DHCPv6, O flag = 1).","Huawei config: <code>ipv6<\/code> (system view) → interface: <code>ipv6 enable<\/code> → <code>ipv6 address 2001:DB8:1::1 64<\/code> or <code>ipv6 address auto link-local<\/code> / <code>ipv6 address auto global<\/code>. Routers send RAs only after <code>undo ipv6 nd ra halt<\/code>.","Static IPv6 route: <code>ipv6 route-static 2001:DB8:2:: 64 2001:DB8:12::2<\/code>. Default: <code>ipv6 route-static :: 0 &lt;next-hop&gt;<\/code>.","Dynamic: <b>OSPFv3<\/b> (<code>ospfv3 1<\/code> → <code>router-id 1.1.1.1<\/code>; interface: <code>ospfv3 1 area 0<\/code>), RIPng, IS-IS for IPv6, BGP4+.","Check: <code>display ipv6 interface brief<\/code>, <code>display ipv6 neighbors<\/code>, <code>display ipv6 routing-table<\/code>, <code>ping ipv6 …<\/code>."],"video":"IPv6 SLAAC NDP router advertisement explained","do":{"kind":"lab","ref":"LAB9","text":"Lab 9: two routers, IPv6 static routing plus SLAAC on a PC LAN. Capture the RS/RA exchange in Wireshark."},"teach":"Explain the difference between SLAAC, stateless DHCPv6 and stateful DHCPv6 using the M and O flags.","simple":["IPv6 replaces ARP with <b>NDP<\/b> (Neighbor Discovery), which uses ICMPv6 messages. To find a neighbour's MAC, a host sends a <b>Neighbor Solicitation<\/b> (NS); the owner answers with a <b>Neighbor Advertisement<\/b> (NA).","Routers announce themselves and the network prefix with <b>Router Advertisements<\/b> (RA). A host that just woke up can ask for one immediately with a <b>Router Solicitation<\/b> (RS).","With <b>SLAAC<\/b>, a host builds its own address: prefix from the RA + its own interface ID (from its MAC via EUI-64, or random). Before using it, it checks nobody else has it (<b>DAD<\/b> — it sends an NS for its own address; if someone answers, it's a duplicate).","Flags in the RA tell hosts what else to do: <b>M=1<\/b> → get the address from a DHCPv6 server (stateful). <b>O=1<\/b> → get other info like DNS from DHCPv6 (stateless).","Huawei gotcha: router interfaces don't send RAs until you type <code>undo ipv6 nd ra halt<\/code>."],"terms":[["NDP","IPv6 neighbour discovery (replaces ARP)."],["RS / RA","Router Solicitation / Advertisement."],["NS / NA","Neighbor Solicitation / Advertisement."],["SLAAC","Hosts create their own address from the RA prefix."],["DAD","Duplicate Address Detection."]],"visuals":[{"type":"compare","title":"Ways to get an IPv6 address","cols":[["Manual","muted",["You type it","Routers, servers"]],["SLAAC","datacom",["RA prefix + own interface ID","No server needed"]],["Stateless DHCPv6 (O=1)","wlan",["Address via SLAAC","DNS etc. from DHCPv6"]],["Stateful DHCPv6 (M=1)","sec",["Server assigns the address","Like DHCP in IPv4"]]]}],"cards":[{"id":"L29-c1","q":"NDP message types (ICMPv6)","a":"RS 133, RA 134, NS 135, NA 136, Redirect 137."},{"id":"L29-c2","q":"What replaces ARP in IPv6?","a":"NDP Neighbor Solicitation / Advertisement."},{"id":"L29-c3","q":"DAD","a":"Duplicate Address Detection — the host sends an NS for its own tentative address."},{"id":"L29-c4","q":"RA M flag = 1 means…","a":"Use stateful DHCPv6 for addresses."},{"id":"L29-c5","q":"RA O flag = 1 means…","a":"Get other settings (e.g. DNS) from DHCPv6."},{"id":"L29-c6","q":"Let a Huawei router send RAs","a":"undo ipv6 nd ra halt (interface)"},{"id":"L29-c7","q":"IPv6 default static route","a":"ipv6 route-static :: 0 &lt;next-hop&gt;"},{"id":"L29-c8","q":"Enable OSPFv3 on an interface in area 0","a":"ospfv3 1 area 0"}],"qs":[{"id":"L29-q1","t":"one","q":"Which ICMPv6 message does a host send to ask routers for a prefix?","o":["NS","NA","RS","RA"],"a":[2],"e":"Router Solicitation (133)."},{"id":"L29-q2","t":"one","q":"A host forms its address from the RA prefix plus its own interface ID, and gets no address from a server. This is…","o":["Stateful DHCPv6","SLAAC","Manual","DHCP relay"],"a":[1],"e":"Stateless address autoconfiguration."},{"id":"L29-q3","t":"tf","q":"In IPv6, Duplicate Address Detection uses Neighbor Solicitation messages.","o":["True","False"],"a":[0],"e":"The host solicits its own tentative address."},{"id":"L29-q4","t":"multi","q":"Which protocols can carry IPv6 routes?","o":["OSPFv3","RIPng","OSPFv2","BGP4+"],"a":[0,1,3],"e":"OSPFv2 is IPv4-only."},{"id":"L29-q5","t":"one","q":"Which Huawei command enables a router interface to send Router Advertisements?","o":["ipv6 nd ra enable","undo ipv6 nd ra halt","ipv6 ra send","ipv6 enable ra"],"a":[1],"e":"RA is halted by default."}]},{"id":"L30","week":3,"domain":"datacom","pri":3,"mins":15,"title":"WAN basics: PPP, PAP/CHAP and PPPoE","book":"Ch 14 · pp. 441–467","hook":{"analogy":"PAP is shouting your password across the room. CHAP is the server sending a puzzle and you answering with the solution — the password itself never travels.","mnemonic":"PPP phases: Dead → Establish (LCP) → Authenticate (PAP/CHAP) → Network (NCP/IPCP) → Terminate. PPPoE discovery: PADI, PADO, PADR, PADS (… PADT ends it).","diagram":{"type":"seq","actors":["Client (authenticatee)","Server (authenticator)"],"steps":[[1,0,"CHAP Challenge","random number"],[0,1,"CHAP Response","MD5(ID + password + challenge)"],[1,0,"Success","hash matches"],[0,1,"IPCP","negotiate IP address"]]}},"learn":["<b>PPP<\/b> is a Layer 2 protocol for point-to-point links. <b>LCP<\/b> sets up the link (MRU, authentication method, magic number to detect loops); <b>NCP<\/b> (e.g. <b>IPCP<\/b>) negotiates the network layer (IP addresses).","<b>PAP<\/b>: two-way handshake, password sent in <b>plain text<\/b>, the client initiates.","<b>CHAP<\/b>: three-way handshake (challenge → response → success/failure), only an <b>MD5 hash<\/b> is sent; the server initiates and can re-challenge. CHAP is more secure.","Huawei: <code>link-protocol ppp<\/code>; authenticator: <code>ppp authentication-mode chap<\/code> + local user with <code>service-type ppp<\/code>; client: <code>ppp chap user R2<\/code> + <code>ppp chap password cipher …<\/code>.","<b>PPPoE<\/b> carries PPP over Ethernet (home broadband). Discovery stage: <b>PADI<\/b> (broadcast) → <b>PADO<\/b> → <b>PADR<\/b> → <b>PADS<\/b> (session ID); then the PPP session stage; <b>PADT<\/b> ends it. MTU 1492 (8 bytes of overhead).","On Huawei, a PPPoE client is a <b>Dialer<\/b> interface bound to the Ethernet port, usually combined with Easy IP NAT and a default route via the dialer."],"video":"PPP PAP vs CHAP authentication explained","do":{"kind":"think","text":"Write the order of PPP phases and PPPoE discovery messages from memory, then check the hook."},"teach":"Explain why CHAP is more secure than PAP.","simple":["<b>PPP<\/b> is a simple Layer 2 protocol for point-to-point links (like old serial lines or broadband connections). It sets up the link with <b>LCP<\/b>, optionally checks a password, then sets up IP with <b>IPCP<\/b>.","Two password methods: <b>PAP<\/b> just sends username and password in plain text (2 steps). <b>CHAP<\/b> is smarter: the server sends a random challenge, the client replies with a hash (MD5) of the challenge + password, and the server checks it. The password itself never crosses the wire (3 steps).","<b>PPPoE<\/b> runs PPP over Ethernet — that's how many home broadband connections log in to the ISP. It first discovers the ISP's server (PADI → PADO → PADR → PADS), then runs a normal PPP session. Its MTU is 1492 because of 8 bytes of extra headers."],"terms":[["LCP","Sets up and tests the PPP link."],["IPCP","Negotiates IP over PPP."],["PAP","Plain-text password, 2-way."],["CHAP","Challenge + hash, 3-way."],["PPPoE","PPP carried over Ethernet."]],"visuals":[{"type":"flow","title":"PPP link phases","steps":[["Dead","link down","muted"],["Establish","LCP negotiation","datacom"],["Authenticate","PAP / CHAP","sec"],["Network","IPCP gives IP","wlan"],["Terminate","close","muted"]]}],"cards":[{"id":"L30-c1","q":"PPP sub-protocols","a":"LCP (link control) and NCP (e.g. IPCP for IP)."},{"id":"L30-c2","q":"PAP handshake and security","a":"2-way, password in plain text."},{"id":"L30-c3","q":"CHAP handshake","a":"3-way: challenge, response (MD5 hash), success/failure."},{"id":"L30-c4","q":"Who initiates CHAP authentication?","a":"The authenticator (server) sends the challenge."},{"id":"L30-c5","q":"PPPoE discovery messages","a":"PADI, PADO, PADR, PADS (PADT terminates)."},{"id":"L30-c6","q":"PPPoE MTU","a":"1492 bytes."}],"qs":[{"id":"L30-q1","t":"one","q":"Which PPP authentication protocol sends the password in clear text?","o":["CHAP","PAP","EAP-TLS","MS-CHAPv2"],"a":[1],"e":"PAP sends the password itself."},{"id":"L30-q2","t":"one","q":"Which PPP component negotiates IP addresses?","o":["LCP","IPCP (an NCP)","CHAP","PADI"],"a":[1],"e":"IPCP is the NCP for IPv4."},{"id":"L30-q3","t":"tf","q":"CHAP uses a three-way handshake and transmits a hash instead of the password.","o":["True","False"],"a":[0],"e":"Challenge, response, success/failure."},{"id":"L30-q4","t":"one","q":"What is the first message a PPPoE client broadcasts?","o":["PADO","PADR","PADI","PADS"],"a":[2],"e":"PPPoE Active Discovery Initiation."},{"id":"L30-q5","t":"multi","q":"Which happen during the PPP LCP phase?","o":["Negotiating the authentication protocol","Negotiating MRU","Assigning the IP address","Detecting loopbacks using the magic number"],"a":[0,1,3],"e":"IP assignment is IPCP (NCP phase)."}]},{"id":"L31","week":3,"domain":"security","pri":1,"mins":25,"title":"Firewalls: security zones, policies and the session table","book":"Beyond the textbook — HCIA-Security level (Huawei USG/HiSecEngine firewalls)","hook":{"analogy":"A stateful firewall is a building guard with a visitor log: once someone from inside is let out, their return is allowed automatically because it matches the log (the session table).","mnemonic":"Zone priorities: Local 100 · Trust 85 · DMZ 50 · Untrust 5. Traffic between zones needs a security policy; return traffic follows the session.","diagram":{"type":"topo","w":620,"h":230,"nodes":[["FW","fw",310,110],["LAN (Trust 85)","pc",90,110],["Internet (Untrust 5)","cloud",540,110],["Servers (DMZ 50)","server",310,205]],"links":[["LAN (Trust 85)","FW","G1/0/1"],["FW","Internet (Untrust 5)","G1/0/2"],["FW","Servers (DMZ 50)","G1/0/3"]],"path":["LAN (Trust 85)","FW","Internet (Untrust 5)"]}},"learn":["Firewall generations: <b>packet filtering<\/b> (stateless ACLs) → <b>stateful inspection<\/b> (tracks sessions) → <b>application/proxy<\/b> → <b>NGFW/UTM<\/b> (application identification, IPS, antivirus, URL filtering).","A <b>security zone<\/b> is a group of interfaces with the same trust level. Huawei default zones and priorities: <b>Local 100<\/b> (the firewall itself), <b>Trust 85<\/b>, <b>DMZ 50<\/b>, <b>Untrust 5<\/b>. An interface must be added to a zone to forward traffic: <code>firewall zone trust<\/code> → <code>add interface GigabitEthernet1/0/1<\/code>.","Traffic <b>between zones<\/b> (interzone) is controlled by <b>security policies<\/b>; by default the firewall denies it. A policy matches source/destination zone, addresses, service, application, user, time → action permit/deny.","Example: <code>security-policy<\/code> → <code>rule name trust_to_untrust<\/code> → <code>source-zone trust<\/code> → <code>destination-zone untrust<\/code> → <code>source-address 10.1.1.0 24<\/code> → <code>action permit<\/code>.","<b>Stateful<\/b>: the first packet is checked against the policies and creates a <b>session<\/b> entry (5-tuple). Later packets — including the <b>return traffic<\/b> — match the session and are fast-forwarded. So you only need a policy in the direction that starts the connection. <code>display firewall session table<\/code>.","<b>ASPF<\/b> inspects multi-channel protocols (e.g. FTP) to open the dynamic data channel automatically.","Firewalls also do NAT (source NAT, NAT Server), VPNs, and <b>hot standby<\/b> (two firewalls synchronised with HRP, often with VRRP).","Put public servers in a <b>DMZ<\/b> so a compromise doesn't expose the internal Trust zone."],"video":"stateful firewall security zones session table explained","do":{"kind":"think","text":"Write the security policies needed so LAN users can browse the Internet and the Internet can reach only the web server in the DMZ on TCP 443. How many rules? Which direction is each?"},"teach":"Explain why a stateful firewall doesn't need a policy for return traffic.","simple":["A firewall sits between areas of different trust and decides what may cross. Huawei firewalls group interfaces into <b>security zones<\/b>: <b>Trust<\/b> (your LAN, priority 85), <b>Untrust<\/b> (the Internet, 5), <b>DMZ<\/b> (public servers, 50) and <b>Local<\/b> (the firewall itself, 100). An interface that isn't in any zone can't pass traffic at all.","By default, nothing may go from one zone to another. You open paths with <b>security policies<\/b>: “from Trust to Untrust, source 10.1.1.0/24, allow”.","Modern firewalls are <b>stateful<\/b>. When the first packet of a connection is allowed, the firewall writes a <b>session<\/b> entry (who, to whom, which ports). Replies match that session and are let back in automatically. So you only write a policy for the direction that <b>starts<\/b> the conversation.","Put public servers in the <b>DMZ<\/b>: Internet users may reach them, but if a server is hacked the attacker is still outside your Trust zone."],"terms":[["Security zone","Group of interfaces with the same trust level."],["Security policy","Rule allowing/denying traffic between zones."],["Session table","List of active, allowed connections."],["DMZ","Zone for servers reachable from the Internet."],["Stateful","Remembers connections."]],"visuals":[{"type":"stack","title":"Huawei zones by priority","rows":[["Local · 100","the firewall itself","dcn"],["Trust · 85","internal users","datacom"],["DMZ · 50","public servers","wlan"],["Untrust · 5","the Internet","sec"]]},{"type":"seq","title":"Stateful inspection","actors":["PC (Trust)","Firewall","Web (Untrust)"],"steps":[[0,1,"first packet","check policy → permit"],[1,1,"create session entry",""],[1,2,"forward",""],[2,1,"reply","matches session"],[1,0,"allowed back automatically","no policy needed"]]}],"cards":[{"id":"L31-c1","q":"Huawei default zone priorities","a":"Local 100, Trust 85, DMZ 50, Untrust 5."},{"id":"L31-c2","q":"Which zone represents the firewall itself?","a":"Local."},{"id":"L31-c3","q":"What controls traffic between zones?","a":"Security policies."},{"id":"L31-c4","q":"Session table","a":"Records the 5-tuple of allowed connections so return packets are forwarded without re-checking the policy."},{"id":"L31-c5","q":"Where should public-facing servers go?","a":"In the DMZ."},{"id":"L31-c6","q":"Why do firewalls use ASPF?","a":"To handle multi-channel protocols like FTP that open dynamic ports."},{"id":"L31-c7","q":"Add an interface to the trust zone","a":"firewall zone trust → add interface &lt;if&gt;"},{"id":"L31-c8","q":"Stateless vs stateful filtering","a":"Stateless checks each packet alone; stateful tracks connections (sessions)."}],"qs":[{"id":"L31-q1","t":"one","q":"What is the default priority of the Untrust zone on a Huawei firewall?","o":["5","50","85","100"],"a":[0],"e":"Local 100, Trust 85, DMZ 50, Untrust 5."},{"id":"L31-q2","t":"tf","q":"With a stateful firewall, return traffic of an allowed connection is permitted by matching the session table.","o":["True","False"],"a":[0],"e":"Only the initiating direction needs a policy."},{"id":"L31-q3","t":"one","q":"Which zone should host a company's public web server?","o":["Trust","Local","DMZ","Untrust"],"a":[2],"e":"The DMZ isolates public servers from the inside."},{"id":"L31-q4","t":"multi","q":"Which can a security policy rule match on?","o":["Source zone","Destination zone","Service/port","Application"],"a":[0,1,2,3],"e":"All of these can be used."},{"id":"L31-q5","t":"one","q":"An interface is configured with an IP but is in no security zone. What happens to traffic through it?","o":["It is forwarded normally","It cannot be forwarded by the firewall","It goes to the Trust zone automatically","It is sent to the DMZ"],"a":[1],"e":"Interfaces must belong to a zone to forward traffic."},{"id":"L31-q6","t":"one","q":"Which firewall type tracks the state of each connection?","o":["Packet filtering","Stateful inspection","Hub-based","Layer 1"],"a":[1],"e":"Stateful firewalls use a session table."},{"id":"L31-q7","t":"one","q":"Traffic from the Trust zone to the Untrust zone is called…","o":["Inbound","Outbound","Local","Intra-zone"],"a":[1],"e":"Huawei names direction by zone priority: higher (Trust 85) → lower (Untrust 5) = outbound."},{"id":"L31-q8","t":"tf","q":"A packet-filtering (stateless) firewall needs rules for both directions of a connection.","o":["True","False"],"a":[0],"e":"Without a session table, the return traffic must also be allowed explicitly."},{"id":"L31-q9","t":"one","q":"Which command shows active connections on a Huawei firewall?","o":["display firewall session table","display nat session all","display acl all","display ip pool"],"a":[0],"e":"The session table lists the 5-tuple of each connection the firewall is tracking."}]},{"id":"L32","week":3,"domain":"security","pri":2,"mins":20,"title":"VPNs and IPsec, plus common network attacks","book":"Beyond the textbook — HCIA-Security / HCIA-Datacom level","hook":{"analogy":"A VPN is a private, armoured tunnel through a public motorway. IKE is the two drivers agreeing on the lock and keys; ESP is the armour.","mnemonic":"AH = 51 (Authentication only, breaks NAT). ESP = 50 (Encrypts + authenticates). IKE = UDP 500 (NAT-T 4500). GRE = 47 (no encryption).","diagram":{"type":"topo","w":620,"h":190,"nodes":[["HQ LAN","pc",60,95],["FW-HQ","fw",190,95],["Internet","cloud",310,95],["FW-Branch","fw",430,95],["Branch LAN","pc",560,95]],"links":[["HQ LAN","FW-HQ"],["FW-HQ","Internet","IPsec tunnel (ESP)"],["Internet","FW-Branch","IPsec tunnel (ESP)"],["FW-Branch","Branch LAN"]],"path":["HQ LAN","FW-HQ","Internet","FW-Branch","Branch LAN"]}},"learn":["<b>VPN<\/b> types: <b>site-to-site<\/b> (branch ↔ HQ: IPsec, GRE over IPsec) and <b>remote access<\/b> (users: SSL VPN, L2TP over IPsec). Enterprise WAN overlays also use MPLS VPN and SD-WAN.","<b>IPsec<\/b> gives confidentiality, integrity, data-origin authentication and anti-replay. <b>AH<\/b> (IP protocol 51): integrity + authentication, <b>no encryption<\/b>, and it can't pass NAT. <b>ESP<\/b> (protocol 50): encryption + integrity — the usual choice.","Modes: <b>tunnel<\/b> (whole original packet encrypted, new IP header — site-to-site) vs <b>transport<\/b> (only the payload — host-to-host).","<b>IKE<\/b> (UDP 500; <b>4500<\/b> with NAT traversal) negotiates keys automatically. Phase 1 builds an IKE SA (secure channel); phase 2 builds the IPsec SAs. An <b>SA<\/b> is one-way, identified by SPI + destination + protocol.","<b>GRE<\/b> (IP protocol 47) tunnels any protocol including multicast (so routing protocols work) but doesn't encrypt → <b>GRE over IPsec<\/b>.","Common attacks: <b>DoS/DDoS<\/b> (SYN flood, ICMP flood), <b>IP spoofing<\/b>, <b>MAC flooding<\/b> (fills the MAC table), <b>ARP spoofing<\/b> (man-in-the-middle), <b>DHCP starvation/rogue DHCP<\/b>, password brute force, phishing, malware.","Matching defences: firewalls/IPS, anti-DDoS, <b>port security<\/b>, <b>DHCP snooping<\/b>, <b>Dynamic ARP Inspection / IPSG<\/b>, strong AAA, patching, network segmentation (VLANs, zones).","Security goals: <b>CIA<\/b> — Confidentiality, Integrity, Availability. Cryptography: symmetric (AES, fast, for bulk data), asymmetric (RSA/ECC, for key exchange and signatures), hashes (SHA-256) for integrity."],"video":"IPsec VPN explained IKE ESP AH tunnel mode","do":{"kind":"think","text":"Match each attack (MAC flooding, ARP spoofing, rogue DHCP server, SYN flood) to the feature that stops it."},"teach":"Explain the difference between AH and ESP, and why GRE over IPsec is used.","simple":["A <b>VPN<\/b> builds a private tunnel across the public Internet, so branch offices or home workers can reach the company network safely.","<b>IPsec<\/b> is the standard for this. Before sending data, the two sides use <b>IKE<\/b> (UDP 500) to agree on encryption methods and create keys. Then data is protected with <b>ESP<\/b> (encrypts + checks integrity) — or <b>AH<\/b>, which only checks integrity and breaks with NAT, so ESP is the usual choice.","<b>Tunnel mode<\/b> wraps the entire original packet inside a new one (site-to-site gateways). <b>Transport mode<\/b> protects only the payload (host-to-host).","<b>GRE<\/b> tunnels can carry anything, including routing protocol multicasts, but don't encrypt. So engineers often run <b>GRE over IPsec<\/b>: GRE for flexibility, IPsec for security.","Know the classic attacks and their fixes: MAC flooding → port security; ARP spoofing → ARP inspection; rogue DHCP → DHCP snooping; DoS floods → firewalls/anti-DDoS. Security aims for <b>CIA<\/b>: Confidentiality, Integrity, Availability."],"terms":[["IKE","Negotiates IPsec keys (UDP 500/4500)."],["ESP / AH","Encrypt+integrity / integrity only."],["SA","One-way security agreement between peers."],["GRE","Generic tunnel, no

encryption (IP proto 47)."],["CIA","Confidentiality, Integrity, Availability."]],"visuals":[{"type":"nest","title":"IPsec tunnel mode packet","layers":[["New IP header (gateway A → gateway B)","muted"],["ESP header … ESP trailer + auth","sec"],["Original IP header (PC → server)  — encrypted","datacom"]],"inner":"Original data — encrypted"},{"type":"compare","title":"Attack → defence","cols":[["MAC flooding","sec",["→ port security (max MACs)"]],["ARP spoofing","sec",["→ DAI / ARP security"]],["Rogue DHCP server","sec",["→ DHCP snooping"]],["DDoS","sec",["→ firewall, anti-DDoS, rate limits"]]]}],"cards":[{"id":"L32-c1","q":"AH vs ESP","a":"AH (51): authentication/integrity, no encryption, breaks NAT. ESP (50): encryption + integrity."},{"id":"L32-c2","q":"IKE port (and with NAT-T)","a":"UDP 500 (UDP 4500 with NAT traversal)."},{"id":"L32-c3","q":"IPsec tunnel vs transport mode","a":"Tunnel: whole packet encrypted + new IP header (site-to-site). Transport: payload only (host-to-host)."},{"id":"L32-c4","q":"GRE IP protocol number","a":"47 — tunnels multicast/routing protocols but doesn't encrypt."},{"id":"L32-c5","q":"Why GRE over IPsec?","a":"GRE carries multicast (routing protocols), IPsec adds encryption."},{"id":"L32-c6","q":"Defence against rogue DHCP servers","a":"DHCP snooping (trusted ports only)."},{"id":"L32-c7","q":"Defence against ARP spoofing","a":"Dynamic ARP Inspection / ARP security, based on DHCP snooping bindings."},{"id":"L32-c8","q":"CIA triad","a":"Confidentiality, Integrity, Availability."},{"id":"L32-c9","q":"Symmetric vs asymmetric encryption","a":"Symmetric: one shared key, fast (AES). Asymmetric: public/private key pair (RSA), for key exchange and signatures."}],"qs":[{"id":"L32-q1","t":"one","q":"Which IPsec protocol provides encryption?","o":["AH","ESP","IKE","GRE"],"a":[1],"e":"AH doesn't encrypt."},{"id":"L32-q2","t":"tf","q":"AH can work through NAT devices without problems.","o":["True","False"],"a":[1],"e":"AH protects the IP header, which NAT changes, so authentication fails."},{"id":"L32-q3","t":"one","q":"Which IPsec mode is normally used for site-to-site VPNs between gateways?","o":["Transport mode","Tunnel mode","Bridge mode","Promiscuous mode"],"a":[1],"e":"Tunnel mode encapsulates the whole original packet."},{"id":"L32-q4","t":"multi","q":"Which statements about IKE are correct?","o":["It uses UDP port 500","It negotiates security associations and keys","It encrypts user data itself","It can use UDP 4500 for NAT traversal"],"a":[0,1,3],"e":"ESP encrypts user data; IKE negotiates."},{"id":"L32-q5","t":"one","q":"An attacker sends thousands of frames with fake source MACs so the switch floods all traffic. Which feature limits this?","o":["Port security (max MAC addresses)","OSPF authentication","NAT","VRRP"],"a":[0],"e":"MAC flooding is stopped by limiting learned MACs per port."},{"id":"L32-q6","t":"one","q":"Which tunnelling protocol can carry OSPF hellos (multicast) but provides no encryption?","o":["IPsec ESP","GRE","SSL VPN","AH"],"a":[1],"e":"GRE supports multicast; pair it with IPsec for encryption."},{"id":"L32-q7","t":"one","q":"Which security goal does a DDoS attack target?","o":["Confidentiality","Integrity","Availability","Non-repudiation"],"a":[2],"e":"DDoS makes services unavailable."},{"id":"L32-q8","t":"multi","q":"Which algorithms are symmetric encryption algorithms?","o":["AES","3DES","RSA","SM4"],"a":[0,1,3],"e":"RSA is asymmetric."},{"id":"L32-q9","t":"one","q":"Which is a hash algorithm used for integrity checking?","o":["AES-256","SHA-256","RSA-2048","Diffie-Hellman"],"a":[1],"e":"SHA-256 is a hash; AES is symmetric encryption; RSA and DH are asymmetric."}]},{"id":"L33","week":4,"domain":"wlan","pri":1,"mins":20,"title":"WLAN basics: 802.11 standards, bands, channels, SSIDs","book":"Ch 12 · §12.1 · pp. 361–365","hook":{"analogy":"Radio channels are lanes on a highway. In 2.4 GHz only three lanes don't overlap (1, 6, 11), so neighbouring APs must take different lanes or they crash into each other (interference).","mnemonic":"Wi-Fi 4 = 802.11n, Wi-Fi 5 = 802.11ac (5 GHz only), Wi-Fi 6 = 802.11ax (6E adds 6 GHz), Wi-Fi 7 = 802.11be.","diagram":{"type":"stack","title":"802.11 generations","rows":[["802.11b / g","2.4 GHz · 11 / 54 Mbit/s","muted"],["802.11a","5 GHz · 54 Mbit/s","muted"],["Wi-Fi 4 · 802.11n","2.4 + 5 GHz · up to 600 Mbit/s · MIMO","wlan"],["Wi-Fi 5 · 802.11ac","5 GHz · up to ~6.9 Gbit/s · MU-MIMO (downlink)","wlan"],["Wi-Fi 6 / 6E · 802.11ax","2.4 + 5 (+6) GHz · up to 9.6 Gbit/s · OFDMA","datacom"],["Wi-Fi 7 · 802.11be","2.4 + 5 + 6 GHz · 320 MHz channels · multi-link","sec"]]}},"learn":["<b>WLAN<\/b> uses radio waves under the IEEE <b>802.11<\/b> standards; “Wi-Fi” is the Wi-Fi Alliance brand. Medium access: <b>CSMA/CA<\/b> (avoid collisions, because radios can't detect them).","Bands: <b>2.4 GHz<\/b> (longer range, more interference, only 3 non-overlapping 20 MHz channels: <b>1, 6, 11<\/b>), <b>5 GHz<\/b> (many more channels, faster, shorter range), <b>6 GHz<\/b> (Wi-Fi 6E/7, very clean spectrum).","Wider channels (40/80/160/320 MHz) = more throughput but fewer non-overlapping channels.","<b>SSID<\/b> = network name users see. <b>BSSID<\/b> = the MAC address of an AP radio (identifies a BSS). <b>BSS<\/b> = one AP + its clients; <b>ESS<\/b> = several APs sharing one SSID so users can roam. <b>VAP<\/b> = a virtual AP — one SSID on one radio; one radio can run several VAPs.","Wi-Fi 6 (802.11ax) key techniques: <b>OFDMA<\/b> (many users per transmission), uplink+downlink <b>MU-MIMO<\/b>, 1024-QAM, <b>BSS colouring<\/b>, Target Wake Time (saves battery).","Interference sources: other APs on the same channel (co-channel), adjacent channels, microwaves, Bluetooth, walls/metal (attenuation).","Signal terms: <b>RSSI<\/b> (received signal strength, e.g. −65 dBm is good), SNR, coverage vs capacity."],"video":"WiFi 2.4GHz vs 5GHz channels 1 6 11 explained","do":{"kind":"think","text":"Plan channels for 6 APs in a corridor on 2.4 GHz so that neighbours never share a channel. Then say why you'd rather use 5 GHz there."},"teach":"Explain the difference between SSID, BSSID and VAP.","simple":["Wi-Fi sends data by radio, following the IEEE <b>802.11<\/b> standards. Since radios can't hear collisions while talking, Wi-Fi uses <b>CSMA/CA<\/b>: listen first, wait a random moment, then send.","There are three bands. <b>2.4 GHz<\/b> travels further and through walls better but is crowded, with only three channels that don't overlap (<b>1, 6, 11<\/b>). <b>5 GHz<\/b> has many more channels and more speed but shorter range. <b>6 GHz<\/b> (Wi-Fi 6E/7) is new, wide and clean.","Generations: Wi-Fi 4 = 802.11n, Wi-Fi 5 = 802.11ac (5 GHz only), Wi-Fi 6 = 802.11ax (OFDMA lets one transmission serve many users at once), Wi-Fi 7 = 802.11be.","Names: the <b>SSID<\/b> is the network name you see on your phone. The <b>BSSID<\/b> is the MAC address of the AP radio broadcasting it. One AP radio can broadcast several SSIDs — each is a <b>VAP<\/b> (virtual AP). Several APs with the same SSID form an <b>ESS<\/b>, so you can walk around and roam."],"terms":[["SSID","Network name."],["BSSID","MAC of the AP radio."],["VAP","One SSID on one radio."],["Channel","A slice of the band an AP uses."],["CSMA/CA","Listen-before-talk access method."]],"visuals":[{"type":"bar","title":"2.4 GHz channels 1–13: only 1, 6 and 11 don't overlap","segs":[["Ch 1",5,"datacom"],["2",1,"muted"],["3",1,"muted"],["4",1,"muted"],["5",1,"muted"],["Ch 6",5,"wlan"],["7",1,"muted"],["8",1,"muted"],["9",1,"muted"],["10",1,"muted"],["Ch 11",5,"sec"],["12",1,"muted"],["13",1,"muted"]]},{"type":"compare","title":"Bands compared","cols":[["2.4 GHz","sec",["Longest range","3 non-overlapping channels","Crowded (Bluetooth, microwaves)"]],["5 GHz","datacom",["Faster, many channels","Shorter range","Best for offices"]],["6 GHz","wlan",["Wi-Fi 6E / 7","Widest, cleanest","Shortest range"]]]}],"cards":[{"id":"L33-c1","q":"Non-overlapping 2.4 GHz channels","a":"1, 6, 11."},{"id":"L33-c2","q":"Wi-Fi 4 / 5 / 6 / 7 standards","a":"802.11n / 802.11ac / 802.11ax / 802.11be."},{"id":"L33-c3","q":"Which band does 802.11ac use?","a":"5 GHz only."},{"id":"L33-c4","q":"SSID vs BSSID","a":"SSID = network name; BSSID = MAC address of an AP radio."},{"id":"L33-c5","q":"VAP","a":"Virtual AP — one SSID service on a radio; one radio can host several."},{"id":"L33-c6","q":"WLAN medium access method","a":"CSMA/CA."},{"id":"L33-c7","q":"Key Wi-Fi 6 technology for multiple users per transmission","a":"OFDMA."},{"id":"L33-c8","q":"Band added by Wi-Fi 6E","a":"6 GHz."}],"qs":[{"id":"L33-q1","t":"one","q":"Which 2.4 GHz channels do not overlap each other?","o":["1, 2, 3","1, 6, 11","1, 5, 10","2, 7, 12"],"a":[1],"e":"With 20 MHz channels, 1/6/11 are the classic set."},{"id":"L33-q2","t":"one","q":"Which standard is marketed as Wi-Fi 6?","o":["802.11n","802.11ac","802.11ax","802.11be"],"a":[2],"e":"ax = Wi-Fi 6."},{"id":"L33-q3","t":"tf","q":"802.11ac works in both 2.4 GHz and 5 GHz.","o":["True","False"],"a":[1],"e":"802.11ac is 5 GHz only."},{"id":"L33-q4","t":"multi","q":"Which are Wi-Fi 6 (802.11ax) features?","o":["OFDMA","Uplink and downlink MU-MIMO","BSS colouring","CSMA/CD"],"a":[0,1,2],"e":"WLAN uses CSMA/CA, not CD."},{"id":"L33-q5","t":"one","q":"What uniquely identifies the radio of one AP in a BSS?","o":["SSID","BSSID","ESSID","VLAN ID"],"a":[1],"e":"BSSID = the radio's MAC."},{"id":"L33-q6","t":"one","q":"Why is 5 GHz usually preferred in dense offices?","o":["Longer range through walls","Many more non-overlapping channels","Lower cost","It doesn't need an AC"],"a":[1],"e":"More channels = less co-channel interference."},{"id":"L33-q7","t":"one","q":"Which frame does an AP send periodically to announce its SSID?","o":["Probe Request","Beacon","Association Request","Deauthentication"],"a":[1],"e":"Beacons advertise the BSS; stations listen for them in passive scanning."},{"id":"L33-q8","t":"tf","q":"Using 40 MHz channels in the 2.4 GHz band is recommended for dense deployments.","o":["True","False"],"a":[1],"e":"2.4 GHz has only ~3 non-overlapping 20 MHz channels; 40 MHz leaves almost none."},{"id":"L33-q9","t":"one","q":"A station shows RSSI of −85 dBm. What does this indicate?","o":["Excellent signal","Weak signal","No interference","Maximum transmit power"],"a":[1],"e":"Closer to 0 is stronger; −85 dBm is weak (−65 dBm or better is good)."},{"id":"L33-q10","t":"multi","q":"Which can cause WLAN interference?","o":["Neighbouring APs on the same channel","Microwave ovens (2.4 GHz)","Bluetooth devices","Using WPA3"],"a":[0,1,2],"e":"Security mode doesn't cause RF interference."}]},{"id":"L34","week":4,"domain":"wlan","pri":1,"mins":25,"title":"WLAN architecture: Fat/Fit/cloud AP, AC, CAPWAP, forwarding modes","book":"Ch 12 · §12.2 · pp. 365–377","hook":{"analogy":"Fit APs are like branch tills in a supermarket chain: they don't make decisions; head office (the AC) sends prices and rules down a private phone line (the CAPWAP tunnel).","mnemonic":"CAPWAP: UDP 5246 = control, UDP 5247 = data. Tunnel forwarding = user data goes through the AC; direct forwarding = user data goes straight onto the wired network.","diagram":{"type":"topo","w":620,"h":230,"nodes":[["AC","ac",470,60],["Core SW","l3sw",300,60],["Access SW (PoE)","sw",300,150],["AP1","ap",180,210],["AP2","ap",420,210],["Internet","cloud",100,60]],"links":[["AC","Core SW","bypass AC"],["Core SW","Access SW (PoE)"],["Access SW (PoE)","AP1"],["Access SW (PoE)","AP2"],["Core SW","Internet"]],"path":["AP1","Access SW (PoE)","Core SW","AC"]}},"learn":["<b>Fat AP<\/b>: standalone, configured one by one — homes and very small sites. <b>Fit AP<\/b>: managed by an <b>AC<\/b> (wireless access controller) — medium/large campuses. <b>Cloud AP<\/b>: managed by a cloud platform (e.g. iMaster NCE-Campus) — distributed branches. <b>Leader AP<\/b>: one AP manages a few others.","<b>CAPWAP<\/b> (Control And Provisioning of Wireless Access Points) runs between AC and AP over UDP: <b>5246 control<\/b> (always encrypted with DTLS optional), <b>5247 data<\/b>. It carries AP management, configuration and (in tunnel mode) user traffic.","<b>AC deployment<\/b>: <b>in-path<\/b> (inline: all traffic passes through the AC, which also acts as a switch/gateway) vs <b>bypass<\/b> (off-path: the AC hangs off the core switch; only management, or tunnelled data, goes to it). Bypass is most common in existing networks.","<b>Forwarding modes<\/b>: <b>direct forwarding<\/b> (local) — user data goes straight from the AP onto the wired network; only control goes via CAPWAP. <b>Tunnel forwarding<\/b> (centralised) — user data is CAPWAP-encapsulated to the AC; easy central control but the AC can become a bottleneck.","Networking: <b>Layer 2<\/b> (AC and APs in the same broadcast domain; AP finds the AC by broadcast) or <b>Layer 3<\/b> (different subnets; AP finds the AC by DHCP <b>Option 43<\/b> or DNS).","<b>PoE<\/b> powers APs over the Ethernet cable: 802.3af (15.4 W), 802.3at PoE+ (30 W), 802.3bt (60/90 W). The PSE is usually the access switch; the AP is the PD.","Two VLAN kinds: the <b>management VLAN<\/b> (CAPWAP between AC and AP) and <b>service VLANs<\/b> (user traffic for each SSID)."],"video":"CAPWAP fit AP fat AP wireless controller tunnel forwarding direct forwarding","do":{"kind":"think","text":"For a 3-storey office with an existing core switch and 30 APs, choose in-path or bypass AC and tunnel or direct forwarding — and justify each in one sentence."},"teach":"Explain the difference between direct and tunnel forwarding, and one pro and con of each.","simple":["At home one AP is enough and it's a <b>Fat AP<\/b>: it does everything itself. In a company with 50 APs you'd never configure each one, so you use <b>Fit APs<\/b> controlled by an <b>AC<\/b> (access controller). The AC holds all settings and pushes them to the APs.","AC and APs talk through a <b>CAPWAP<\/b> tunnel: UDP <b>5246<\/b> for control (configuration, status) and UDP <b>5247<\/b> for data (user traffic, if it's tunnelled).","Where does user traffic go? <b>Direct forwarding<\/b>: straight from the AP into the wired network (fast, AC stays light). <b>Tunnel forwarding<\/b>: wrapped in CAPWAP and sent through the AC (central control, but the AC can become a bottleneck).","Where is the AC placed? <b>In-path<\/b>: all traffic passes through it. <b>Bypass<\/b> (off-path): it hangs off the side of the core switch — easiest to add to an existing network.","APs get power through the network cable from a <b>PoE<\/b> switch, so you only run one cable to the ceiling."],"terms":[["Fit AP","AP managed by an AC."],["CAPWAP","AC–AP control/data tunnel, UDP 5246/5247."],["Tunnel forwarding","User data goes through the AC."],["Direct forwarding","User data goes straight to the wired LAN."],["PoE","Power over Ethernet."]],"visuals":[{"type":"compare","title":"Fat vs Fit vs cloud AP","cols":[["Fat AP","muted",["Standalone","Configured one by one","Home / tiny office"]],["Fit AP + AC","datacom",["AC pushes config via CAPWAP","Central management","Campus networks"]],["Cloud AP","wlan",["Managed from a cloud platform","Plug and play","Many small branches"]]]},{"type":"compare","title":"Direct vs tunnel forwarding","cols":[["Direct","wlan",["User data → wired LAN at the AP","AC carries only control","Scales well"]],["Tunnel","sec",["User data → CAPWAP → AC","Centralised control/security","AC may bottleneck"]]]}],"cards":[{"id":"L34-c1","q":"CAPWAP control and data ports","a":"UDP 5246 (control) and UDP 5247 (data)."},{"id":"L34-c2","q":"Fit AP vs cloud AP management","a":"Fit = managed by an AC; cloud AP = managed by a cloud platform."},{"id":"L34-c3","q":"Tunnel forwarding","a":"User data is encapsulated in CAPWAP and sent through the AC."},{"id":"L34-c4","q":"Direct forwarding","a":"User data goes straight from the AP onto the wired network; only control traffic via CAPWAP."},{"id":"L34-c5","q":"In-path vs bypass AC","a":"In-path: all traffic passes through the AC. Bypass: the AC hangs off the core switch."},{"id":"L34-c6","q":"How does an AP find an AC across Layer 3?","a":"DHCP Option 43 (AC IP list) or DNS; or a statically configured AC address."},{"id":"L34-c7","q":"PoE standards and power","a":"af 15.4 W, at 30 W, bt 60/90 W."},{"id":"L34-c8","q":"Two kinds of VLAN in a WLAN","a":"Management VLAN (CAPWAP) and service VLANs (user traffic)."}],"qs":[{"id":"L34-q1","t":"one","q":"Which UDP port carries CAPWAP control messages?","o":["5246","5247","1812","4789"],"a":[0],"e":"5246 control, 5247 data."},{"id":"L34-q2","t":"one","q":"AC and APs are on different subnets. How can APs learn the AC's IP address automatically?","o":["ARP","DHCP Option 43","STP","LACP"],"a":[1],"e":"Option 43 carries the AC address list (DNS is another option)."},{"id":"L34-q3","t":"tf","q":"In direct forwarding mode, wireless user data passes through the AC.","o":["True","False"],"a":[1],"e":"Only in tunnel forwarding does user data go through the AC."},{"id":"L34-q4","t":"multi","q":"Which statements about a bypass (off-path) AC are correct?","o":["The AC is connected to the side of the core/aggregation switch","All user traffic must pass through the AC","It is easy to add to an existing wired network","It can be combined with direct forwarding"],"a":[0,2,3],"e":"“All traffic passes through” describes in-path."},{"id":"L34-q5","t":"one","q":"Which AP type is best for many small branch offices managed centrally without an AC at each site?","o":["Fat AP","Cloud AP","Fit AP with local AC","Repeater"],"a":[1],"e":"Cloud management avoids per-site ACs."},{"id":"L34-q6","t":"one","q":"What maximum power does 802.3at (PoE+) provide per port at the PSE?","o":["15.4 W","30 W","60 W","90 W"],"a":[1],"e":"af 15.4, at 30, bt 60/90."},{"id":"L34-q7","t":"one","q":"In tunnel forwarding, how does a wireless user's data reach the wired network?","o":["Directly from the AP's uplink","Encapsulated in CAPWAP to the AC, which forwards it","Through the RADIUS server","Via the management VLAN only"],"a":[1],"e":"Tunnel = centralised forwarding through the AC."},{"id":"L34-q8","t":"tf","q":"A Fat AP needs an AC to work.","o":["True","False"],"a":[1],"e":"Fat APs are standalone."},{"id":"L34-q9","t":"one","q":"Which device supplies PoE power to an AP?","o":["PD","PSE (e.g. a PoE switch)","AC only","STA"],"a":[1],"e":"PSE = power sourcing equipment; the AP is the powered device (PD)."},{"id":"L34-q10","t":"multi","q":"Which traffic is always carried in the CAPWAP control tunnel?","o":["AP configuration delivered by the AC","AP status and keepalive information","All user data in direct forwarding mode","AP management messages"],"a":[0,1,3],"e":"In direct forwarding, user data bypasses the AC."}]},{"id":"L35","week":4,"domain":"wlan","pri":1,"mins":25,"title":"WLAN working process and Huawei AC configuration","book":"Ch 12 · §12.3–12.4 · pp. 377–401","hook":{"analogy":"Bringing an AP online is like a new employee's first day: find the office (discover the AC), get badged in (join/authentication), receive the handbook (configuration), then keep checking in (echo keepalives).","mnemonic":"Profile chain: regulatory-domain → AP group → VAP profile = SSID profile + security profile + service VLAN + forward mode.","diagram":{"type":"seq","actors":["AP","AC","STA (phone)"],"steps":[[0,1,"CAPWAP Discovery Request","broadcast / Option 43"],[1,0,"Discovery Response",""],[0,1,"Join Request","AP auth: MAC / SN / none"],[1,0,"Join Response + config",""],[2,0,"Probe / Beacon → Auth → Association","Wi-Fi scan + join"],[2,0,"WPA2/WPA3 4-way handshake","PSK or 802.1X"],[2,0,"DHCP → online ✓","service VLAN"]]}},"learn":["<b>AP online process<\/b>: 1) AP gets an IP (DHCP); 2) <b>discovers the AC<\/b> (static list, DHCP Option 43, DNS, or broadcast on L2); 3) builds the <b>CAPWAP tunnel<\/b> (Discovery → Join); 4) AC authenticates the AP (<code>ap auth-mode mac-auth | sn-auth | no-auth<\/code>); 5) upgrade if needed; 6) AC delivers configuration; 7) <b>Echo<\/b> (control) and <b>Keepalive<\/b> (data) messages maintain the tunnel.","<b>STA access<\/b>: <b>scanning<\/b> (passive: listen to Beacons; active: send Probe Requests) → <b>link authentication<\/b> (open system / shared key) → <b>association<\/b> → <b>access authentication<\/b> (WPA2/WPA3-PSK, 802.1X, Portal, MAC) → DHCP → online.","Huawei AC config skeleton: <code>capwap source interface vlanif 100<\/code> → <code>wlan<\/code> → <code>regulatory-domain-profile name default<\/code> + <code>country-code CN<\/code> → <code>ap-group name office<\/code> (bind the regulatory domain) → <code>ap-id 0 ap-mac xxxx-xxxx-xxxx<\/code> + <code>ap-group office<\/code>.","Service: <code>security-profile name sec1<\/code> + <code>security wpa2 psk pass-phrase Huawei@123 aes<\/code> → <code>ssid-profile name ssid1<\/code> + <code>ssid Staff<\/code> → <code>vap-profile name vap1<\/code> + <code>forward-mode tunnel<\/code> (or direct-forward) + <code>service-vlan vlan-id 101<\/code> + <code>ssid-profile ssid1<\/code> + <code>security-profile sec1<\/code> → in the AP group: <code>vap-profile vap1 wlan 1 radio all<\/code>.","Also needed: a DHCP pool for APs (management VLAN) and one for STAs (service VLAN); in L3 networking, Option 43 pointing to the AC.","Verify: <code>display ap all<\/code> (State <b>nor<\/b> = normal), <code>display vap ssid Staff<\/code>, <code>display station all<\/code>.","<b>Roaming<\/b>: a STA moves between APs in the same ESS keeping its IP. <b>Layer 2 roaming<\/b> = same service VLAN; <b>Layer 3 roaming<\/b> = different subnets, traffic is tunnelled back to the home AP/AC so the IP stays the same.","Radio management: channel and power calibration (Huawei radio calibration), band steering (push dual-band clients to 5 GHz), load balancing between APs."],"video":"Huawei AC AP configuration eNSP regulatory domain ssid profile vap profile","do":{"kind":"lab","ref":"LAB10","text":"Lab 10: AC6005 + AP + STA in eNSP. Bring the AP online (display ap all → nor), publish an SSID with WPA2-PSK, connect the STA and ping the gateway."},"teach":"Explain, in order, everything that has to happen before a phone can browse via a Fit AP.","simple":["Bringing a Fit AP online is a little story: the AP boots, gets an IP by DHCP, finds the AC (on the same LAN by broadcast, or across routers via <b>DHCP Option 43<\/b> which carries the AC's IP), and joins over CAPWAP. The AC checks if it's allowed (by MAC or serial number), sends it the configuration, and the AP shows as <b>nor<\/b> (normal) in <code>display ap all<\/code>.","On the AC, settings are built from <b>profiles<\/b> like LEGO bricks: a <b>regulatory domain profile<\/b> (country code → legal channels/power), an <b>SSID profile<\/b> (the name), a <b>security profile<\/b> (e.g. WPA2-PSK and its password), and a <b>VAP profile<\/b> that ties them together with the service VLAN and the forwarding mode. Finally you apply the VAP profile to an <b>AP group<\/b>.","A phone joining Wi-Fi goes through: <b>scanning<\/b> (listening to beacons or sending probes), <b>link authentication<\/b> + <b>association<\/b> (joining the AP), <b>access authentication<\/b> (the WPA2/WPA3 password or 802.1X login), and finally <b>DHCP<\/b> for an IP.","<b>Roaming<\/b>: walking between APs of the same SSID while keeping your IP. Same VLAN = Layer 2 roaming; different subnets = Layer 3 roaming (traffic is tunnelled back so the IP survives)."],"terms":[["Option 43","DHCP option that tells APs the AC's IP."],["AP group","APs that share the same profiles."],["VAP profile","Ties SSID + security + VLAN + forward mode."],["nor","AP state 'normal' — online."],["Roaming","Moving between APs without losing the session."]],"visuals":[{"type":"flow","title":"Huawei AC profile chain","steps":[["Regulatory domain","country code CN/…","muted"],["Security profile","wpa2 psk …","sec"],["SSID profile","ssid Staff","wlan"],["VAP profile","+ service VLAN + forward mode","datacom"],["AP group","vap-profile … wlan 1 radio all","dcn"]]},{"type":"flow","title":"A phone getting online","steps":[["Scan","beacons / probes","wlan"],["Associate","link auth + association","datacom"],["Authenticate","PSK or 802.1X","sec"],["DHCP","gets IP in service VLAN","dcn"]]}],"cards":[{"id":"L35-c1","q":"AP state that means “online” in display ap all","a":"nor (normal)."},{"id":"L35-c2","q":"Three AP authentication modes on a Huawei AC","a":"MAC authentication, SN authentication, no authentication."},{"id":"L35-c3","q":"Profiles referenced by a VAP profile","a":"SSID profile and security profile (+ service VLAN and forward mode)."},{"id":"L35-c4","q":"What does the regulatory-domain profile set?","a":"Country code (legal channels and power)."},{"id":"L35-c5","q":"Command that sets the CAPWAP source on the AC","a":"capwap source interface vlanif &lt;id&gt;"},{"id":"L35-c6","q":"Passive vs active scanning","a":"Passive: listen to Beacons. Active: send Probe Requests."},{"id":"L35-c7","q":"STA access steps","a":"Scan → link authentication → association → access authentication → DHCP."},{"id":"L35-c8","q":"Layer 2 vs Layer 3 roaming","a":"L2: same VLAN/subnet before and after. L3: different subnets; traffic tunnelled back so the IP is kept."},{"id":"L35-c9","q":"Bind VAP profile to all radios in an AP group","a":"vap-profile &lt;name&gt; wlan 1 radio all"}],"qs":[{"id":"L35-q1","t":"one","q":"In Huawei AC configuration, which profile contains the network name users see?","o":["Security profile","SSID profile","Regulatory domain profile","Radio profile"],"a":[1],"e":"The SSID profile sets the SSID."},{"id":"L35-q2","t":"one","q":"Which profile directly references both the SSID profile and the security profile?","o":["AP group","VAP profile","Regulatory domain profile","AP system profile"],"a":[1],"e":"The VAP profile ties SSID, security, service VLAN and forward mode together."},{"id":"L35-q3","t":"tf","q":"In passive scanning, a station listens for Beacon frames sent by APs.","o":["True","False"],"a":[0],"e":"Active scanning uses Probe Requests."},{"id":"L35-q4","t":"multi","q":"Which methods can an AP use to discover an AC?","o":["Static AC IP list","DHCP Option 43","DNS","LLDP-MED only"],"a":[0,1,2],"e":"Plus broadcast in Layer 2 networking."},{"id":"L35-q5","t":"one","q":"display ap all shows an AP in state “idle” or “fault” rather than “nor”. Which is a likely cause?","o":["The AP's MAC isn't added and auth-mode is mac-auth","The SSID is hidden","The STA has no IP","The VLAN tag is 802.1Q"],"a":[0],"e":"With MAC authentication, unknown APs aren't allowed to join."},{"id":"L35-q6","t":"one","q":"What is the correct order for a STA to get online?","o":["Association → scanning → DHCP → authentication","Scanning → link authentication → association → access authentication → DHCP","DHCP → scanning → association","Authentication → DHCP → scanning"],"a":[1],"e":"Scan, link auth, associate, then 802.1X/PSK, then DHCP."},{"id":"L35-q7","t":"one","q":"Which VAP profile setting decides whether user traffic goes through the AC?","o":["service-vlan","forward-mode","ssid-profile","country-code"],"a":[1],"e":"forward-mode tunnel / direct-forward."},{"id":"L35-q8","t":"tf","q":"In Layer 2 roaming, a station keeps the same IP address and stays in the same subnet.","o":["True","False"],"a":[0],"e":"Layer 3 roaming is when the APs serve different subnets."},{"id":"L35-q9","t":"one","q":"Which Huawei AC command lists APs and their states?","o":["display ap all","display station all","display wlan ssid","display capwap"],"a":[0],"e":"Look for State = nor."},{"id":"L35-q10","t":"multi","q":"Which are WLAN access authentication methods for stations?","o":["WPA2/WPA3-PSK","802.1X","Portal","STP"],"a":[0,1,2],"e":"STP isn't an authentication method."}]},{"id":"L36","week":4,"domain":"datacom","pri":2,"mins":20,"title":"VRRP: gateway redundancy","book":"Beyond the textbook — HCIA-Datacom level","hook":{"analogy":"VRRP is two receptionists sharing one desk phone number: the Master answers; if they faint, the Backup picks up the same number, and callers never notice.","mnemonic":"VRID 1–255 · default priority 100 · 255 = IP-address owner · preemption on · adverts every 1 s to 224.0.0.18 · IP protocol 112 · virtual MAC 0000-5E00-01xx.","diagram":{"type":"topo","w":620,"h":230,"nodes":[["R1 Master (120)","router",180,60],["R2 Backup (100)","router",440,60],["SW","sw",310,140],["PCs → GW 10.1.1.254","pc",310,205]],"links":[["R1 Master (120)","SW",".1"],["R2 Backup (100)","SW",".2"],["SW","PCs → GW 10.1.1.254"],["R1 Master (120)","R2 Backup (100)","VRRP adverts"]],"path":["PCs → GW 10.1.1.254","SW","R1 Master (120)"]}},"learn":["Hosts have a single default gateway, so if that router fails they lose connectivity. <b>VRRP<\/b> groups several routers into one <b>virtual router<\/b> with a <b>virtual IP<\/b> (the gateway) and <b>virtual MAC<\/b> (<code>0000-5E00-01{VRID}<\/code>).","The router with the highest <b>priority<\/b> (default <b>100<\/b>, range 1–254; <b>255<\/b> = the device that owns the virtual IP) becomes <b>Master<\/b> and answers ARP for the virtual IP; the others are <b>Backup<\/b>. Tie → higher interface IP.","The Master sends <b>advertisements<\/b> every <b>1 s<\/b> to multicast <b>224.0.0.18<\/b> (IP protocol <b>112<\/b>). If the Backups stop hearing them, the best Backup takes over.","<b>Preemption<\/b> is enabled by default (delay 0): a higher-priority router reclaims the Master role when it comes back.","<b>Interface tracking<\/b>: lower the priority when an uplink fails so the other router takes over: <code>vrrp vrid 1 track interface GigabitEthernet0/0/2 reduced 30<\/code>.","Config: <code>interface GigabitEthernet0/0/1<\/code> → <code>vrrp vrid 1 virtual-ip 10.1.1.254<\/code> → <code>vrrp vrid 1 priority 120<\/code>. Check <code>display vrrp brief<\/code>.","Load sharing: two VRRP groups (VRID 1 Master on R1, VRID 2 Master on R2), with half the hosts using each gateway. Often combined with MSTP so each VLAN's root bridge matches its VRRP Master."],"video":"VRRP explained master backup priority preemption","do":{"kind":"think","text":"R1 priority 120 (tracks its uplink, reduced 30) and R2 priority 100. R1's uplink fails: who becomes Master? What happens when the uplink comes back?"},"teach":"Explain how hosts keep the same gateway address when the VRRP Master fails.","simple":["PCs have only one default gateway. If that router dies, they're stuck. <b>VRRP<\/b> lets two (or more) routers share one <b>virtual IP<\/b> as the gateway — PCs never change their settings.","The router with the highest priority (default 100) becomes the <b>Master<\/b> and answers for the virtual IP using a special virtual MAC. The others are <b>Backups<\/b>, listening to the Master's advertisements every second.","If the Master goes silent, the best Backup takes over within a few seconds. Thanks to <b>preemption<\/b> (on by default), when the original Master comes back with its higher priority, it takes the job back.","<b>Tracking<\/b> makes it smarter: if the Master's uplink to the Internet fails, it can lower its own priority (e.g. by 30) so the Backup becomes Master even though the Master is still alive."],"terms":[["Virtual IP","The shared gateway address hosts use."],["Master / Backup","Active router / standby routers."],["Preemption","Higher-priority router takes back Master role."],["Track","Lower priority when an interface fails."]],"visuals":[{"type":"seq","title":"Failover in action","actors":["R1 Master (120)","R2 Backup (100)","PCs (GW = .254)"],"steps":[[0,1,"advert every 1 s","224.0.0.18"],[2,0,"traffic to .254",""],[0,0,"R1 fails ✕",""],[1,1,"no adverts for ~3 s → I'm Master",""],[2,1,"traffic to .254 (same IP, same virtual MAC)","PCs notice nothing"]]}],"cards":[{"id":"L36-c1","q":"VRRP default priority","a":"100 (255 = IP-address owner)."},{"id":"L36-c2","q":"VRRP advertisement interval and address","a":"1 second, to 224.0.0.18."},{"id":"L36-c3","q":"VRRP IP protocol number","a":"112."},{"id":"L36-c4","q":"VRRP virtual MAC format","a":"0000-5E00-01{VRID}."},{"id":"L36-c5","q":"Is VRRP preemption enabled by default?","a":"Yes (delay 0)."},{"id":"L36-c6","q":"VRRP interface tracking does what?","a":"Lowers priority when a tracked interface goes down, triggering failover."},{"id":"L36-c7","q":"Configure the virtual IP for VRID 1","a":"vrrp vrid 1 virtual-ip &lt;ip&gt;"}],"qs":[{"id":"L36-q1","t":"one","q":"What is the default VRRP priority on Huawei devices?","o":["0","100","128","255"],"a":[1],"e":"100 by default."},{"id":"L36-q2","t":"one","q":"Which router answers ARP requests for the VRRP virtual IP?","o":["All routers","The Master","The Backup with lowest priority","None — hosts use static ARP"],"a":[1],"e":"The Master owns the virtual MAC."},{"id":"L36-q3","t":"tf","q":"VRRP Masters send advertisements to the multicast address 224.0.0.18.","o":["True","False"],"a":[0],"e":"Using IP protocol 112."},{"id":"L36-q4","t":"one","q":"R1 (priority 120) tracks its uplink with “reduced 30”. R2 has priority 100. The uplink fails. Result?","o":["R1 stays Master with 120","R2 becomes Master (R1 drops to 90)","Both become Master","VRRP shuts down"],"a":[1],"e":"120 − 30 = 90 < 100, and preemption lets R2 take over."},{"id":"L36-q5","t":"multi","q":"Which statements about VRRP are correct?","o":["It provides a redundant default gateway","Hosts must run a VRRP client","Preemption is enabled by default on Huawei devices","Priority 255 is reserved for the IP address owner"],"a":[0,2,3],"e":"Hosts only need the virtual IP as their gateway."}]},{"id":"L37","week":4,"domain":"datacom","pri":2,"mins":15,"title":"Campus network design and lifecycle","book":"Ch 15 · pp. 471–500","hook":{"analogy":"Designing a campus network is like planning a city: neighbourhoods (access), main roads (aggregation), the motorway ring (core), the city gates (egress) and a fortified district for the servers (data centre).","mnemonic":"Lifecycle: Plan & design → Deploy & implement → Operate & maintain (O&M) → Optimise → (back to plan).","diagram":{"type":"topo","w":620,"h":240,"nodes":[["Egress (FW + router)","fw",310,30],["Core","l3sw",310,95],["Agg-1","l3sw",170,155],["Agg-2","l3sw",450,155],["Access","sw",90,215],["Access ","sw",250,215],["Access  ","sw",370,215],["AP","ap",530,215]],"links":[["Egress (FW + router)","Core"],["Core","Agg-1"],["Core","Agg-2"],["Agg-1","Access"],["Agg-1","Access "],["Agg-2","Access  "],["Agg-2","AP"]],"path":["Access","Agg-1","Core","Egress (FW + router)"]}},"learn":["A <b>campus network<\/b> serves an enterprise, school or park. Typical layers: <b>access<\/b> (users, APs, PoE), <b>aggregation<\/b> (collects access switches, often the VLAN gateways), <b>core<\/b> (high-speed backbone), <b>egress<\/b> (Internet/WAN with firewall + router), plus a <b>data centre/server zone<\/b>, <b>DMZ<\/b> and network management zone.","Small campuses collapse layers (core + aggregation in one, or even a single switch). Large ones use all three with redundancy.","Common technologies: VLANs, STP/MSTP or stacking (iStack/CSS) + Eth-Trunk, VRRP, OSPF, DHCP, NAT, ACLs, AAA/NAC (802.1X), WLAN with AC, QoS.","Design principles: <b>hierarchy<\/b>, <b>modularity<\/b>, <b>redundancy<\/b> (no single points of failure), <b>security<\/b>, scalability, manageability.","<b>Lifecycle<\/b>: planning & design (requirements, topology, VLAN/IP plan, device selection) → deployment & implementation (install, configure, test) → O&M (monitoring, backup, fault handling) → optimisation.","An IP/VLAN plan table (VLAN ID, purpose, subnet, gateway, DHCP range) is the backbone of any lab exam — practise writing one quickly.","Trends: SDN-based campus (iMaster NCE-Campus), virtual networks (VXLAN in the campus), Wi-Fi 6/7, zero-touch provisioning."],"video":"hierarchical campus network design core distribution access","do":{"kind":"think","text":"Write a VLAN/IP plan for a school: staff (60 users), students (200), servers (10), Wi-Fi guests (100), and management. Use 10.10.0.0/16 and VLSM."},"teach":"Explain what each campus layer does and why redundancy is added between aggregation and core.","simple":["A campus network (a school, a company HQ) is built in layers so it's easy to grow and fix. <b>Access<\/b> switches connect people and APs. <b>Aggregation<\/b> switches collect many access switches and usually hold the VLAN gateways. The <b>core<\/b> is the high-speed centre. The <b>egress<\/b> (firewall + router) leads to the Internet.","Every important link and box is doubled for <b>redundancy<\/b> (two uplinks, VRRP gateways, stacked core switches, Eth-Trunks) so one failure doesn't stop work.","A network has a life: <b>plan & design<\/b> (needs, topology, VLAN/IP plan), <b>deploy<\/b> (install, configure, test), <b>operate & maintain<\/b> (monitor, back up, fix), and <b>optimise<\/b> — then the cycle repeats."],"terms":[["Access layer","Connects users and APs."],["Aggregation layer","Collects access switches; gateways and policies."],["Core layer","Fast backbone."],["Lifecycle","Plan → deploy → O&M → optimise."]],"visuals":[{"type":"stack","title":"A VLAN/IP plan (the first thing to write in any lab)","rows":[["VLAN 10 · Staff","10.10.10.0/24 · GW .254 · DHCP .1–.200","datacom"],["VLAN 20 · Students","10.10.20.0/23 · GW .1.254","sec"],["VLAN 30 · Wi-Fi guests","10.10.30.0/24 · GW .254","wlan"],["VLAN 99 · Management","10.10.99.0/24 · switches and APs","dcn"]]}],"cards":[{"id":"L37-c1","q":"Three layers of a hierarchical campus","a":"Access, aggregation (distribution), core."},{"id":"L37-c2","q":"Network lifecycle stages","a":"Plan & design → deploy & implement → O&M → optimise."},{"id":"L37-c3","q":"Where are VLAN gateways usually placed?","a":"On the aggregation (or core) Layer 3 switches."},{"id":"L37-c4","q":"Egress zone contains…","a":"Firewall and router to the Internet/WAN."},{"id":"L37-c5","q":"Design principles","a":"Hierarchy, modularity, redundancy, security, scalability, manageability."}],"qs":[{"id":"L37-q1","t":"one","q":"Which campus layer connects end devices such as PCs and APs?","o":["Core","Aggregation","Access","Egress"],"a":[2],"e":"Access switches connect users, phones and APs (often with PoE)."},{"id":"L37-q2","t":"one","q":"Which lifecycle stage includes VLAN and IP address planning?","o":["Planning and design","O&M","Optimisation","Decommissioning"],"a":[0],"e":"Planning happens before deployment."},{"id":"L37-q3","t":"tf","q":"In small campus networks, the core and aggregation layers are often combined.","o":["True","False"],"a":[0],"e":"A collapsed core design."},{"id":"L37-q4","t":"multi","q":"Which technologies improve reliability in a campus network?","o":["VRRP","Eth-Trunk","Stacking (iStack/CSS)","Telnet"],"a":[0,1,2],"e":"Telnet is a management protocol, not a redundancy technology."}]},{"id":"L38","week":4,"domain":"datacom","pri":2,"mins":20,"title":"Network management: SNMP, NTP, NETCONF, telemetry","book":"Ch 16 · pp. 501–518","hook":{"analogy":"SNMP polling is a teacher calling the register every 5 minutes. Telemetry is students texting the teacher the moment something changes — faster and lighter.","mnemonic":"SNMP: agent UDP 161, trap UDP 162. v1/v2c = community strings (weak); v3 = authentication + encryption. NTP UDP 123, stratum 1–15 (16 = unsynchronised).","diagram":{"type":"seq","actors":["NMS","Agent (switch)"],"steps":[[0,1,"Get / GetNext / GetBulk","UDP 161"],[1,0,"Response (MIB values)",""],[0,1,"Set","change a value"],[1,0,"Trap / Inform","UDP 162 · event!"]]}},"learn":["<b>SNMP<\/b> parts: <b>NMS<\/b> (manager), <b>agent<\/b> (on each device), <b>MIB<\/b> (tree of managed objects, each with an <b>OID<\/b>).","Operations: <b>Get<\/b>, <b>GetNext<\/b>, <b>GetBulk<\/b> (v2c+), <b>Set<\/b>, <b>Trap<\/b> (unsolicited alert, no ACK), <b>Inform<\/b> (acknowledged alert, v2c+). Agent listens on UDP 161; traps go to UDP 162.","Versions: <b>SNMPv1/v2c<\/b> use plain-text community strings; <b>SNMPv3<\/b> adds users, authentication (e.g. SHA) and encryption (e.g. AES) — use it. Huawei: <code>snmp-agent<\/code>, <code>snmp-agent sys-info version v3<\/code>, <code>snmp-agent target-host trap …<\/code>.","<b>NTP<\/b> (UDP 123) synchronises clocks — vital for logs, certificates and troubleshooting. <b>Stratum<\/b> = distance from the reference clock (1 = directly attached to an atomic/GPS clock; 16 = unsynchronised). Modes: client/server, symmetric peer, broadcast, multicast. Huawei: <code>ntp-service unicast-server 10.0.0.1<\/code>; <code>display ntp-service status<\/code>.","<b>NETCONF<\/b> (over SSH, port 830) configures devices with XML-structured operations (get, get-config, edit-config, commit…), using <b>YANG<\/b> data models — the base for automation and SDN controllers.","<b>Telemetry<\/b>: devices <b>push<\/b> data (sub-second) to collectors instead of being polled — scales better than SNMP polling.","Other tools: <b>Syslog<\/b> (UDP 514) for logs, <b>LLDP<\/b> for neighbour discovery (<code>display lldp neighbor brief<\/code>), and Huawei iMaster NCE / eSight for management."],"video":"SNMP explained MIB OID trap get set v3","do":{"kind":"think","text":"Your switch logs show 1 January 2000 timestamps. Which protocol is missing, and which command fixes it?"},"teach":"Explain why SNMPv3 is preferred over v2c and the difference between a Trap and an Inform.","simple":["Once a network is running, you need to watch it. <b>SNMP<\/b> lets a management system (NMS) ask devices questions (Get) or change values (Set), and lets devices raise alarms (<b>Traps<\/b>). Each value has an address in a big tree called the <b>MIB<\/b> (its OID). Use <b>SNMPv3<\/b>, which adds passwords and encryption.","<b>NTP<\/b> keeps every device's clock correct — without it, logs from different devices can't be compared. Stratum 1 servers are right next to an atomic/GPS clock; the number grows by 1 for each step away.","Newer tools: <b>NETCONF<\/b> (over SSH) configures devices with structured data described by <b>YANG<\/b> models — ideal for automation. <b>Telemetry<\/b> has devices push their data every second instead of waiting to be asked."],"terms":[["NMS","Network management system (the manager)."],["Agent","SNMP software on each device."],["MIB / OID","Database of values / one value's address."],["Trap","Alert sent by a device."],["Stratum","NTP distance from the reference clock."]],"visuals":[{"type":"compare","title":"Polling vs pushing","cols":[["SNMP polling","muted",["NMS asks every few minutes","Get / GetNext / GetBulk","Can miss short spikes"]],["Telemetry","datacom",["Device pushes data","Sub-second detail","Scales to big networks"]]]}],"cards":[{"id":"L38-c1","q":"SNMP agent port / trap port","a":"UDP 161 / UDP 162."},{"id":"L38-c2","q":"Trap vs Inform","a":"Trap: unacknowledged alert. Inform: acknowledged alert."},{"id":"L38-c3","q":"What does SNMPv3 add?","a":"User-based security: authentication and encryption."},{"id":"L38-c4","q":"MIB and OID","a":"MIB = database of managed objects; OID = an object's unique identifier in the tree."},{"id":"L38-c5","q":"NTP port","a":"UDP 123."},{"id":"L38-c6","q":"NTP stratum 16 means…","a":"Unsynchronised."},{"id":"L38-c7","q":"NETCONF transport and port","a":"SSH, port 830 (uses YANG models)."},{"id":"L38-c8","q":"Telemetry vs SNMP polling","a":"Telemetry pushes data from the device (fast, scalable); SNMP polls."},{"id":"L38-c9","q":"Syslog port","a":"UDP 514."}],"qs":[{"id":"L38-q1","t":"one","q":"Which SNMP message lets an agent alert the NMS and expects an acknowledgement?","o":["Trap","Inform","GetBulk","Set"],"a":[1],"e":"Inform is acknowledged; Trap isn't."},{"id":"L38-q2","t":"one","q":"Which SNMP version supports encryption?","o":["v1","v2c","v3","All of them"],"a":[2],"e":"v1/v2c use clear-text community strings."},{"id":"L38-q3","t":"tf","q":"An NTP stratum 1 server is directly connected to a reference clock.","o":["True","False"],"a":[0],"e":"The lower the stratum, the closer to the reference."},{"id":"L38-q4","t":"multi","q":"Which statements about NETCONF are correct?","o":["It uses XML-encoded messages","It commonly runs over SSH","It uses YANG data models","It uses UDP 161"],"a":[0,1,2],"e":"UDP 161 is SNMP."},{"id":"L38-q5","t":"one","q":"Which method lets a device push monitoring data to a collector in near real time?","o":["SNMP Get","Telemetry","Telnet","TFTP"],"a":[1],"e":"Telemetry is push-based."}]},{"id":"L39","week":4,"domain":"dcn","pri":2,"mins":20,"title":"SDN, NFV and network automation (Python)","book":"Ch 17–18 · pp. 521–551","hook":{"analogy":"Traditional networks: every router is a driver with their own map. SDN: a central air-traffic controller plans all the routes and tells each device what to do.","mnemonic":"SDN = control plane separated + centralised + programmable (northbound REST APIs, southbound OpenFlow/NETCONF). NFV = network functions as software on ordinary servers.","diagram":{"type":"stack","title":"SDN architecture","rows":[["Application layer","orchestration, apps, scripts","wlan"],["↕ Northbound interface (REST/RESTful APIs)","","muted"],["Control layer — SDN controller (e.g. iMaster NCE)","central view, computes paths","datacom"],["↕ Southbound interface (OpenFlow, NETCONF, BGP-LS, PCEP)","","muted"],["Infrastructure layer — switches/routers","forward according to flow tables","dcn"]]}},"learn":["Every network device has a <b>management plane<\/b> (configure/monitor), <b>control plane<\/b> (routing protocols, decisions) and <b>data/forwarding plane<\/b> (moving packets).","<b>SDN<\/b>: separates control from forwarding, <b>centralises<\/b> control in a <b>controller<\/b>, and opens the network to <b>programming<\/b> through APIs. Benefits: faster provisioning, central view, automation.","Interfaces: <b>northbound<\/b> (controller ↔ apps, usually REST APIs) and <b>southbound<\/b> (controller ↔ devices: OpenFlow, NETCONF, etc.).","<b>OpenFlow<\/b>: the controller installs <b>flow table<\/b> entries (match fields, priority, counters, instructions/actions, timeouts) in switches.","Huawei: <b>iMaster NCE<\/b> (Campus, Fabric for DCN, WAN) is the SDN controller/management platform.","<b>NFV<\/b>: runs functions like firewalls, routers or load balancers as virtual machines/containers (VNFs) on standard servers. ETSI framework: NFVI, VNFs, MANO.","<b>Automation with Python<\/b>: <code>telnetlib<\/code> (Telnet), <code>paramiko<\/code>/<code>netmiko<\/code> (SSH), <code>ncclient<\/code> (NETCONF), <code>requests<\/code> (REST). Typical task: loop over devices, push config, collect <code>display<\/code> output. Benefits: speed, consistency, fewer mistakes."],"video":"SDN explained control plane data plane controller northbound southbound","do":{"kind":"think","text":"Write (on paper) the steps of a Python script that logs into 10 switches via SSH and saves the output of display version from each."},"teach":"Explain the difference between SDN and NFV.","simple":["Every router has a <b>control plane<\/b> (the brain that runs OSPF and decides routes) and a <b>data plane<\/b> (the muscles that move packets). Traditionally, every device has its own brain.","<b>SDN<\/b> moves the brains into one central <b>controller<\/b> (Huawei: iMaster NCE) that sees the whole network and programs the devices. Apps talk to the controller through <b>northbound<\/b> APIs (REST); the controller talks to devices through <b>southbound<\/b> protocols (OpenFlow, NETCONF).","<b>NFV<\/b> is a different idea: instead of buying a firewall box, run firewall <i>software<\/i> on a normal server (a VNF).","<b>Automation<\/b>: a Python script can log into 100 switches over SSH (paramiko/netmiko) and apply the same change in minutes without typos."],"terms":[["Control plane","Decides where traffic goes."],["Data plane","Actually forwards packets."],["Controller","Central SDN brain."],["Northbound / southbound","Controller ↔ apps / controller ↔ devices."],["VNF","A network function running as software."]],"visuals":[{"type":"compare","title":"Traditional vs SDN","cols":[["Traditional","muted",["Brain in every box","Configure device by device","Distributed protocols"]],["SDN","datacom",["Central controller brain","Network-wide programming via APIs","Devices mostly forward"]]]}],"cards":[{"id":"L39-c1","q":"Three device planes","a":"Management, control, data (forwarding)."},{"id":"L39-c2","q":"Core idea of SDN","a":"Separate the control plane, centralise it in a controller, make the network programmable."},{"id":"L39-c3","q":"Northbound vs southbound interfaces","a":"Northbound: controller ↔ applications (REST). Southbound: controller ↔ devices (OpenFlow, NETCONF)."},{"id":"L39-c4","q":"NFV","a":"Network functions as software (VNFs) on standard servers."},{"id":"L39-c5","q":"OpenFlow flow entry fields","a":"Match fields, priority, counters, instructions, timeouts, cookie."},{"id":"L39-c6","q":"Huawei SDN controller family","a":"iMaster NCE."},{"id":"L39-c7","q":"Python library for SSH to network devices","a":"paramiko (or netmiko)."}],"qs":[{"id":"L39-q1","t":"one","q":"In SDN, which interface does the controller use to program the forwarding devices?","o":["Northbound","Southbound","Eastbound","Console"],"a":[1],"e":"Southbound = controller to devices."},{"id":"L39-q2","t":"tf","q":"NFV runs network functions such as firewalls as software on general-purpose servers.","o":["True","False"],"a":[0],"e":"Virtual network functions (VNFs) replace dedicated hardware appliances."},{"id":"L39-q3","t":"one","q":"Which protocol is the classic southbound protocol that installs flow tables in switches?","o":["OpenFlow","SNMP","HTTP","STP"],"a":[0],"e":"OpenFlow lets the controller add, change and delete flow entries."},{"id":"L39-q4","t":"multi","q":"Which are benefits of network automation?","o":["Faster deployment","Consistent configurations","Fewer human errors","No need for any network knowledge"],"a":[0,1,2],"e":"You still need to understand the network."},{"id":"L39-q5","t":"one","q":"Which device plane runs routing protocols such as OSPF?","o":["Data plane","Control plane","Management plane","Physical plane"],"a":[1],"e":"The control plane makes decisions (routing protocols); the data plane forwards."},{"id":"L39-q6","t":"one","q":"Which Python library is used to talk NETCONF to network devices?","o":["ncclient","telnetlib","pandas","flask"],"a":[0],"e":"ncclient is a NETCONF client library."},{"id":"L39-q7","t":"tf","q":"In SDN, applications talk to the controller through northbound APIs.","o":["True","False"],"a":[0],"e":"Typically REST/RESTful APIs."}]},{"id":"L40","week":4,"domain":"dcn","pri":1,"mins":20,"title":"Data centre networks: spine-leaf, CloudEngine, M-LAG","book":"Beyond the textbook — HCIA-Datacom DCN / HCIP-Data Center Network level","hook":{"analogy":"Spine-leaf is a city where every neighbourhood (leaf) has a direct road to every motorway (spine): any trip is leaf → spine → leaf, always the same length, and you add capacity by adding motorways.","mnemonic":"Leaf connects servers; spine connects leaves. No leaf↔leaf or spine↔spine links. ECMP across all spines. M-LAG = two switches, one LAG to the server.","diagram":{"type":"topo","w":620,"h":230,"nodes":[["Spine-1","l3sw",220,50],["Spine-2","l3sw",400,50],["Leaf-1","sw",100,150],["Leaf-2","sw",250,150],["Leaf-3","sw",370,150],["Leaf-4","sw",520,150],["Server A","server",100,215],["Server B","server",520,215]],"links":[["Spine-1","Leaf-1"],["Spine-1","Leaf-2"],["Spine-1","Leaf-3"],["Spine-1","Leaf-4"],["Spine-2","Leaf-1"],["Spine-2","Leaf-2"],["Spine-2","Leaf-3"],["Spine-2","Leaf-4"],["Leaf-1","Server A"],["Leaf-4","Server B"]],"path":["Server A","Leaf-1","Spine-2","Leaf-4","Server B"]}},"learn":["A <b>data centre network (DCN)<\/b> connects servers and storage. Modern traffic is mostly <b>east-west<\/b> (server ↔ server) rather than north-south (client ↔ server).","Traditional <b>three-tier<\/b> (access–aggregation–core) with STP blocks links, and east-west traffic travels far. <b>Spine-leaf (Clos)<\/b> fixes this.","<b>Spine-leaf<\/b>: every leaf connects to every spine; leaves connect servers, firewalls and the border; no leaf-to-leaf or spine-to-spine links. Any server-to-server path = leaf → spine → leaf (predictable latency). Uses Layer 3 + <b>ECMP<\/b> (no STP blocking). Scale out by adding leaves (ports) or spines (bandwidth).","<b>Oversubscription ratio<\/b> = leaf downlink bandwidth ÷ uplink bandwidth (e.g. 48×25G ÷ 6×100G = 2:1).","Huawei DC switches: <b>CloudEngine (CE)<\/b> series; controller <b>iMaster NCE-Fabric<\/b>.","Server dual-homing: <b>M-LAG<\/b> (multi-chassis link aggregation): two leaves appear as one device to the server's LAG. They keep <b>separate control planes<\/b> and sync over a <b>peer-link<\/b>, with dual-active detection (DAD). You can upgrade one at a time.","<b>Stacking<\/b> (iStack/CSS) merges switches into one logical device with a <b>single control plane<\/b> — simpler, but the whole stack is one failure/upgrade domain.","VMs move between servers (live migration) and must keep their IP → the DC needs large Layer 2 domains across a Layer 3 fabric → <b>VXLAN<\/b> (next lesson)."],"video":"spine leaf architecture data center explained","do":{"kind":"think","text":"A fabric has 4 spines and 20 leaves, with one link from each leaf to each spine. How many fabric links? How many paths between two servers on different leaves?"},"teach":"Explain why spine-leaf suits east-west traffic better than a three-tier design with STP.","simple":["In a data centre, most traffic is <b>server ↔ server<\/b> (east-west), e.g. a web server asking a database. Old three-tier designs with STP blocked links and sent this traffic up and down long paths.","<b>Spine-leaf<\/b> fixes it with a simple rule: servers plug into <b>leaf<\/b> switches; every leaf connects to every <b>spine<\/b>; leaves never connect to leaves, spines never to spines. Any server reaches any other in the same number of hops (leaf → spine → leaf), and all paths are used at once with routing + <b>ECMP<\/b> — no STP blocking.","Need more ports? Add leaves. Need more bandwidth between leaves? Add spines.","Servers usually connect to <b>two<\/b> leaves for safety. <b>M-LAG<\/b> makes the two leaves look like one switch to the server's bonded links, while each leaf keeps its own brain (so you can upgrade one at a time). <b>Stacking<\/b> instead merges switches into one device with one brain."],"terms":[["East-west","Server-to-server traffic inside the DC."],["Leaf / spine","Access switch for servers / backbone switch."],["ECMP","Using several equal paths at once."],["M-LAG","Two switches acting as one LAG partner, separate control planes."],["Oversubscription","Downlink ÷ uplink bandwidth."]],"visuals":[{"type":"compare","title":"Three-tier vs spine-leaf","cols":[["Three-tier + STP","muted",["Access → aggregation → core","STP blocks redundant links","Uneven east-west paths"]],["Spine-leaf","dcn",["Every leaf ↔ every spine","All links active (ECMP)","Equal hops for any server pair","Scale out by adding switches"]]]},{"type":"compare","title":"M-LAG vs stacking","cols":[["M-LAG","dcn",["Two independent control planes","Peer-link between them","Upgrade one at a time"]],["Stacking (iStack/CSS)","datacom",["One control plane","Managed as one device","Whole stack = one failure domain"]]]}],"cards":[{"id":"L40-c1","q":"East-west vs north-south traffic","a":"East-west: server ↔ server inside the DC. North-south: in and out of the DC."},{"id":"L40-c2","q":"Spine-leaf link rule","a":"Every leaf connects to every spine; no leaf-leaf or spine-spine links."},{"id":"L40-c3","q":"Hops between servers on different leaves","a":"Leaf → spine → leaf (always the same)."},{"id":"L40-c4","q":"How does spine-leaf use all links?","a":"Layer 3 routing with ECMP (no STP blocking)."},{"id":"L40-c5","q":"M-LAG vs stacking","a":"M-LAG: two independent control planes, peer-link, one LAG to the server. Stacking: one control plane."},{"id":"L40-c6","q":"Huawei data centre switch series","a":"CloudEngine (CE)."},{"id":"L40-c7","q":"Oversubscription ratio","a":"Downlink bandwidth ÷ uplink bandwidth on a leaf."},{"id":"L40-c8","q":"Huawei DCN controller","a":"iMaster NCE-Fabric."}],"qs":[{"id":"L40-q1","t":"one","q":"In a spine-leaf fabric, which devices do servers connect to?","o":["Spine switches","Leaf switches","Border routers only","Directly to each other"],"a":[1],"e":"Servers attach to leaves."},{"id":"L40-q2","t":"tf","q":"In a spine-leaf design, spine switches connect directly to each other.","o":["True","False"],"a":[1],"e":"Spines only connect to leaves."},{"id":"L40-q3","t":"multi","q":"Which are advantages of spine-leaf over a traditional three-tier DC design?","o":["Predictable latency for east-west traffic","All links used with ECMP","Easy horizontal scaling","Relies on STP blocking for loop prevention"],"a":[0,1,2],"e":"Spine-leaf avoids STP blocking."},{"id":"L40-q4","t":"one","q":"A leaf has 48 × 25GE server ports and 6 × 100GE uplinks. What is the oversubscription ratio?","o":["1:1","2:1","4:1","8:1"],"a":[1],"e":"1200 G ÷ 600 G = 2:1."},{"id":"L40-q5","t":"one","q":"Which technology lets two switches with independent control planes provide one link aggregation to a server?","o":["iStack","M-LAG","VRRP","MSTP"],"a":[1],"e":"M-LAG keeps two control planes; iStack merges into one."},{"id":"L40-q6","t":"one","q":"Which traffic pattern dominates modern data centres?","o":["North-south","East-west","Broadcast","Multicast only"],"a":[1],"e":"Server-to-server traffic (east-west) dominates."},{"id":"L40-q7","t":"tf","q":"Adding more spine switches increases the bandwidth available between leaves.","o":["True","False"],"a":[0],"e":"More spines = more equal-cost paths."},{"id":"L40-q8","t":"one","q":"In a fabric with 4 spines, how many equal-cost paths exist between servers on two different leaves (one link per leaf-spine pair)?","o":["1","2","4","8"],"a":[2],"e":"One path through each spine."},{"id":"L40-q9","t":"multi","q":"Which statements about M-LAG are correct?","o":["The two member switches keep independent control planes","A peer-link connects the two switches","Servers see the pair as one device for link aggregation","Both switches must merge into one stack"],"a":[0,1,2],"e":"Merging into one control plane is stacking (iStack/CSS)."}]},{"id":"L41","week":4,"domain":"dcn","pri":1,"mins":25,"title":"VXLAN and BGP EVPN fundamentals","book":"Beyond the textbook — HCIA-Datacom DCN / HCIP-Data Center Network level","hook":{"analogy":"VXLAN puts a whole Ethernet frame inside a UDP envelope so it can ride the routed (Layer 3) fabric, then unwraps it on the other side — like shipping a car inside a container.","mnemonic":"MAC-in-UDP · UDP 4789 · 24-bit VNI (16 million segments) · VTEP wraps/unwraps · +50 bytes overhead → raise MTU. EVPN types: 2 = MAC/IP, 3 = inclusive multicast (VTEP discovery), 5 = IP prefix.","diagram":{"type":"bar","title":"VXLAN packet (outer headers ≈ 50 bytes)","segs":[["Outer Eth 14",14,"muted"],["Outer IP 20",20,"datacom"],["UDP 8 (4789)",8,"sec"],["VXLAN 8 (VNI)",8,"dcn"],["Original Ethernet frame",40,"wlan"]]}},"learn":["<b>VXLAN<\/b> (Virtual eXtensible LAN) builds Layer 2 <b>overlay<\/b> networks over a Layer 3 <b>underlay<\/b> by encapsulating Ethernet frames in <b>UDP<\/b> (<b>MAC-in-UDP<\/b>, destination port <b>4789<\/b>).","Why: VLANs give only 4094 segments and need STP; VXLAN gives <b>16 million<\/b> segments (24-bit <b>VNI<\/b>), works over routed ECMP fabrics, and supports multi-tenancy and VM mobility.","<b>VTEP<\/b> (VXLAN Tunnel End Point) encapsulates and decapsulates, usually on leaf switches. On Huawei CE switches the VTEP is the <b>NVE<\/b> interface; a <b>BD<\/b> (bridge domain) is the Layer 2 broadcast domain mapped to a VNI.","Overhead ≈ <b>50 bytes<\/b> (outer Ethernet 14 + IP 20 + UDP 8 + VXLAN 8), so raise the underlay MTU (e.g. 1600+ or jumbo).","How VTEPs learn about each other and about MACs: <b>static<\/b> (head-end replication peer list) and data-plane flood-and-learn, or the <b>BGP EVPN<\/b> control plane. EVPN route types: <b>Type 2<\/b> MAC/IP advertisement, <b>Type 3<\/b> inclusive multicast (auto VTEP discovery and BUM replication list), <b>Type 5<\/b> IP prefix.","<b>Gateways<\/b>: L2 gateway (VLAN ↔ VXLAN, inside one segment); L3 gateway (between VNIs/subnets). <b>Centralised<\/b> gateway (on spine/border) vs <b>distributed<\/b> gateway (an anycast gateway on every leaf — shorter paths, preferred with EVPN).","Huawei config idea: <code>bridge-domain 10<\/code> → <code>vxlan vni 5010<\/code>; <code>interface Nve1<\/code> → <code>source 1.1.1.1<\/code> → <code>vni 5010 head-end peer-list 2.2.2.2<\/code>; access: <code>interface 10GE1/0/1.1 mode l2<\/code> → <code>encapsulation dot1q vid 10<\/code> → <code>bridge-domain 10<\/code>."],"video":"VXLAN explained VTEP VNI overlay underlay EVPN","do":{"kind":"think","text":"Two servers in the same VNI sit on Leaf-1 and Leaf-4. Draw the packet as it leaves Leaf-1: which outer source/destination IPs and which UDP port?"},"teach":"Explain overlay vs underlay, and what a VTEP does.","simple":["Virtual machines often need to be in the same Layer 2 network even when they sit in different racks connected by a routed (Layer 3) fabric. <b>VXLAN<\/b> makes this possible by putting the whole Ethernet frame inside a UDP packet — <b>MAC-in-UDP<\/b> on port <b>4789<\/b>.","The device that wraps and unwraps is the <b>VTEP<\/b> (on Huawei CE switches: the <b>NVE<\/b> interface). The physical routed network is the <b>underlay<\/b>; the virtual Layer 2 networks on top are the <b>overlay<\/b>.","Each overlay network has a 24-bit <b>VNI<\/b> — about 16 million networks, compared with 4094 VLANs. Huawei maps a VNI to a <b>bridge domain (BD)<\/b>.","The wrapping adds about <b>50 bytes<\/b>, so the underlay MTU must be raised. VTEPs learn about each other and about hosts either by static lists/flooding or, better, with <b>BGP EVPN<\/b>: Type 2 routes carry host MAC/IPs, Type 3 routes discover VTEPs, Type 5 routes carry IP prefixes."],"terms":[["VXLAN","Layer 2 overlay over Layer 3, MAC-in-UDP."],["VTEP / NVE","Tunnel endpoint that encapsulates."],["VNI","24-bit overlay network ID."],["Underlay / overlay","Physical IP fabric / virtual networks on top."],["BGP EVPN","Control plane that advertises MAC/IP info."]],"visuals":[{"type":"nest","title":"VXLAN encapsulation (≈ 50 bytes added)","layers":[["Outer Ethernet","muted"],["Outer IP: VTEP 1.1.1.1 → VTEP 2.2.2.2","datacom"],["UDP dst port 4789","sec"],["VXLAN header: VNI 5010","dcn"]],"inner":"Original Ethernet frame (VM A → VM B)"},{"type":"compare","title":"VLAN vs VXLAN","cols":[["VLAN","muted",["12-bit ID → 4094","Needs STP across the L2 domain","One site/switch domain"]],["VXLAN","dcn",["24-bit VNI → ~16 million","Runs over routed ECMP fabric","Stretches L2 anywhere IP reaches"]]]}],"cards":[{"id":"L41-c1","q":"VXLAN encapsulation type","a":"MAC-in-UDP."},{"id":"L41-c2","q":"VXLAN UDP destination port","a":"4789."},{"id":"L41-c3","q":"VNI size and number of segments","a":"24 bits → ~16 million."},{"id":"L41-c4","q":"VTEP","a":"VXLAN Tunnel End Point — encapsulates/decapsulates VXLAN."},{"id":"L41-c5","q":"VXLAN overhead","a":"About 50 bytes → increase the underlay MTU."},{"id":"L41-c6","q":"Huawei interface that acts as the VTEP","a":"NVE interface (e.g. interface Nve1)."},{"id":"L41-c7","q":"Bridge domain (BD)","a":"Huawei L2 broadcast domain mapped to a VNI."},{"id":"L41-c8","q":"EVPN route type 2 / 3 / 5","a":"MAC/IP advertisement / inclusive multicast (VTEP discovery) / IP prefix."},{"id":"L41-c9","q":"Distributed gateway","a":"Anycast L3 gateway on every leaf — traffic is routed at the nearest leaf."},{"id":"L41-c10","q":"Overlay vs underlay","a":"Overlay: the virtual VXLAN networks. Underlay: the physical routed IP fabric."}],"qs":[{"id":"L41-q1","t":"one","q":"Which UDP destination port does VXLAN use?","o":["4789","4500","5246","179"],"a":[0],"e":"IANA-assigned 4789."},{"id":"L41-q2","t":"one","q":"How many bits is the VXLAN Network Identifier (VNI)?","o":["12","16","24","32"],"a":[2],"e":"24 bits vs 12 bits for VLAN IDs."},{"id":"L41-q3","t":"tf","q":"VXLAN encapsulates Layer 2 frames so they can be carried across a Layer 3 network.","o":["True","False"],"a":[0],"e":"MAC-in-UDP."},{"id":"L41-q4","t":"multi","q":"Which statements about VXLAN are correct?","o":["It supports about 16 million segments","VTEPs perform encapsulation and decapsulation","It adds roughly 50 bytes of overhead","It requires STP in the underlay to prevent loops"],"a":[0,1,2],"e":"The underlay is routed (ECMP), not STP-based."},{"id":"L41-q5","t":"one","q":"Which BGP EVPN route type advertises host MAC/IP addresses?","o":["Type 1","Type 2","Type 3","Type 5"],"a":[1],"e":"Type 2 = MAC/IP."},{"id":"L41-q6","t":"one","q":"Which BGP EVPN route type is used for automatic VTEP discovery and building the BUM flooding list?","o":["Type 2","Type 3","Type 4","Type 5"],"a":[1],"e":"Type 3 = inclusive multicast route."},{"id":"L41-q7","t":"one","q":"What is the device or interface that encapsulates traffic into VXLAN called?","o":["VTEP","VNI","BD","ABR"],"a":[0],"e":"VXLAN Tunnel End Point."},{"id":"L41-q8","t":"tf","q":"VXLAN overlays usually require the underlay MTU to be larger than 1500 bytes.","o":["True","False"],"a":[0],"e":"About 50 bytes of extra headers."},{"id":"L41-q9","t":"one","q":"What is the underlay in a VXLAN data centre?","o":["The virtual tenant networks","The physical routed IP network carrying the tunnels","The VM hypervisor","The SDN controller"],"a":[1],"e":"Overlay = virtual; underlay = physical IP fabric."},{"id":"L41-q10","t":"multi","q":"Which are advantages of VXLAN over traditional VLANs in a data centre?","o":["Far more segments (24-bit VNI)","Layer 2 extension over a Layer 3 fabric","Supports VM mobility across racks","Requires STP across the whole DC"],"a":[0,1,2],"e":"VXLAN avoids a DC-wide STP domain."},{"id":"L41-q11","t":"one","q":"Which BGP EVPN route type carries IP prefixes (e.g. for external routes)?","o":["Type 2","Type 3","Type 5","Type 1"],"a":[2],"e":"Type 5 = IP prefix route."},{"id":"L41-q12","t":"one","q":"With a distributed VXLAN gateway, where is inter-subnet traffic routed?","o":["Only on the spine","On the leaf switch closest to the source (anycast gateway)","On the firewall","On the AC"],"a":[1],"e":"Every leaf hosts the same anycast gateway."}]},{"id":"L42","week":4,"domain":"security","pri":2,"mins":20,"title":"Access security: port security, DHCP snooping, 802.1X and WLAN security","book":"Beyond the textbook — HCIA-Datacom / HCIA-WLAN / HCIA-Security level","hook":{"analogy":"DHCP snooping is a doorman who only accepts address cards from the official office (trusted port). Port security is a cap on how many people can come through one door. 802.1X is showing ID before the door opens at all.","mnemonic":"802.1X roles: Supplicant (client) → Authenticator (switch/AP) → Authentication server (RADIUS). WPA3 personal = SAE instead of PSK.","diagram":{"type":"seq","actors":["Supplicant (PC)","Authenticator (switch/AP)","RADIUS server"],"steps":[[0,1,"EAPoL-Start",""],[1,0,"EAP-Request/Identity",""],[0,1,"EAP-Response/Identity",""],[1,2,"RADIUS Access-Request (EAP)","relayed"],[2,1,"Access-Accept","+ VLAN/ACL"],[1,0,"EAP-Success → port open",""]]}},"learn":["<b>Port security<\/b>: limits and/or locks the MACs allowed on a port (<code>port-security enable<\/code>, <code>port-security max-mac-num 2<\/code>, <b>sticky MAC<\/b>), with an action on violation (restrict, protect, shutdown). Stops MAC flooding and unauthorised devices.","<b>DHCP snooping<\/b>: only <b>trusted<\/b> ports (towards the real DHCP server) may send DHCP Offer/ACK; it also builds a binding table (MAC–IP–port–VLAN). Commands: <code>dhcp snooping enable<\/code> (global + VLAN/interface), <code>dhcp snooping trusted<\/code> on the uplink.","The binding table enables <b>DAI<\/b> (Dynamic ARP Inspection — drops forged ARP) and <b>IPSG<\/b> (IP Source Guard — drops spoofed source IPs).","<b>802.1X<\/b>: port-based network access control. Supplicant ↔ (EAPoL) ↔ authenticator ↔ (RADIUS) ↔ authentication server. The port only passes EAPoL until authentication succeeds. Others: <b>MAC authentication<\/b> (dumb devices like printers), <b>Portal<\/b> (web login, guests).","WLAN security: <b>WEP<\/b> (broken, never use) → <b>WPA/WPA2<\/b> (WPA2 = CCMP/AES) → <b>WPA3<\/b> (SAE for personal mode protects against offline dictionary attacks; 192-bit mode for enterprise). Personal = pre-shared key; Enterprise = 802.1X.","<b>WIDS/WIPS<\/b> detect and contain rogue APs and attacks; hiding the SSID is not real security.","Other switch protections: storm control, BPDU protection (edge ports), loop detection, isolating ports from each other (port isolation)."],"video":"DHCP snooping dynamic ARP inspection 802.1X explained","do":{"kind":"think","text":"A student plugs a home router into a classroom port and other PCs start getting 192.168.0.x addresses. Which two features would have prevented this, and where do you configure them?"},"teach":"Explain how DHCP snooping, DAI and IPSG work together.","simple":["Most attacks start at the edge — the port in the wall or the Wi-Fi. <b>Port security<\/b> limits how many MAC addresses a port may learn (and can remember them as “sticky”), stopping MAC flooding and random devices.","<b>DHCP snooping<\/b> marks the uplink towards the real DHCP server as <b>trusted<\/b>; DHCP offers arriving on any other port are dropped, so a student's home router can't hand out wrong addresses. It also records who got which IP on which port — a table that <b>DAI<\/b> (checks ARP) and <b>IPSG<\/b> (checks source IPs) use to stop spoofing.","<b>802.1X<\/b> keeps a port closed until the user logs in: the PC (<b>supplicant<\/b>) talks EAP to the switch/AP (<b>authenticator<\/b>), which asks the <b>RADIUS server<\/b>. Devices that can't do 802.1X (printers) use MAC authentication; guests use a web <b>Portal<\/b>.","For Wi-Fi encryption: never WEP; use <b>WPA2<\/b> (AES) or better <b>WPA3<\/b> (SAE protects weak passwords against offline guessing)."],"terms":[["Port security","Limit/lock MACs on a port."],["DHCP snooping","Only trusted ports may answer DHCP."],["DAI / IPSG","Check ARP / source IP against the binding table."],["Supplicant","The device logging in with 802.1X."],["WPA3-SAE","Modern Wi-Fi password exchange."]],"visuals":[{"type":"topo","w":640,"h":200,"title":"DHCP snooping: trusted vs untrusted ports","nodes":[["Real DHCP server","server",560,100],["Access switch","sw",320,100],["Student PC","pc",90,50],["Rogue home router","router",90,160]],"links":[["Access switch","Real DHCP server","TRUSTED uplink"],["Access switch","Student PC","untrusted"],["Access switch","Rogue home router","untrusted · offers dropped ✕"]],"path":["Student PC","Access switch","Real DHCP server"]},{"type":"seq","title":"802.1X login","actors":["Supplicant (PC)","Authenticator (switch/AP)","RADIUS server"],"steps":[[0,1,"EAPoL: here's my identity",""],[1,2,"Access-Request","EAP inside RADIUS"],[2,1,"Access-Accept","+ VLAN / ACL"],[1,0,"EAP-Success → port opens",""]]}],"cards":[{"id":"L42-c1","q":"DHCP snooping trusted port","a":"The port towards the legitimate DHCP server; only trusted ports may send Offers/ACKs."},{"id":"L42-c2","q":"What does the DHCP snooping binding table enable?","a":"DAI (ARP inspection) and IPSG (IP source guard)."},{"id":"L42-c3","q":"802.1X roles","a":"Supplicant, authenticator, authentication server (RADIUS)."},{"id":"L42-c4","q":"Protocol between supplicant and authenticator","a":"EAPoL (EAP over LAN)."},{"id":"L42-c5","q":"Sticky MAC","a":"Port security learns MACs and keeps them as secure entries."},{"id":"L42-c6","q":"WPA3-Personal key exchange","a":"SAE (Simultaneous Authentication of Equals)."},{"id":"L42-c7","q":"WPA2 encryption","a":"CCMP/AES."},{"id":"L42-c8","q":"Authentication for guests via web page","a":"Portal authentication."}],"qs":[{"id":"L42-q1","t":"one","q":"Which feature stops a rogue DHCP server connected to an access port?","o":["Port isolation","DHCP snooping with trusted uplink","VRRP","OSPF authentication"],"a":[1],"e":"Untrusted ports can't send DHCP Offers."},{"id":"L42-q2","t":"one","q":"In 802.1X, which device is the authenticator?","o":["The user's PC","The access switch or AP","The RADIUS server","The DHCP server"],"a":[1],"e":"The NAS/switch relays EAP to RADIUS."},{"id":"L42-q3","t":"tf","q":"WEP is considered secure for enterprise WLANs.","o":["True","False"],"a":[1],"e":"WEP is broken; use WPA2/WPA3."},{"id":"L42-q4","t":"multi","q":"Which features use the DHCP snooping binding table?","o":["Dynamic ARP Inspection","IP Source Guard","LACP","STP"],"a":[0,1],"e":"DAI checks ARP and IPSG checks source IPs against the binding table."},{"id":"L42-q5","t":"one","q":"Which WPA3 mechanism replaces PSK in personal mode?","o":["TKIP","SAE","WEP","EAP-TLS"],"a":[1],"e":"SAE resists offline dictionary attacks."},{"id":"L42-q6","t":"one","q":"Which authentication method suits printers that can't run an 802.1X client?","o":["Portal","MAC authentication","PAP","CHAP"],"a":[1],"e":"MAC auth uses the device's MAC as its identity."},{"id":"L42-q7","t":"one","q":"Which port-security behaviour keeps learned MACs as secure entries that survive aging?","o":["Sticky MAC","MAC flapping","Port isolation","Storm control"],"a":[0],"e":"Sticky MACs are converted into secure entries that don't age out."},{"id":"L42-q8","t":"tf","q":"Hiding the SSID is a strong security measure on its own.","o":["True","False"],"a":[1],"e":"Hidden SSIDs are easily discovered; use WPA2/WPA3 and 802.1X."}]}],"labs":[{"id":"LAB1","week":1,"mins":30,"title":"VRP basics: views, help, naming, saving","lessons":["L07","L09","L10"],"goal":"Get comfortable moving around VRP, then make a configuration survive a reboot.","topo":{"type":"topo","w":620,"h":160,"nodes":[["PC1 10.1.1.1/24","pc",90,80],["R1","router",310,80],["PC2 10.1.2.1/24","pc",530,80]],"links":[["PC1 10.1.1.1/24","R1","G0/0/0 · 10.1.1.254"],["R1","PC2 10.1.2.1/24","G0/0/1 · 10.1.2.254"]],"path":["PC1 10.1.1.1/24","R1","PC2 10.1.2.1/24"]},"tasks":["Drag in one AR2220 and two PCs; cable them as shown and start the devices.","On R1, try <code>?<\/code>, then <code>dis<\/code> + Tab, then <code>system-view<\/code>, <code>quit<\/code>, <code>return<\/code>. Note how the prompt changes.","Rename R1, set both interface IPs, and set the PCs' IP/mask/gateway in their Basic Config tab.","Ping PC2 from PC1. Then on R1 run <code>display arp<\/code>.","Run <code>compare configuration<\/code>, then <code>save<\/code>, then <code>reboot<\/code>, and confirm the config is still there."],"config":[["R1","<Huawei> system-view\n[Huawei] sysname R1\n[R1] interface GigabitEthernet0/0/0\n[R1-GigabitEthernet0/0/0] ip address 10.1.1.254 24\n[R1-GigabitEthernet0/0/0] description to-PC1\n[R1-GigabitEthernet0/0/0] quit\n[R1] interface GigabitEthernet0/0/1\n[R1-GigabitEthernet0/0/1] ip address 10.1.2.254 24\n[R1-GigabitEthernet0/0/1] return\n<R1> save"]],"verify":[["display ip interface brief","Both interfaces up/up with the right IPs."],["display current-configuration interface GigabitEthernet0/0/0","Only that interface's config."],["display arp","Dynamic entries for 10.1.1.1 and 10.1.2.1 after the ping."],["display saved-configuration","Matches the running config after save."]],"pitfalls":["Forgetting the PC gateway → ping to the other subnet fails.","Not saving before closing eNSP; also save the topology (.topo) file."]},{"id":"LAB2","week":2,"mins":35,"title":"VLANs and trunks across two switches","lessons":["L19","L20"],"goal":"Same-VLAN hosts talk across a trunk; different VLANs stay isolated.","topo":{"type":"topo","w":620,"h":220,"nodes":[["SW1","sw",200,70],["SW2","sw",420,70],["PC1 V10 .1.1","pc",100,180],["PC2 V20 .2.1","pc",260,180],["PC3 V10 .1.2","pc",360,180],["PC4 V20 .2.2","pc",520,180]],"links":[["SW1","SW2","G0/0/24 trunk"],["SW1","PC1 V10 .1.1","E0/0/1"],["SW1","PC2 V20 .2.1","E0/0/2"],["SW2","PC3 V10 .1.2","E0/0/1"],["SW2","PC4 V20 .2.2","E0/0/2"]],"path":["PC1 V10 .1.1","SW1","SW2","PC3 V10 .1.2"]},"tasks":["Use two S5700 switches. PCs: PC1 192.168.1.1/24, PC3 192.168.1.2/24 (VLAN 10); PC2 192.168.2.1/24, PC4 192.168.2.2/24 (VLAN 20).","Create VLANs 10 and 20, make the PC ports access ports, and make the inter-switch link a trunk.","Ping PC1 → PC3 (should work) and PC1 → PC2 (should fail — no router yet).","Capture on the trunk in Wireshark: find the 802.1Q tag and its VID.","Bonus: remove VLAN 20 from the trunk's allowed list and see PC2 → PC4 fail."],"config":[["SW1 (SW2 is identical)","[SW1] vlan batch 10 20\n[SW1] interface GigabitEthernet0/0/1\n[SW1-GigabitEthernet0/0/1] port link-type access\n[SW1-GigabitEthernet0/0/1] port default vlan 10\n[SW1] interface GigabitEthernet0/0/2\n[SW1-GigabitEthernet0/0/2] port link-type access\n[SW1-GigabitEthernet0/0/2] port default vlan 20\n[SW1] interface GigabitEthernet0/0/24\n[SW1-GigabitEthernet0/0/24] port link-type trunk\n[SW1-GigabitEthernet0/0/24] port trunk allow-pass vlan 10 20"]],"verify":[["display vlan","VLAN 10 and 20 with the right ports; the trunk is tagged (T) in both."],["display port vlan","Link type and PVID of every port."],["display mac-address","PC MACs learned in the right VLANs."]],"pitfalls":["Port names depend on the model (E0/0/x on S3700, G0/0/x on S5700) — check with display interface brief.","If a port was hybrid, set link-type first, then the VLAN."]},{"id":"LAB3","week":2,"mins":40,"title":"Inter-VLAN routing: router-on-a-stick, then VLANIF","lessons":["L21"],"goal":"Route between VLAN 10 and VLAN 20 two ways and compare.","topo":{"type":"topo","w":620,"h":210,"nodes":[["R1","router",310,40],["SW1","sw",310,120],["PC1 V10","pc",170,185],["PC2 V20","pc",450,185]],"links":[["R1","SW1","G0/0/0 ↔ G0/0/24 trunk"],["SW1","PC1 V10"],["SW1","PC2 V20"]],"path":["PC1 V10","SW1","R1","SW1","PC2 V20"]},"tasks":["Reuse SW1 from Lab 2. Gateways: VLAN 10 = 192.168.1.254, VLAN 20 = 192.168.2.254 (set them on the PCs).","Part A: router-on-a-stick on R1 with two dot1q sub-interfaces; the switch port to R1 is a trunk.","Ping PC1 → PC2. Run tracert on the PC and see the gateway hop.","Part B: delete R1's sub-interfaces (or disconnect R1) and create Vlanif10/Vlanif20 on SW1 (S5700 = Layer 3 capable) with the same gateway IPs. Ping again."],"config":[["R1 (part A)","[R1] interface GigabitEthernet0/0/0.10\n[R1-GigabitEthernet0/0/0.10] dot1q termination vid 10\n[R1-GigabitEthernet0/0/0.10] ip address 192.168.1.254 24\n[R1-GigabitEthernet0/0/0.10] arp broadcast enable\n[R1] interface GigabitEthernet0/0/0.20\n[R1-GigabitEthernet0/0/0.20] dot1q termination vid 20\n[R1-GigabitEthernet0/0/0.20] ip address 192.168.2.254 24\n[R1-GigabitEthernet0/0/0.20] arp broadcast enable"],["SW1 (part A uplink)","[SW1] interface GigabitEthernet0/0/24\n[SW1-GigabitEthernet0/0/24] port link-type trunk\n[SW1-GigabitEthernet0/0/24] port trunk allow-pass vlan 10 20"],["SW1 (part B)","[SW1] interface Vlanif10\n[SW1-Vlanif10] ip address 192.168.1.254 24\n[SW1] interface Vlanif20\n[SW1-Vlanif20] ip address 192.168.2.254 24"]],"verify":[["display ip interface brief (R1 / SW1)","Sub-interfaces or Vlanifs up/up."],["display ip routing-table","Two direct routes: 192.168.1.0/24 and 192.168.2.0/24."],["display arp (R1)","Entries for both PCs in their VLANs."]],"pitfalls":["Missing arp broadcast enable → the router can't ARP on the sub-interface.","A Vlanif stays down if no port in that VLAN is up."]},{"id":"LAB4","week":2,"mins":40,"title":"Static, default and floating static routes","lessons":["L14","L15"],"goal":"Build full reachability with static routes, then add an automatic backup path.","topo":{"type":"topo","w":620,"h":220,"nodes":[["R1 Lo0 1.1.1.1","router",100,110],["R2 Lo0 2.2.2.2","router",310,40],["R3 Lo0 3.3.3.3","router",520,110]],"links":[["R1 Lo0 1.1.1.1","R2 Lo0 2.2.2.2","10.0.12.0/24"],["R2 Lo0 2.2.2.2","R3 Lo0 3.3.3.3","10.0.2

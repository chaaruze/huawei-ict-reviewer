<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Network Track Sprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a patch-panel study console. Sticky header (countdown, XP, streak LED) + scrollable tab strip;
   one working column (max 980px). Domains take the T568B pair colours: blue, orange, green, brown. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --sunk:#e9eef2; --ink:#14202b; --ink-2:#4a5866; --line:#d6dee5;
  --accent:#1d5fa8; --accent-ink:#ffffff; --led:#16a34a; --warn:#b45309; --bad:#b42318; --good:#15803d;
  --datacom:#1d5fa8; --security:#c2581b; --wlan:#2f7d46; --dcn:#7b5232; --muted:#6b7a88;
  --datacom-soft:#e3edf8; --security-soft:#fbeadf; --wlan-soft:#e2f1e6; --dcn-soft:#f1e7dd; --muted-soft:#eceff2;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#151d25; --sunk:#1b252f; --ink:#e4ebf1; --ink-2:#9fb0bf; --line:#283542;
  --accent:#5b9be0; --accent-ink:#0b1219; --led:#22c55e; --warn:#f0a43a; --bad:#f07167; --good:#4ade80;
  --datacom:#6aa6e8; --security:#f08a4b; --wlan:#5cc07c; --dcn:#c79367; --muted:#8a9aa8;
  --datacom-soft:#17283b; --security-soft:#33200f; --wlan-soft:#14291b; --dcn-soft:#2c2017; --muted-soft:#1e2833;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#151d25; --sunk:#1b252f; --ink:#e4ebf1; --ink-2:#9fb0bf; --line:#283542;
  --accent:#5b9be0; --accent-ink:#0b1219; --led:#22c55e; --warn:#f0a43a; --bad:#f07167; --good:#4ade80;
  --datacom:#6aa6e8; --security:#f08a4b; --wlan:#5cc07c; --dcn:#c79367; --muted:#8a9aa8;
  --datacom-soft:#17283b; --security-soft:#33200f; --wlan-soft:#14291b; --dcn-soft:#2c2017; --muted-soft:#1e2833;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:5px;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top > .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.35rem;font-weight:700;letter-spacing:.02em}
.brand span{font-size:.78rem;color:var(--ink-2)}
.stats{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sunk);font-size:.82rem;white-space:nowrap}
.led{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.led.on{background:var(--led);box-shadow:0 0 0 3px color-mix(in srgb,var(--led) 25%,transparent);animation:blink 2.4s infinite}
@keyframes blink{0%,92%,100%{opacity:1}95%{opacity:.35}}
.xp{display:flex;flex-direction:column;gap:3px;min-width:150px}
.xp small{font-size:.75rem;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.bar{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.tabs{border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs .wrap{display:flex;flex-wrap:nowrap;gap:2px;padding-block:0;width:max-content;min-width:100%}
.tab{border:0;background:none;padding:10px 12px;font-family:var(--f-display);font-size:1.02rem;font-weight:600;letter-spacing:.03em;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 60px}
.view{display:flex;flex-direction:column;gap:18px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-2)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.92rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:12px 20px;font-size:1.02rem}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:700;font-size:.88rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dom{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.dom::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.dom.datacom{color:var(--datacom);background:var(--datacom-soft)} .dom.security{color:var(--security);background:var(--security-soft)}
.dom.wlan{color:var(--wlan);background:var(--wlan-soft)} .dom.dcn{color:var(--dcn);background:var(--dcn-soft)}
input[type=text],input[type=date],input[type=number],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:120px;resize:vertical}
.kbd{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r)}
ul.clean{list-style:none;padding:0;margin:0}
.list{display:flex;flex-direction:column;gap:8px}
.scroll-x{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
td.num{font-family:var(--f-mono);white-space:nowrap}

/* today */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.count{font-family:var(--f-display);font-size:3.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pick{display:flex;flex-direction:column;gap:12px}
.next{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--sunk)}
.goalrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.meter{display:flex;flex-direction:column;gap:5px;font-size:.84rem}
.meter b{font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.timer{font-family:var(--f-mono);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.lessonrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.lessonrow:hover{border-color:var(--accent)}
.lessonrow .t{flex:1;min-width:0}
.lessonrow .t b{display:block;font-size:.98rem}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--led)}

/* lesson */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px}
.step .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;background:var(--sunk);color:var(--ink-2);border:2px solid var(--line)}
.step.done .n{background:var(--led);border-color:var(--led);color:#fff}
.step .body{display:flex;flex-direction:column;gap:12px;min-width:0}
.learn li{margin-bottom:6px}
.callout{border-radius:9px;padding:12px 14px;background:var(--sunk)}
.callout b{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.ai{white-space:pre-wrap;line-height:1.6}

/* diagrams */
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto}
.diagram svg{display:block;width:100%;height:auto;min-width:520px}
.diagram .cap{font-size:.8rem;color:var(--ink-2);margin-bottom:6px;font-weight:700}
svg text{font-family:var(--f-body);fill:var(--ink)}
.sv-link{stroke:var(--line);stroke-width:2.2}
.sv-path{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:5 5;fill:none;opacity:.55}
.sv-lbl{font-size:10.5px;fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.sv-node{fill:var(--surface);stroke-width:2}
.sv-name{font-size:11.5px;font-weight:700}
.sv-pkt{fill:var(--security)}
.sv-life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 4}
.sv-actor{fill:var(--sunk);stroke:var(--line)}
.sv-msg{stroke:var(--accent);stroke-width:2;fill:none}
.sv-arrow{fill:var(--accent)}
.sv-step{opacity:1}
.anim .sv-step{animation:stepin .45s both}
@keyframes stepin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anim .sv-step{animation:none}.led.on{animation:none}}
.stackd{display:flex;flex-direction:column;gap:6px}
.stackd .r{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:8px 12px;border-radius:8px}
.stackd .r b{font-size:.92rem}
.stackd .r span{font-size:.86rem;color:var(--ink-2)}
@media (max-width:560px){.stackd .r{grid-template-columns:1fr}}
.tint-datacom{background:var(--datacom-soft)} .tint-sec{background:var(--security-soft)} .tint-wlan{background:var(--wlan-soft)} .tint-dcn{background:var(--dcn-soft)} .tint-muted{background:var(--muted-soft)}
.bard{display:flex;min-width:520px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bard div{padding:10px 6px;font-size:.78rem;font-weight:700;text-align:center;border-right:1px solid var(--surface);min-width:54px;display:flex;align-items:center;justify-content:center}
.flowd{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flowd .fs{flex:1 1 130px;border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.flowd .fs b{font-size:.92rem} .flowd .fs span{font-size:.82rem;color:var(--ink-2)}
.flowd .fa{align-self:center;font-weight:700;color:var(--ink-2);font-size:1.1rem}
@media (max-width:560px){.flowd{flex-direction:column}.flowd .fs{flex:0 0 auto}.flowd .fa{transform:rotate(90deg)}}
.cmpd{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cmpd .cc{border:1px solid var(--line);border-radius:9px;overflow:hidden;min-width:0}
.cmpd .cc h4{margin:0;padding:8px 12px;font-family:var(--f-display);font-size:1.05rem;font-weight:700;letter-spacing:.02em}
.cmpd .cc ul{margin:0;padding:8px 12px 10px 28px;font-size:.86rem}
.cmpd .cc li{margin-bottom:3px}
.nestd .ly{border:2px solid var(--line);border-radius:10px;padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.nestd .ly>small{font-weight:700;font-size:.78rem}
.nestd .core{border-radius:8px;padding:10px;text-align:center;font-weight:700;font-size:.86rem;background:var(--surface);border:1px dashed var(--ink-2)}
.b-datacom{border-color:var(--datacom)!important}.b-sec{border-color:var(--security)!important}.b-wlan{border-color:var(--wlan)!important}.b-dcn{border-color:var(--dcn)!important}.b-muted{border-color:var(--muted)!important}
.clid{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 0;font-family:var(--f-mono);font-size:.78rem;overflow-x:auto}
.clid .ln{display:flex;gap:8px;padding:1px 12px;white-space:pre;min-width:max-content}
.clid .ln.hl{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.mk{flex:0 0 18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;display:inline-grid;place-items:center;font-family:var(--f-body)}
.mk.mk0{background:transparent}
.clnotes{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:5px;font-size:.86rem}
.clnotes li{display:flex;gap:8px;align-items:flex-start}
.bitsd{display:flex;flex-direction:column;gap:6px;min-width:max-content}
.bitsd .br{display:flex;align-items:center;gap:8px}
.bitsd .bl{width:84px;font-size:.8rem;font-weight:700;text-align:right;flex:0 0 auto}
.bitsd .oct{display:flex;gap:2px;margin-right:6px;flex:0 0 auto}
.bitsd .br>*{flex-shrink:0}
.bitsd i{font-style:normal;flex:0 0 18px;width:18px;height:24px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.bitsd i.bn{background:var(--datacom-soft);border-color:var(--datacom)} .bitsd i.bh{background:var(--security-soft);border-color:var(--security)}
.bitsd i.on{color:var(--ink);font-weight:700}
.bitsd .pv i{border:0;background:none;font-size:.62rem;width:18px}
.bitsd .legend{font-size:.76rem;color:var(--ink-2);display:flex;gap:12px;margin-top:4px}
.plain{display:flex;flex-direction:column;gap:10px}
.plain p{margin:0;max-width:68ch}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.terms div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.terms b{display:block;font-size:.9rem}
details.sum{border:1px solid var(--line);border-radius:9px;padding:10px 14px}
details.sum summary{cursor:pointer;font-weight:700}
html.no-claude .needs-claude{display:none!important}

/* flashcards */
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:28px}
.flash .q{font-size:1.3rem;font-weight:700}
.flash .a{font-size:1.12rem;border-top:1px dashed var(--line);padding-top:14px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate .btn{flex-direction:column;gap:2px}
.rate small{font-weight:400;font-size:.74rem;color:var(--ink-2)}

/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .box{flex:0 0 22px;height:22px;border:2px solid var(--ink-2);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt.round .box{border-radius:50%} .opt.sq .box{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--datacom-soft)}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.qnav button{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:.8rem;font-family:var(--f-mono);cursor:pointer}
.qnav button.ans{background:var(--sunk);border-color:var(--ink-2)}
.qnav button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.qnav button.cur{outline:2px solid var(--accent)}
.qnav button.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.qnav button.no{background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.verdict{padding:12px 14px;border-radius:9px;border:1px solid var(--line)}
.verdict.ok{border-color:var(--good)} .verdict.no{border-color:var(--bad)}
.dbar{display:grid;grid-template-columns:90px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.88rem}
.dbar .bar{height:10px}
.dbar .bar>i.datacom{background:var(--datacom)} .dbar .bar>i.security{background:var(--security)} .dbar .bar>i.wlan{background:var(--wlan)} .dbar .bar>i.dcn{background:var(--dcn)}

/* labs */
pre{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:.8rem;line-height:1.5;margin:0;max-width:100%}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:5px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--led)}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl.here{background:linear-gradient(90deg,var(--datacom-soft),transparent)}
@media (max-width:560px){.tl{grid-template-columns:1fr;gap:4px}}
.day{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.day.today{background:var(--datacom-soft);border-radius:8px;padding-inline:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 6px;font-size:.82rem;margin:2px 4px 2px 0;background:var(--surface);cursor:pointer;color:var(--ink)}
.pill .sw{width:9px;height:9px;border-radius:2px}
.pill.done{opacity:.6;text-decoration:line-through}
.ring{--p:0;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--led) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:0 0 auto}
.ring::after{content:attr(data-v);width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.66rem;font-weight:700;font-family:var(--f-mono)}
.badge{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;border:1px solid var(--line)}
.badge.got{border-color:var(--led);background:color-mix(in srgb,var(--led) 10%,var(--surface))}
.badge .ico{width:28px;height:28px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.badge.got .ico{background:var(--led);color:#fff}
.foot{font-size:.78rem;color:var(--ink-2);padding-block:20px;border-top:1px solid var(--line)}
@media (max-width:560px){
  .top{position:static} .brand span{display:none} .top > .wrap{gap:8px;padding-block:8px}
  .stats{margin-left:0;width:100%;gap:8px} .xp{flex:1;min-width:120px} .chip{font-size:.78rem;padding:3px 8px}
  .step{grid-template-columns:minmax(0,1fr)} .step .n{display:none}
  .card{padding:14px} h1{font-size:1.6rem} h2{font-size:1.35rem} .count{font-size:2.6rem}
  .goalrow{grid-template-columns:minmax(0,1fr)} .rate{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{padding-block:14px 40px}
}

<script>
const DATA = {"lessons":[{"id":"F01","week":1,"domain":"datacom","pri":1,"mins":20,"title":"The big picture: what happens when you open a website","book":"Ch 1–2 overview · pp. 1–25 (skim the figures)","hook":{"analogy":"Opening a website is like ordering food delivery: you look up the restaurant's address (DNS), walk to your building's front door (gateway), the courier drives across the city (routers), and the restaurant sends food back the same way.","mnemonic":"Get an address (DHCP) → find the name (DNS) → find the door (ARP) → cross the switch → cross the routers → reach the server → come back.","diagram":{"type":"topo","w":640,"h":230,"nodes":[["Your PC","pc",50,120],["Switch","sw",170,120],["Router (gateway)","router",300,120],["Internet","cloud",430,120],["Web server","server",580,120],["DNS server","server",300,205]],"links":[["Your PC","Switch"],["Switch","Router (gateway)"],["Router (gateway)","Internet"],["Internet","Web server"],["Router (gateway)","DNS server"]],"path":["Your PC","Switch","Router (gateway)","Internet","Web server"]}},"learn":["A network moves <b>data<\/b> between devices. Every device needs an <b>address<\/b>, and every message follows <b>rules<\/b> called <b>protocols<\/b>.","<b>Step 1 — get an address<\/b>: when your PC joins the network, <b>DHCP<\/b> gives it an IP address, a mask, a default gateway and a DNS server.","<b>Step 2 — turn the name into a number<\/b>: you type <code>www.example.com<\/code>; <b>DNS<\/b> answers with the server's IP address.","<b>Step 3 — find the exit<\/b>: the server is on another network, so your PC sends the packet to its <b>default gateway<\/b> (a router). <b>ARP<\/b> finds the gateway's MAC address.","<b>Step 4 — the switch<\/b> delivers the frame inside your LAN using MAC addresses.","<b>Step 5 — the routers<\/b> pass the packet network by network using IP addresses and routing tables. Your home/office router also does <b>NAT<\/b> (private → public address).","<b>Step 6 — the server<\/b> answers (TCP handshake, then HTTP/HTTPS), and the reply comes back along the same kind of path.","Every later lesson zooms into one of these steps. Keep this map in mind."],"video":"what happens when you type a URL in the browser networking","do":{"kind":"think","text":"On your PC, open a command prompt and run <code>ipconfig /all<\/code> (Windows). Find your IP address, mask, default gateway and DNS server — the four things DHCP gave you."},"teach":"Tell the story of opening a website in 6 steps, naming the protocol used at each step.","simple":["Think of the Internet as a huge postal system. Your PC can only send something if it knows <b>where<\/b> it's going (an address) and <b>how<\/b> to package it (protocols — agreed rules, like how to write an envelope).","When you plug in or join Wi-Fi, your PC knows nothing. It shouts “Can someone give me an address?” and a <b>DHCP server<\/b> (usually inside your router) answers with four things: <b>your IP address<\/b>, <b>the mask<\/b> (how big your local neighbourhood is), <b>the default gateway<\/b> (the router that is your exit) and <b>a DNS server<\/b> (the phone book).","You type <code>www.example.com<\/code>. Computers don't use names, they use numbers, so your PC asks the <b>DNS server<\/b>: “What's the IP of www.example.com?” DNS replies, say, <code>93.184.216.34<\/code>.","Your PC compares that IP with its own neighbourhood (using the mask). It's far away, so the packet must go to the <b>gateway<\/b>. But to hand a packet to anyone on the local cable you need their <b>MAC address<\/b> (the hardware name), so the PC uses <b>ARP<\/b>: “Who has the gateway's IP? Tell me your MAC.”","The PC wraps the data in an Ethernet <b>frame<\/b> addressed to the gateway's MAC. The <b>switch<\/b> reads that MAC and sends the frame only out of the port where the gateway is. The <b>router<\/b> unwraps the frame, looks at the destination <b>IP<\/b>, checks its routing table and sends it to the next router. Many routers later, it arrives at the web server.","Before the page arrives, PC and server do a <b>TCP handshake<\/b> (SYN, SYN-ACK, ACK) so both are ready, then the browser asks for the page with <b>HTTP/HTTPS<\/b>. The answer travels back the same way. All of that happens in under a second!"],"terms":[["Protocol","An agreed set of rules for talking, e.g. HTTP for web pages."],["IP address","A device's network address, like a postal address (e.g. 192.168.1.10)."],["MAC address","A device's hardware name burned into its network card (e.g. 5489-98aa-0001)."],["Default gateway","The router your PC uses to leave its own network."],["DNS","The Internet's phone book — names to IP addresses."],["DHCP","The service that hands out IP settings automatically."]],"visuals":[{"type":"flow","title":"The six steps of loading a page","steps":[["1 · DHCP","Get IP, mask, gateway, DNS","wlan"],["2 · DNS","Name → IP address","wlan"],["3 · ARP","Gateway IP → gateway MAC","datacom"],["4 · Switch","Deliver frame by MAC","datacom"],["5 · Routers","Forward packet by IP (+ NAT at the edge)","sec"],["6 · Server","TCP handshake → HTTP reply","dcn"]]},{"type":"compare","title":"Two kinds of address, two kinds of device","cols":[["MAC address · Layer 2","datacom",["Burned into the network card","Used inside one local network","Read by switches","Example: 5489-98aa-0001"]],["IP address · Layer 3","sec",["Given by you or DHCP; changes when you move","Used across networks","Read by routers","Example: 192.168.1.10"]]]}],"cards":[{"id":"F01-c1","q":"Which protocol gives a PC its IP address automatically?","a":"DHCP."},{"id":"F01-c2","q":"Which protocol turns a website name into an IP address?","a":"DNS."},{"id":"F01-c3","q":"Which protocol finds the MAC address for a known IP on the local network?","a":"ARP."},{"id":"F01-c4","q":"Where does a PC send packets for other networks?","a":"To its default gateway (a router)."},{"id":"F01-c5","q":"A switch forwards using ___ addresses; a router using ___ addresses.","a":"MAC; IP."},{"id":"F01-c6","q":"What does NAT do at the edge of a home/office network?","a":"Swaps private IP addresses for a public one so traffic can go on the Internet."}],"qs":[{"id":"F01-q1","t":"one","q":"A user types a website name. Which protocol is used first to find the server's IP address?","o":["ARP","DNS","DHCP","ICMP"],"a":[1],"e":"DNS resolves names to IP addresses."},{"id":"F01-q2","t":"one","q":"Which four settings does DHCP typically give a PC?","o":["MAC, IP, port, VLAN","IP address, mask, default gateway, DNS server","SSID, password, channel, band","Hostname, username, password, domain"],"a":[1],"e":"These four let the PC talk locally and reach other networks."},{"id":"F01-q3","t":"tf","q":"To reach a server on another network, a PC sends the frame to the default gateway's MAC address.","o":["True","False"],"a":[0],"e":"The gateway (router) then forwards the packet onward."},{"id":"F01-q4","t":"multi","q":"Which devices or protocols take part in loading a website from a home PC?","o":["Switch","Router","DNS","STP root bridge election"],"a":[0,1,2],"e":"STP is about loop prevention between switches, not part of the request itself."}]},{"id":"F02","week":1,"domain":"datacom","pri":1,"mins":20,"title":"Bits, bytes, binary and hex — the language of networks","book":"Ch 4 · §4.1 · pp. 113–117","hook":{"analogy":"Binary is a row of light switches: each switch is either off (0) or on (1). Eight switches together are one byte, and the position of each switch decides how much it's worth.","mnemonic":"Switch values, left to right: 128 · 64 · 32 · 16 · 8 · 4 · 2 · 1 (each is double the next). All on = 255.","diagram":{"type":"bits","title":"The number 192 as one byte","rows":[["192","11000000",8]],"place":true}},"learn":["A <b>bit<\/b> is a single 0 or 1. A <b>byte<\/b> = 8 bits and can hold values 0–255.","<b>Binary → decimal<\/b>: add the values of the positions that are 1. 10100000 = 128 + 32 = 160.","<b>Decimal → binary<\/b>: from the left, subtract each position value if it fits and write 1; otherwise 0. 200 = 128 (72 left) + 64 (8 left) + 8 → 11001000.","<b>Hexadecimal<\/b> (base 16) uses 0–9 then A=10 … F=15. One hex digit = exactly 4 bits, so a byte is 2 hex digits: 1111 1111 = FF = 255. MAC and IPv6 addresses are written in hex.","Speeds are counted in <b>bits per second<\/b> (bit/s): 1 Gbit/s = 1,000 Mbit/s. File sizes are usually in <b>bytes<\/b> (B). 8 bits = 1 byte, so a 100 Mbit/s link moves about 12.5 MB per second.","An IPv4 address is 32 bits = 4 bytes, written as 4 decimal numbers (octets). An IPv6 address is 128 bits written in hex."],"video":"binary numbers explained for networking beginners","do":{"kind":"drill","ref":"binary","text":"Binary drill: 10 conversions. Write the 128-64-32-16-8-4-2-1 row on paper first."},"teach":"Explain how to turn 172 into binary, step by step, as if teaching a younger student.","simple":["Computers only understand <b>on<\/b> and <b>off<\/b>. We write off as 0 and on as 1. One of these is a <b>bit<\/b>. Eight bits in a row make a <b>byte<\/b>.","The trick to reading binary is that each position has a value, and each value is double the one to its right: <b>128, 64, 32, 16, 8, 4, 2, 1<\/b>. To read a byte, add up the values where there's a 1. Example: <code>11000000<\/code> → the 128 and the 64 are on → 192.","To write a number in binary, walk the positions from the left. Ask “does 128 fit?” For 172: yes → write 1, 172 − 128 = 44 left. Does 64 fit in 44? No → 0. 32? Yes → 1, 12 left. 16? No → 0. 8? Yes → 1, 4 left. 4? Yes → 1, 0 left. 2? 0. 1? 0. Result: <code>10101100<\/code>.","<b>Hex<\/b> is a shorthand for binary. Because one hex digit stands for exactly four bits, you can split a byte into two halves: <code>1010 1100<\/code> = A C → <code>AC<\/code>. That's why MAC addresses (48 bits) look like <code>5489-98aa-0001<\/code> and IPv6 addresses look like <code>2001:db8::1<\/code>.","Watch the units! Network speed uses <b>bits<\/b> (small b): 100 Mbit/s. Storage uses <b>bytes<\/b> (big B): 100 MB. Divide bits by 8 to get bytes."],"terms":[["Bit","One 0 or 1 — the smallest piece of data."],["Byte / octet","8 bits; one quarter of an IPv4 address."],["Binary","Base-2 numbers (only 0 and 1)."],["Hexadecimal","Base-16 numbers (0–9, A–F); one digit = 4 bits."],["bit/s vs B","Speeds in bits per second; sizes in bytes."]],"visuals":[{"type":"bits","title":"Reading bytes: add the values of the 1s","rows":[["160","10100000",8],["172","10101100",8],["255","11111111",8]],"place":true},{"type":"compare","title":"One value, three ways to write it","cols":[["Decimal","datacom",["What people use","Digits 0–9","Example: 172"]],["Binary","sec",["What machines use","Digits 0–1","Example: 10101100"]],["Hex","wlan",["Short form of binary","Digits 0–9, A–F","Example: AC"]]]}],"cards":[{"id":"F02-c1","q":"How many bits in a byte?","a":"8."},{"id":"F02-c2","q":"Values of the 8 bit positions","a":"128 64 32 16 8 4 2 1."},{"id":"F02-c3","q":"11111111 in decimal","a":"255."},{"id":"F02-c4","q":"10000000 in decimal","a":"128."},{"id":"F02-c5","q":"Hex digit F in decimal and binary","a":"15 = 1111."},{"id":"F02-c6","q":"How many bits does one hex digit represent?","a":"4."},{"id":"F02-c7","q":"Bits vs bytes in speeds","a":"Link speeds are in bits/s; 8 bits = 1 byte (100 Mbit/s ≈ 12.5 MB/s)."},{"id":"F02-c8","q":"How many bits in IPv4 and IPv6 addresses?","a":"32 and 128."}],"qs":[{"id":"F02-q1","t":"one","q":"What is 10101010 in decimal?","o":["160","170","180","190"],"a":[1],"e":"128 + 32 + 8 + 2 = 170."},{"id":"F02-q2","t":"one","q":"What is 224 in binary?","o":["11000000","11100000","11110000","10100000"],"a":[1],"e":"128 + 64 + 32 = 224."},{"id":"F02-q3","t":"one","q":"What is hex 0x1F in decimal?","o":["15","16","31","32"],"a":[2],"e":"1×16 + 15 = 31."},{"id":"F02-q4","t":"tf","q":"A 1 Gbit/s link can transfer roughly 125 megabytes per second at most.","o":["True","False"],"a":[0],"e":"1000 Mbit ÷ 8 = 125 MB."},{"id":"F02-q5","t":"multi","q":"Which statements are correct?","o":["One byte holds values 0–255","One hex digit equals 4 bits","An IPv4 address is 64 bits","MAC addresses are usually written in hex"],"a":[0,1,3],"e":"IPv4 = 32 bits."}]},{"id":"F03","week":1,"domain":"datacom","pri":2,"mins":15,"title":"Addresses and ports: who is who on a network","book":"Ch 2 · §2.1–2.4 (address sections) · pp. 15–64","hook":{"analogy":"To deliver a parcel to an apartment you need: the building's street address (IP), the name on the doorbell for the last few metres (MAC), and the apartment number (port).","mnemonic":"MAC = who on this cable · IP = which network and host · Port = which program.","diagram":{"type":"nest","title":"One web packet carries all three","layers":[["Ethernet: src MAC → dst MAC","dcn"],["IP: 192.168.1.10 → 93.184.216.34","datacom"],["TCP: port 51000 → port 443","sec"]],"inner":"HTTPS data (the web page request)"}},"learn":["<b>MAC address<\/b> (48 bits, hex): identifies a network card on the local link. Changes at every router hop (each link has its own frame).","<b>IP address<\/b> (IPv4 32 bits): identifies a device <i>and<\/i> its network. Stays the same end to end (unless NAT changes it).","<b>Port number<\/b> (0–65535): identifies the application/service on a device. Servers use well-known ports (80 HTTP, 443 HTTPS, 22 SSH); clients use a random high port.","<b>Subnet mask<\/b>: says which part of the IP is the network and which part is the host. Same network → talk directly; different network → go through the gateway.","<b>Hostname/domain name<\/b> (www.example.com): a human-friendly name that DNS turns into an IP.","Together, source IP + destination IP + protocol + source port + destination port identify one conversation (the <b>5-tuple<\/b>)."],"video":"MAC address vs IP address vs port number explained","do":{"kind":"think","text":"Run <code>ipconfig /all<\/code> and <code>netstat -n<\/code> on a PC. Find your MAC, your IP, and some open connections with their port numbers."},"teach":"Explain why we need MAC addresses, IP addresses and port numbers — what each one would be in a parcel delivery.","simple":["Imagine sending a parcel to a friend in a big apartment building in another city. The <b>street address<\/b> gets it to the right building — that's the <b>IP address<\/b>. It never changes during the trip.","But each courier only drives one leg: from your house to the depot, depot to depot, depot to your friend's building. On each leg the label says “from this depot to the next depot”. That short-hop label is the <b>MAC address<\/b>: it only matters on one local link, and a new one is written at every stop (every router).","When the parcel reaches the building, it still needs the right apartment: that's the <b>port number<\/b>. A web server listens at “apartment 443” (HTTPS), a remote-login service at 22 (SSH). Your browser picks a random high apartment number like 51000 for the reply to come back to.","How does your PC know if your friend is in the <b>same<\/b> building (local network) or another city? It uses the <b>subnet mask<\/b>: with mask 255.255.255.0 (/24), any address starting with the same first three numbers is local. Local → deliver directly. Not local → hand it to the <b>default gateway<\/b>."],"terms":[["Port","A number that picks the program on a device (0–65535)."],["Well-known port","0–1023, used by servers (80, 443, 22…)."],["Subnet mask","Marks which bits of an IP are the network part."],["Hop","One link between two devices, e.g. PC → router."],["5-tuple","The five values that identify one connection."]],"visuals":[{"type":"topo","w":640,"h":200,"title":"IP stays the same, MAC changes at each hop","nodes":[["PC","pc",60,90],["R1","router",250,90],["R2","router",420,90],["Server","server",590,90]],"links":[["PC","R1","MAC: PC → R1"],["R1","R2","MAC: R1 → R2"],["R2","Server","MAC: R2 → Server"]],"path":["PC","R1","R2","Server"]},{"type":"flow","title":"Is the destination local?","steps":[["Compare","My network part vs destination's (using the mask)","datacom"],["Same?","→ ARP for the destination's MAC, send directly","wlan"],["Different?","→ ARP for the gateway's MAC, send to the router","sec"]]}],"cards":[{"id":"F03-c1","q":"What does a port number identify?","a":"The application or service on a device (e.g. 443 = HTTPS)."},{"id":"F03-c2","q":"Does the MAC address stay the same end to end across routers?","a":"No — each link builds a new frame with new MACs; the IP stays the same."},{"id":"F03-c3","q":"What does the subnet mask decide?","a":"Which part of the IP is network vs host — so the PC knows if the destination is local."},{"id":"F03-c4","q":"Range of port numbers","a":"0–65535."},{"id":"F03-c5","q":"5-tuple","a":"Source IP, destination IP, protocol, source port, destination port."}],"qs":[{"id":"F03-q1","t":"tf","q":"As a packet crosses several routers, its source and destination IP addresses normally stay the same, while the MAC addresses change on each link.","o":["True","False"],"a":[0],"e":"Each router builds a new Ethernet frame for the next link (NAT is the exception that changes IPs)."},{"id":"F03-q2","t":"one","q":"Which identifies the application a packet is meant for?","o":["MAC address","IP address","Port number","Subnet mask"],"a":[2],"e":"Ports identify services/apps."},{"id":"F03-q3","t":"one","q":"A PC with 192.168.1.10/24 wants to reach 192.168.1.50. What does it do?","o":["Sends to the default gateway","Sends directly on the local network (after ARP)","Asks DNS","Drops the packet"],"a":[1],"e":"Same /24 network → direct delivery."},{"id":"F03-q4","t":"multi","q":"Which are part of the 5-tuple identifying a connection?","o":["Source IP","Destination port","Protocol","MAC address"],"a":[0,1,2],"e":"MACs aren't part of the 5-tuple."}]},{"id":"F04","week":1,"domain":"datacom","pri":2,"mins":15,"title":"Reading network diagrams and Huawei device names","book":"Preface icon list + Ch 1 · §1.2 · pp. 6–10; Ch 3 · §3.4","hook":{"analogy":"A network diagram is a subway map: stations are devices, lines are cables, and the labels tell you which platform (interface) and which line colour (VLAN/subnet).","mnemonic":"Read a diagram in 3 passes: devices → links + interface names → addresses/VLANs.","diagram":{"type":"topo","w":640,"h":230,"nodes":[["R1 (AR2220)","router",320,40],["SW1 (S5700)","sw",320,130],["PC1","pc",160,200],["AP1","ap",480,200],["FW","fw",500,40]],"links":[["R1 (AR2220)","SW1 (S5700)","G0/0/0 ↔ G0/0/24"],["SW1 (S5700)","PC1","G0/0/1 · VLAN 10"],["SW1 (S5700)","AP1","G0/0/2 · PoE"],["R1 (AR2220)","FW","G0/0/1"]],"path":["PC1","SW1 (S5700)","R1 (AR2220)"]}},"learn":["Common icons: <b>router<\/b> (circle with arrows), <b>switch<\/b> (box with arrows), <b>firewall<\/b> (brick wall), <b>AP<\/b> (radio waves), <b>AC<\/b> (controller box), <b>server<\/b>, <b>PC<\/b>, <b>cloud<\/b> (Internet/WAN).","Huawei product families: <b>AR<\/b> = routers (AR2220 in eNSP), <b>S<\/b> = campus switches (S5700, S3700), <b>CE<\/b> = CloudEngine data-centre switches, <b>USG<\/b> = firewalls, <b>AC<\/b> = wireless controllers (AC6005), <b>AP<\/b> = access points.","Interface names: <code>GigabitEthernet0/0/1<\/code> (G0/0/1) = slot 0 / card 0 / port 1. <code>Ethernet0/0/1<\/code> = 100 Mbit/s port. <code>10GE1/0/1<\/code> = 10 Gbit/s. <code>LoopBack0<\/code> = virtual always-up interface. <code>Vlanif10<\/code> = Layer 3 interface for VLAN 10. <code>Eth-Trunk1<\/code> = bundled links.","Labels on links usually give: interface on each end, the subnet (e.g. 10.0.12.0/24), VLAN, or link type (trunk/access).","Addressing conventions used in labs: link between R1 and R2 = 10.0.12.0/24 with R1 = .1 and R2 = .2; loopbacks X.X.X.X/32 for router X.","Read every lab question in three passes: (1) which devices, (2) how they're connected and on which interfaces, (3) which addresses/VLANs/areas."],"video":"how to read network topology diagram icons","do":{"kind":"think","text":"Open any lab in the eNSP Labs tab and describe its diagram out loud in three passes: devices, links/interfaces, addresses."},"teach":"Explain what “GigabitEthernet0/0/24”, “Vlanif10” and “LoopBack0” mean to someone who has never seen a Huawei device.","simple":["Lab exams and many theory questions start with a diagram. If you can read it calmly, half the work is done.","<b>Pass 1 — the devices.<\/b> Spot the shapes: routers are round with arrows, switches are rectangles with arrows, firewalls look like brick walls, APs show radio waves, clouds are the Internet. Names like <b>AR2220<\/b> (router) or <b>S5700<\/b> (switch) tell you what the device can do.","<b>Pass 2 — the links.<\/b> Each line is a cable. The text near each end is the <b>interface<\/b>: <code>G0/0/1<\/code> means GigabitEthernet slot 0, card 0, port 1. If you see “trunk” or “VLAN 10”, that tells you how the switch port must be configured.","<b>Pass 3 — the addresses.<\/b> Subnets on links (10.0.12.0/24), host IPs, loopbacks (1.1.1.1/32), VLAN numbers, OSPF areas. Write them into a small table before configuring anything.","Virtual interfaces confuse beginners: a <b>LoopBack<\/b> is a pretend interface that never goes down (great as a router's ID). A <b>Vlanif<\/b> gives a VLAN an IP address so the switch can route. An <b>Eth-Trunk<\/b> is several cables acting as one."],"terms":[["Topology","The map of devices and links."],["Interface","A port (physical) or a virtual port (LoopBack, Vlanif)."],["AR / S / CE / USG","Huawei routers / switches / DC switches / firewalls."],["LoopBack","Always-up virtual interface."],["Eth-Trunk","Several physical links bundled into one logical link."]],"visuals":[{"type":"stack","title":"Huawei interface names decoded","rows":[["GigabitEthernet0/0/1","1 Gbit/s port · slot 0 / sub-card 0 / port 1","datacom"],["Ethernet0/0/1","100 Mbit/s port (e.g. S3700 access ports)","muted"],["10GE1/0/1","10 Gbit/s port on CloudEngine switches","dcn"],["LoopBack0","virtual, always up — router ID, management","wlan"],["Vlanif10","virtual Layer 3 interface for VLAN 10","sec"],["Eth-Trunk1","logical bundle of several physical ports","datacom"]]},{"type":"flow","title":"Read any diagram in three passes","steps":[["Devices","What is each box? Router, switch, AP, firewall…","datacom"],["Links","Which interface on each end? Trunk or access?","sec"],["Addresses","Subnets, IPs, VLANs, areas — write a table","wlan"]]}],"cards":[{"id":"F04-c1","q":"GigabitEthernet0/0/1 means…","a":"1 Gbit/s port: slot 0, sub-card 0, port 1."},{"id":"F04-c2","q":"Huawei AR, S, CE, USG product lines","a":"Routers, campus switches, CloudEngine DC switches, firewalls."},{"id":"F04-c3","q":"What is a LoopBack interface?","a":"A virtual interface that is always up — used for router IDs and management."},{"id":"F04-c4","q":"What is a Vlanif interface?","a":"A Layer 3 (IP) interface for a VLAN on a switch."},{"id":"F04-c5","q":"Lab convention: link between R1 and R3","a":"10.0.13.0/24 with R1 = .1 and R3 = .3."}],"qs":[{"id":"F04-q1","t":"one","q":"Which Huawei product line is a firewall?","o":["AR","S","USG","CE"],"a":[2],"e":"USG/HiSecEngine are firewalls; AR routers; S switches; CE DC switches."},{"id":"F04-q2","t":"one","q":"What kind of interface is Vlanif20?","o":["A physical 20 Gbit/s port","A Layer 3 interface for VLAN 20","An aggregated link","A wireless radio"],"a":[1],"e":"Vlanif = VLAN interface."},{"id":"F04-q3","t":"tf","q":"A LoopBack interface stays up as long as the device is running, even if physical ports go down.","o":["True","False"],"a":[0],"e":"That's why it's used for router IDs."},{"id":"F04-q4","t":"multi","q":"Which are valid Huawei interface names?","o":["GigabitEthernet0/0/1","Eth-Trunk1","FastEthernet0/1 (Cisco style)","LoopBack0"],"a":[0,1,3],"e":"FastEthernet0/1 is Cisco naming; Huawei uses Ethernet0/0/1 for 100M ports."}]},{"id":"L01","week":1,"domain":"datacom","pri":2,"mins":15,"title":"What a network is: types and topologies","book":"Ch 1 · §1.1 · pp. 1–6","hook":{"analogy":"A network is a road system for data. Topology is the road map; LAN, MAN and WAN are how far the roads reach.","mnemonic":"Size order, small to big: PAN → LAN → MAN → WAN (“Please Leave My Wi-Fi”).","diagram":{"type":"topo","w":620,"h":230,"nodes":[["Star","label",90,22],["SW","sw",90,115],["A","pc",30,195],["B","pc",90,205],["C","pc",150,195],["Ring","label",310,22],["R1","router",310,70],["R2","router",380,140],["R3","router",310,205],["R4","router",240,140],["Full mesh","label",530,22],["M1","router",480,80],["M2","router",580,80],["M3","router",480,190],["M4","router",580,190]],"links":[["SW","A"],["SW","B"],["SW","C"],["R1","R2"],["R2","R3"],["R3","R4"],["R4","R1"],["M1","M2"],["M1","M3"],["M1","M4"],["M2","M3"],["M2","M4"],["M3","M4"]],"path":["A","SW","C"]}},"learn":["A <b>network<\/b> connects devices so they can share data; the <b>Internet<\/b> is a network of networks joined by routers.","<b>LAN<\/b> covers a building or campus (a few km), <b>MAN<\/b> a city, <b>WAN<\/b> countries and continents (usually leased from carriers). <b>PAN<\/b> = a few metres (Bluetooth). A <b>WLAN<\/b> is a wireless LAN.","<b>Star<\/b>: every node connects to a central switch. Easy to manage; the centre is a single point of failure. This is what almost every modern LAN uses.","<b>Bus<\/b>: one shared cable; cheap but one break kills it. <b>Ring<\/b>: closed loop; no central device. <b>Mesh<\/b>: many redundant links (full mesh = n(n−1)/2 links); very reliable but costly. <b>Tree<\/b> = hierarchical stars.","<b>Physical topology<\/b> is how cables actually run; <b>logical topology<\/b> is how data flows (e.g. a star of cables can still behave like a bus with a hub).","<b>Internet<\/b> = public; <b>intranet<\/b> = an organisation's private network; <b>extranet<\/b> = part of the intranet opened to partners.","Client–server: central servers provide services. Peer-to-peer: every device can be both client and server."],"video":"network topologies star bus ring mesh explained","do":{"kind":"think","text":"Count the links in a full mesh of 5 routers (use n(n−1)/2). Then sketch your school or home network: which topology is it really?"},"teach":"Explain to a friend why almost every office LAN is a star, and what the downside of a star is.","simple":["A <b>network<\/b> is just devices connected so they can share things: files, printers, the Internet. The way the cables (or radio links) are arranged is called the <b>topology<\/b>.","In a <b>star<\/b>, every device has its own cable to one central box (a switch). If one PC's cable breaks, only that PC is affected — that's why every office uses stars. But if the central switch dies, everyone is cut off.","In a <b>bus<\/b>, everyone hangs off one long shared cable (old networks). In a <b>ring<\/b>, each device connects to the next until the loop closes. In a <b>mesh<\/b>, devices have many links to each other, so traffic can always take another path — great for reliability, expensive in cables. Count full-mesh links with <b>n(n−1)/2<\/b>: 4 routers → 4×3/2 = 6 links.","Networks are also named by size: <b>PAN<\/b> (your phone + earbuds), <b>LAN<\/b> (one building or campus), <b>MAN<\/b> (a city), <b>WAN<\/b> (between cities/countries, usually rented from a carrier). The Internet is the biggest WAN of all."],"terms":[["Topology","How devices and links are arranged."],["Star","Everything connects to one central switch."],["Mesh","Many redundant links between devices."],["LAN / WAN","Local (your site) / wide-area (between sites)."]],"visuals":[{"type":"compare","title":"Topologies at a glance","cols":[["Star","datacom",["Central switch","Easy to add devices","Centre = single point of failure","Used in almost every LAN"]],["Ring","sec",["Closed loop","No central device","One break can disrupt the ring"]],["Mesh","wlan",["Many paths","Very reliable","Most cables: n(n−1)/2"]]]},{"type":"stack","title":"Network sizes","rows":[["PAN","a few metres · Bluetooth","muted"],["LAN / WLAN","a building or campus","datacom"],["MAN","a city","wlan"],["WAN","cities, countries — leased lines, Internet","sec"]]}],"cards":[{"id":"L01-c1","q":"Which topology connects every node to one central device?","a":"Star (in modern LANs the central device is a switch)."},{"id":"L01-c2","q":"Formula for links in a full mesh of n nodes","a":"n(n−1)/2 — e.g. 5 nodes → 10 links."},{"id":"L01-c3","q":"LAN vs WAN in one line","a":"LAN = small area, owned by you; WAN = large area, usually leased from a carrier/ISP."},{"id":"L01-c4","q":"Main weakness of a star topology","a":"The central device is a single point of failure."},{"id":"L01-c5","q":"Physical vs logical topology","a":"Physical = how cables are laid; logical = how data actually flows."},{"id":"L01-c6","q":"Intranet vs extranet","a":"Intranet = private to the organisation; extranet = part of it opened to partners/suppliers."},{"id":"L01-c7","q":"Which topology gives the most redundancy?","a":"Full mesh."}],"qs":[{"id":"L01-q1","t":"one","q":"A company connects 6 routers so each has a direct link to every other router. How many links are needed?","o":["6","12","15","30"],"a":[2],"e":"Full mesh needs n(n−1)/2 = 6×5/2 = 15 links."},{"id":"L01-q2","t":"tf","q":"In a star topology, failure of the central switch affects all connected hosts.","o":["True","False"],"a":[0],"e":"The centre is the single point of failure."},{"id":"L01-q3","t":"one","q":"Which network type typically spans a single city?","o":["PAN","LAN","MAN","WAN"],"a":[2],"e":"MAN = metropolitan area network."},{"id":"L01-q4","t":"multi","q":"Which statements about mesh topologies are correct?","o":["They provide high redundancy","They need the fewest cables","Full mesh cost grows quickly with the number of nodes","A single link failure always isolates a node"],"a":[0,2],"e":"Mesh = many paths, so one link failure does not isolate a node, but cabling cost grows as n²."},{"id":"L01-q5","t":"tf","q":"A network whose cables form a star can never behave logically like a bus.","o":["True","False"],"a":[1],"e":"A hub-based star is physically a star but logically a shared bus."}]},{"id":"L02","week":1,"domain":"datacom","pri":2,"mins":15,"title":"Network devices and enterprise network layers","book":"Ch 1 · §1.2–1.3 · pp. 6–13","hook":{"analogy":"Switch = the post room inside one building (delivers by name tag = MAC). Router = the post office between cities (delivers by address = IP). Firewall = the security guard at the gate.","mnemonic":"Hub repeats, Switch selects, Router routes, Firewall filters.","diagram":{"type":"topo","w":620,"h":250,"nodes":[["Internet","cloud",540,50],["FW","fw",430,50],["Router","router",320,50],["Core","l3sw",320,130],["Acc-1","sw",200,200],["Acc-2","sw",440,200],["PC","pc",120,200],["AP","ap",540,200],["AC","ac",200,130]],"links":[["Internet","FW"],["FW","Router"],["Router","Core"],["Core","Acc-1"],["Core","Acc-2"],["Acc-1","PC"],["Acc-2","AP"],["Core","AC"]],"path":["PC","Acc-1","Core","Router","FW","Internet"]}},"learn":["<b>Repeater/hub<\/b> (Layer 1): regenerates bits and sends them out of every port. All ports share one collision domain.","<b>Bridge/switch<\/b> (Layer 2): forwards frames by <b>MAC address<\/b> using a MAC address table. Each port is its own collision domain.","<b>Router<\/b> (Layer 3): forwards packets between networks by <b>IP address<\/b> using a routing table, and separates broadcast domains. A <b>Layer 3 switch<\/b> does switching plus routing in hardware.","<b>Firewall<\/b>: controls traffic between security zones (e.g. trust ↔ untrust) using security policies.","<b>AP<\/b> (access point) gives wireless access. Huawei APs can work as <b>Fat AP<\/b> (standalone), <b>Fit AP<\/b> (managed by an <b>AC<\/b>, wireless access controller), or <b>cloud AP<\/b> (managed from the cloud).","<b>Modem<\/b> converts digital to the carrier's signal; a home “router” is really router + switch + AP + modem in one box.","Enterprise LANs are layered: <b>access<\/b> (connect users), <b>aggregation<\/b> (collect access switches, apply policy), <b>core<\/b> (fast backbone), plus an <b>egress<\/b> area (router/firewall to the WAN or Internet).","Interfaces: <b>RJ45 Ethernet<\/b> ports, <b>SFP<\/b> fibre ports, and the <b>console port<\/b> used for first-time setup."],"video":"hub vs switch vs router explained","do":{"kind":"think","text":"Label each device in the diagram with the OSI layer it mainly works at. Then answer: which one separates broadcast domains?"},"teach":"Explain the difference between a switch and a router to someone who has never heard of either.","simple":["Each network device has one job. A <b>hub<\/b> is dumb: whatever comes in one port is copied out of all the others, so everyone hears everything and collisions happen.","A <b>switch<\/b> is smart about the local network: it learns which device (MAC address) lives on which port and sends each frame only where it needs to go. That's how a LAN stays fast.","A <b>router<\/b> connects <i>different<\/i> networks. It reads the destination <b>IP<\/b> address and decides the next hop using its routing table. Your home router connects your LAN to your ISP.","A <b>firewall<\/b> is a guard between zones (inside vs Internet) that only lets allowed traffic through. An <b>AP<\/b> gives Wi-Fi; in companies many <b>Fit APs<\/b> are controlled by one <b>AC<\/b> (controller).","Big networks are built in layers: <b>access<\/b> switches plug in users, <b>aggregation<\/b> switches collect the access switches, the <b>core<\/b> is the fast backbone, and the <b>egress<\/b> (router + firewall) leads outside."],"terms":[["Hub","Repeats bits to every port (Layer 1)."],["Switch","Forwards frames by MAC (Layer 2)."],["Router","Forwards packets by IP between networks (Layer 3)."],["AC","Wireless access controller that manages Fit APs."],["Egress","The exit to the Internet/WAN."]],"visuals":[{"type":"compare","title":"Hub vs switch vs router","cols":[["Hub · L1","muted",["Copies to all ports","One collision domain","Obsolete"]],["Switch · L2","datacom",["Learns MAC → port","Each port its own collision domain","One broadcast domain per VLAN"]],["Router · L3","sec",["Reads destination IP","Uses a routing table","Splits broadcast domains"]]]}],"cards":[{"id":"L02-c1","q":"Hub works at which layer and forwards how?","a":"Layer 1 — repeats bits out of all ports (one shared collision domain)."},{"id":"L02-c2","q":"Switch forwards based on…","a":"Destination MAC address (MAC address table) — Layer 2."},{"id":"L02-c3","q":"Router forwards based on…","a":"Destination IP address (routing table) — Layer 3."},{"id":"L02-c4","q":"Which device separates broadcast domains?","a":"A router (or Layer 3 interface/VLANIF). VLANs also split broadcast domains."},{"id":"L02-c5","q":"Fat AP vs Fit AP","a":"Fat AP = standalone, configured individually. Fit AP = managed centrally by an AC (via CAPWAP)."},{"id":"L02-c6","q":"Three layers of a campus network","a":"Access → aggregation → core (plus an egress area)."},{"id":"L02-c7","q":"Port used for first-time device configuration","a":"Console port."}],"qs":[{"id":"L02-q1","t":"one","q":"Which device forwards traffic based on destination IP address?","o":["Hub","Layer 2 switch","Router","Repeater"],"a":[2],"e":"Routers use the IP routing table."},{"id":"L02-q2","t":"tf","q":"All ports of a hub are in the same collision domain.","o":["True","False"],"a":[0],"e":"A hub repeats bits to every port, so all of them share the medium."},{"id":"L02-q3","t":"multi","q":"Which devices can separate broadcast domains?","o":["Router","Hub","Layer 3 switch with VLANIF interfaces","Repeater"],"a":[0,2],"e":"Layer 3 devices end broadcast domains; L1 devices do not."},{"id":"L02-q4","t":"one","q":"In WLAN, which device centrally manages Fit APs?","o":["Firewall","AC (wireless access controller)","Modem","Hub"],"a":[1],"e":"Fit APs are managed by an AC using CAPWAP."},{"id":"L02-q5","t":"one","q":"Which layer of a campus network connects end users directly?","o":["Core","Aggregation","Access","Egress"],"a":[2],"e":"Access switches connect PCs, phones and APs."}]},{"id":"L03","week":1,"domain":"datacom","pri":2,"mins":15,"title":"Transmission basics: modes, performance and media","book":"Ch 2 · §2.5 · pp. 64–67 (+ coverage module 1)","hook":{"analogy":"Simplex = radio broadcast. Half-duplex = walkie-talkie (take turns). Full-duplex = phone call (both talk at once).","mnemonic":"BTLJ: Bandwidth = road width, Throughput = cars that actually pass, Latency = travel time, Jitter = how much travel time varies.","diagram":{"type":"stack","title":"Speed words, from capacity to experience","rows":[["Bandwidth","maximum capacity of the link (e.g. 1 Gbit/s)","datacom"],["Throughput","what you actually get after overhead and congestion","datacom"],["Latency","one-way or round-trip delay (ms)","wlan"],["Jitter","variation in latency — ruins voice and video","sec"],["Packet loss","% of packets that never arrive","dcn"]]}},"learn":["Data communication has 5 parts: <b>sender, receiver, message, medium, protocol<\/b>.","<b>Simplex<\/b> = one direction only. <b>Half-duplex<\/b> = both directions, one at a time (hubs, Wi-Fi). <b>Full-duplex<\/b> = both at once (switch ports).","<b>Serial<\/b> sends one bit after another on one line (Ethernet, USB). <b>Parallel<\/b> sends several bits at once on several lines (old printer cables). Serial won for long distances.","<b>Analog<\/b> signals vary continuously; <b>digital<\/b> signals use discrete levels (0/1).","Guided media: <b>twisted pair<\/b> (UTP Cat5e/Cat6, max ~100 m per run), <b>coaxial<\/b>, and <b>optical fibre<\/b> — single-mode (long distance, laser) vs multi-mode (short distance, LED/VCSEL). Fibre is immune to electromagnetic interference.","Unguided media: Wi-Fi radio, microwave, satellite (high latency), infrared.","Performance metrics: <b>bandwidth<\/b>, <b>throughput<\/b>, <b>latency<\/b>, <b>jitter<\/b>, <b>packet loss<\/b>.","Cables: <b>straight-through<\/b> (T568B both ends) connects unlike devices (PC↔switch); <b>crossover<\/b> (T568A one end, B the other) connects like devices. Modern ports auto-detect this (Auto-MDIX)."],"video":"simplex half duplex full duplex explained","do":{"kind":"think","text":"Classify: Wi-Fi, a switch port, TV broadcast, a walkie-talkie, a phone call — simplex, half-duplex or full-duplex?"},"teach":"Explain the difference between bandwidth and throughput using a traffic analogy.","simple":["Every conversation needs five parts: a <b>sender<\/b>, a <b>receiver<\/b>, the <b>message<\/b>, the <b>medium<\/b> it travels through (cable, fibre, air) and the <b>protocol<\/b> (the agreed rules).","Direction matters. <b>Simplex<\/b> = one way only (a TV broadcast). <b>Half-duplex<\/b> = both ways but taking turns (walkie-talkie, Wi-Fi). <b>Full-duplex<\/b> = both ways at the same time (a phone call, a modern switch port).","How “fast” is a network? <b>Bandwidth<\/b> is the maximum the link can carry (the width of the road). <b>Throughput<\/b> is what you actually get (cars that really get through). <b>Latency<\/b> is how long a trip takes; <b>jitter<\/b> is how much that time wobbles (bad for video calls); <b>packet loss<\/b> is the share of packets that never arrive.","Copper <b>UTP<\/b> cable is cheap and works up to about <b>100 m<\/b>. <b>Fibre<\/b> uses light: multi-mode for short runs inside buildings, single-mode for long distances (km). Fibre ignores electrical interference. Wireless (Wi-Fi, microwave, satellite) needs no cable but suffers interference and, for satellite, high latency."],"terms":[["Duplex","Whether both sides can send at the same time."],["Bandwidth","Maximum capacity of a link."],["Latency","Delay of a trip, in ms."],["Jitter","Variation in delay."],["Single-mode fibre","Thin core, laser, long distance."]],"visuals":[{"type":"compare","title":"Transmission modes","cols":[["Simplex","muted",["One direction only","TV / radio broadcast"]],["Half-duplex","sec",["Both directions, one at a time","Walkie-talkie, Wi-Fi, hubs"]],["Full-duplex","datacom",["Both directions at once","Phone call, switch ports"]]]},{"type":"compare","title":"Guided media","cols":[["Twisted pair (UTP)","datacom",["Copper, cheap","≈ 100 m per run","Cat5e/Cat6"]],["Multi-mode fibre","wlan",["Light, thicker core","Hundreds of metres","Inside buildings"]],["Single-mode fibre","dcn",["Light, thin core, laser","Kilometres","Between buildings/cities"]]]}],"cards":[{"id":"L03-c1","q":"Half-duplex means…","a":"Both directions, but only one at a time (e.g. walkie-talkie, hub, Wi-Fi)."},{"id":"L03-c2","q":"Maximum length of a UTP Ethernet run","a":"About 100 m."},{"id":"L03-c3","q":"Single-mode vs multi-mode fibre","a":"Single-mode: thin core, laser, long distance. Multi-mode: thicker core, short distance."},{"id":"L03-c4","q":"Jitter","a":"Variation in delay between packets — bad for voice/video."},{"id":"L03-c5","q":"Five components of data communication","a":"Sender, receiver, message, medium, protocol."},{"id":"L03-c6","q":"Straight-through cable connects…","a":"Unlike devices, e.g. PC to switch (T568B on both ends)."},{"id":"L03-c7","q":"Bandwidth vs throughput","a":"Bandwidth = max capacity; throughput = actual delivered rate."}],"qs":[{"id":"L03-q1","t":"one","q":"A walkie-talkie is an example of which transmission mode?","o":["Simplex","Half-duplex","Full-duplex","Parallel"],"a":[1],"e":"Both sides can talk, but only one at a time."},{"id":"L03-q2","t":"tf","q":"Optical fibre is immune to electromagnetic interference.","o":["True","False"],"a":[0],"e":"It carries light, not electrical signals."},{"id":"L03-q3","t":"one","q":"Which metric describes variation in packet delay?","o":["Bandwidth","Throughput","Jitter","Packet loss"],"a":[2],"e":"Jitter = delay variation."},{"id":"L03-q4","t":"one","q":"Which fibre type is best for a 40 km link?","o":["Multi-mode","Single-mode","Cat6 UTP","Coaxial"],"a":[1],"e":"Single-mode fibre is used for long distances."},{"id":"L03-q5","t":"multi","q":"Which are guided (wired) media?","o":["Twisted pair","Microwave","Optical fibre","Coaxial cable"],"a":[0,2,3],"e":"Microwave travels through the air (unguided)."}]},{"id":"L04","week":1,"domain":"datacom","pri":1,"mins":20,"title":"OSI and TCP/IP models, encapsulation","book":"Ch 2 · §2.1 · pp. 15–25","hook":{"analogy":"Encapsulation is like posting a letter: put the letter in an envelope (TCP), put the envelope in a mailbag addressed to a city (IP), then put the mailbag on a truck (Ethernet frame).","mnemonic":"OSI top→bottom: All People Seem To Need Data Processing (Application, Presentation, Session, Transport, Network, Data link, Physical).","diagram":{"type":"stack","title":"Encapsulation on the way down","rows":[["Application (L7–L5)","Data — HTTP, DNS, FTP, DHCP","wlan"],["Transport (L4)","Segment — TCP / UDP header + port numbers","sec"],["Network (L3)","Packet — IP header + IP addresses","datacom"],["Data link (L2)","Frame — Ethernet header (MACs) + FCS trailer","dcn"],["Physical (L1)","Bits — signals on copper, fibre or radio","muted"]]}},"learn":["<b>OSI<\/b> has 7 layers: Physical, Data link, Network, Transport, Session, Presentation, Application. It is a reference model for learning and troubleshooting.","<b>TCP/IP<\/b> is what the Internet actually runs. The textbook uses a 5-layer view: Application, Transport, Network (Internet), Data link, Physical. The original model has 4 layers (Application, Transport, Internet, Network access).","<b>PDUs<\/b>: Application = <b>data<\/b>, Transport = <b>segment<\/b> (TCP) / datagram (UDP), Network = <b>packet<\/b>, Data link = <b>frame<\/b>, Physical = <b>bits<\/b>.","<b>Encapsulation<\/b>: each layer adds its own header going down (L2 also adds an FCS trailer). <b>Decapsulation<\/b>: each layer removes its header going up.","Each layer talks only to the same layer on the other side (peer communication) and serves the layer above it.","Device ↔ layer: hub L1, switch L2, router L3, firewall L3–L7, PCs and servers all 7 layers.","Addressing per layer: <b>port numbers<\/b> at L4, <b>IP addresses<\/b> at L3, <b>MAC addresses<\/b> at L2."],"video":"OSI model encapsulation decapsulation explained","do":{"kind":"drill","ref":"osi","text":"Open the OSI sorting drill in Drills: place 14 protocols and devices on the right layer."},"teach":"Explain encapsulation using the letter-and-envelope analogy, naming each PDU.","simple":["Networking is complicated, so engineers split it into <b>layers<\/b>. Each layer solves one problem and trusts the layers below to do theirs — like a company where the writer, the packer and the courier each do one job.","Going down the stack on the sender (<b>encapsulation<\/b>): the application makes the <b>data<\/b> (e.g. a web request). <b>Transport<\/b> (L4) adds a TCP/UDP header with <b>port numbers<\/b> → a <b>segment<\/b>. <b>Network<\/b> (L3) adds an IP header with <b>IP addresses<\/b> → a <b>packet<\/b>. <b>Data link<\/b> (L2) adds an Ethernet header with <b>MAC addresses<\/b> and a trailer (FCS) → a <b>frame<\/b>. <b>Physical<\/b> (L1) turns it into <b>bits<\/b> on the wire.","The receiver does the reverse (<b>decapsulation<\/b>), peeling off one header per layer, like opening nested envelopes.","The <b>OSI model<\/b> has 7 layers (Application, Presentation, Session on top). The real-world <b>TCP/IP model<\/b> squeezes those top three into one Application layer. Exams love asking “which layer does X?” — learn the protocol/device-to-layer mapping well."],"terms":[["Encapsulation","Adding a header at each layer going down."],["Segment / packet / frame","L4 / L3 / L2 units of data."],["FCS","Error-check trailer on a frame."],["Peer layers","The same layer on sender and receiver understand each other."]],"visuals":[{"type":"nest","title":"A frame is an envelope inside an envelope","layers":[["Frame · Ethernet header (MACs) … FCS","dcn"],["Packet · IP header (IP addresses)","datacom"],["Segment · TCP header (ports)","sec"]],"inner":"Data (e.g. HTTP request)"},{"type":"compare","title":"OSI vs TCP/IP","cols":[["OSI (7)","datacom",["7 Application","6 Presentation","5 Session","4 Transport","3 Network","2 Data link","1 Physical"]],["TCP/IP (5-layer view)","wlan",["Application (= OSI 5–7)","Transport","Network (Internet)","Data link","Physical"]]]}],"cards":[{"id":"L04-c1","q":"7 OSI layers (bottom → top)","a":"Physical, Data link, Network, Transport, Session, Presentation, Application."},{"id":"L04-c2","q":"PDU at the transport layer (TCP)","a":"Segment."},{"id":"L04-c3","q":"PDU at the network layer","a":"Packet."},{"id":"L04-c4","q":"PDU at the data link layer","a":"Frame."},{"id":"L04-c5","q":"What does the data link layer add besides a header?","a":"A trailer — the FCS (frame check sequence) for error detection."},{"id":"L04-c6","q":"Address used at L4 / L3 / L2","a":"Port number / IP address / MAC address."},{"id":"L04-c7","q":"Encapsulation vs decapsulation","a":"Adding headers going down the stack (sender) vs removing them going up (receiver)."},{"id":"L04-c8","q":"Layer of: router, switch, hub","a":"Router L3, switch L2, hub L1."}],"qs":[{"id":"L04-q1","t":"one","q":"Which OSI layer is responsible for end-to-end delivery using port numbers?","o":["Network","Transport","Session","Data link"],"a":[1],"e":"Transport (L4) uses port numbers — TCP/UDP."},{"id":"L04-q2","t":"one","q":"What is the PDU at the data link layer called?","o":["Segment","Packet","Frame","Bit"],"a":[2],"e":"Frames carry MAC addresses and an FCS."},{"id":"L04-q3","t":"tf","q":"During encapsulation, the network layer adds the source and destination MAC addresses.","o":["True","False"],"a":[1],"e":"MAC addresses are added by the data link layer; L3 adds IP addresses."},{"id":"L04-q4","t":"multi","q":"Which protocols work at the application layer?","o":["HTTP","DNS","TCP","FTP"],"a":[0,1,3],"e":"TCP is a transport layer protocol."},{"id":"L04-q5","t":"one","q":"Which OSI layer converts data formats and handles encryption and compression?","o":["Presentation","Session","Application","Transport"],"a":[0],"e":"Presentation (L6) handles format, encryption and compression."},{"id":"L04-q6","t":"tf","q":"A Layer 2 switch decapsulates a frame up to the IP header to forward it.","o":["True","False"],"a":[1],"e":"A L2 switch only reads the Ethernet header (destination MAC)."}]},{"id":"L05","week":1,"domain":"datacom","pri":2,"mins":15,"title":"Application protocols and well-known ports","book":"Ch 2 · §2.2 · pp. 25–37","hook":{"analogy":"An IP address is the building; the port number is the apartment. Port 80 is the web apartment, 53 the DNS one, 22 the SSH one.","mnemonic":"21 FTP-control, 22 SSH, 23 Telnet, 25 SMTP, 53 DNS, 67/68 DHCP, 69 TFTP, 80 HTTP, 110 POP3, 123 NTP, 161 SNMP, 443 HTTPS — recite the ladder until it's automatic.","diagram":{"type":"seq","actors":["PC","DNS server","Web server"],"steps":[[0,1,"DNS query: www.example.com?","UDP 53"],[1,0,"DNS reply: 203.0.113.10",""],[0,2,"TCP handshake to port 80/443",""],[0,2,"HTTP GET /",""],[2,0,"HTTP 200 OK + page",""]]}},"learn":["<b>HTTP<\/b> (TCP 80) transfers web pages using requests (GET, POST…) and status codes (200 OK, 404 Not Found). <b>HTTPS<\/b> (TCP 443) = HTTP inside TLS encryption.","<b>FTP<\/b> uses TCP 21 for control and TCP 20 for data (active mode). In passive mode the server opens a random data port. <b>TFTP<\/b> = UDP 69, simple and without login.","<b>DNS<\/b> (mainly UDP 53; TCP 53 for zone transfers/large replies) turns names into IP addresses.","<b>DHCP<\/b> (UDP 67 server, 68 client) hands out IP settings automatically.","<b>Telnet<\/b> (TCP 23) gives remote CLI in plain text; <b>SSH<\/b> (TCP 22) is the encrypted replacement.","Email: <b>SMTP<\/b> TCP 25 (send), <b>POP3<\/b> TCP 110 and <b>IMAP<\/b> TCP 143 (receive). <b>SNMP<\/b> UDP 161/162 (trap). <b>NTP<\/b> UDP 123.","Well-known ports are 0–1023; registered ports are 1024–49151; dynamic/ephemeral ports (client side) are 49152–65535.","Client–server: the client uses a random high source port; the server listens on a well-known destination port."],"video":"common TCP UDP port numbers explained","do":{"kind":"drill","ref":"ports","text":"Run the port-number speed drill in Drills until you can do 15 in under 60 seconds."},"teach":"Explain why a web browser needs DNS before it can use HTTP.","simple":["Applications talk using their own protocols on top of TCP or UDP, and each service waits for visitors at a fixed <b>port number<\/b> — like a shop with a fixed door number.","The web: <b>HTTP<\/b> on TCP 80; <b>HTTPS<\/b> (encrypted) on TCP 443. Files: <b>FTP<\/b> uses TCP 21 for commands and TCP 20 for data; <b>TFTP<\/b> (UDP 69) is a tiny, no-login version used to copy device configs/images.","Names: <b>DNS<\/b> (port 53, mostly UDP) turns names into IPs. Addresses: <b>DHCP<\/b> (UDP 67 server/68 client). Remote control: <b>Telnet<\/b> (TCP 23, everything in plain text — insecure) and <b>SSH<\/b> (TCP 22, encrypted — use this).","Email: <b>SMTP<\/b> 25 sends; <b>POP3<\/b> 110 and <b>IMAP<\/b> 143 read. Management: <b>SNMP<\/b> UDP 161 (and 162 for alerts), <b>NTP<\/b> UDP 123 (time).","Your PC (the client) uses a random high port (e.g. 51000) as its source port; the server uses the well-known port as the destination. The reply simply swaps them."],"terms":[["Well-known port","0–1023, reserved for common services."],["Client port","Random high port chosen by your PC."],["HTTPS","HTTP inside TLS encryption, TCP 443."],["TFTP","Trivial FTP, UDP 69, no login."]],"visuals":[{"type":"stack","title":"Port ladder — say it out loud","rows":[["20/21 FTP · 22 SSH · 23 Telnet · 25 SMTP","TCP","sec"],["53 DNS","UDP (TCP for big answers)","wlan"],["67/68 DHCP · 69 TFTP","UDP","wlan"],["80 HTTP · 110 POP3 · 143 IMAP · 443 HTTPS","TCP","sec"],["123 NTP · 161/162 SNMP","UDP","wlan"]]},{"type":"seq","title":"Client and server ports in one exchange","actors":["Browser 192.168.1.10","Web server 203.0.113.5"],"steps":[[0,1,"src port 51000 → dst port 443","request"],[1,0,"src port 443 → dst port 51000","reply (ports swapped)"]]}],"cards":[{"id":"L05-c1","q":"HTTP / HTTPS ports","a":"TCP 80 / TCP 443."},{"id":"L05-c2","q":"FTP ports","a":"TCP 21 control, TCP 20 data (active mode)."},{"id":"L05-c3","q":"DNS port and transport","a":"Port 53 — mainly UDP; TCP for zone transfers and large responses."},{"id":"L05-c4","q":"DHCP ports","a":"UDP 67 (server) and UDP 68 (client)."},{"id":"L05-c5","q":"Telnet vs SSH ports","a":"Telnet TCP 23 (plain text); SSH TCP 22 (encrypted)."},{"id":"L05-c6","q":"TFTP port","a":"UDP 69."},{"id":"L05-c7","q":"SNMP ports","a":"UDP 161 (agent queries) and UDP 162 (traps)."},{"id":"L05-c8","q":"NTP port","a":"UDP 123."},{"id":"L05-c9","q":"Well-known port range","a":"0–1023."}],"qs":[{"id":"L05-q1","t":"one","q":"Which port does SSH use by default?","o":["TCP 21","TCP 22","TCP 23","UDP 22"],"a":[1],"e":"SSH = TCP 22."},{"id":"L05-q2","t":"one","q":"Which protocol uses UDP port 69?","o":["FTP","TFTP","SNMP","NTP"],"a":[1],"e":"TFTP = UDP 69."},{"id":"L05-q3","t":"multi","q":"Which protocols use UDP as their transport?","o":["DHCP","TFTP","Telnet","SNMP"],"a":[0,1,3],"e":"Telnet uses TCP 23."},{"id":"L05-q4","t":"tf","q":"Telnet encrypts the username and password it sends.","o":["True","False"],"a":[1],"e":"Telnet sends everything in plain text; use SSH instead."},{"id":"L05-q5","t":"one","q":"An FTP client in active mode receives data from the server's source port…","o":["20","21","22","69"],"a":[0],"e":"TCP 20 is the FTP data port in active mode."},{"id":"L05-q6","t":"one","q":"Which application protocol resolves domain names to IP addresses?","o":["DHCP","ARP","DNS","ICMP"],"a":[2],"e":"DNS resolves names; ARP resolves IP→MAC."}]},{"id":"L06","week":1,"domain":"datacom","pri":1,"mins":20,"title":"TCP vs UDP: handshake, reliability, windows","book":"Ch 2 · §2.3 · pp. 37–50","hook":{"analogy":"TCP is a registered letter (signed for, numbered, resent if lost). UDP is a postcard (fast, no guarantee).","mnemonic":"Handshake = SYN → SYN+ACK → ACK (“Hi? — Hi, I hear you! — Great”). Closing = 4 messages (FIN, ACK, FIN, ACK).","diagram":{"type":"seq","actors":["Client","Server"],"steps":[[0,1,"SYN","seq = x"],[1,0,"SYN + ACK","seq = y, ack = x+1"],[0,1,"ACK","ack = y+1 → ESTABLISHED"],[0,1,"Data…",""],[0,1,"FIN","close starts"],[1,0,"ACK",""],[1,0,"FIN",""],[0,1,"ACK","TIME_WAIT"]]}},"learn":["<b>TCP<\/b> is connection-oriented and reliable: 3-way handshake, sequence numbers, acknowledgements, retransmission, flow control (sliding <b>window<\/b>) and congestion control. Header ≥ 20 bytes.","<b>UDP<\/b> is connectionless and best-effort: no handshake, no retransmission, header only 8 bytes. It is used for DNS queries, DHCP, TFTP, SNMP, voice/video and streaming.","Handshake: <b>SYN<\/b> → <b>SYN+ACK<\/b> → <b>ACK<\/b>. Teardown: FIN → ACK → FIN → ACK (4 segments, because each side closes its own direction).","<b>Sequence number<\/b> = position of the first byte sent; <b>acknowledgement number<\/b> = next byte expected.","Important TCP flags: SYN (open), ACK, FIN (close gracefully), RST (abort), PSH, URG.","The <b>window size<\/b> tells the sender how many bytes it may send before waiting for an ACK (flow control).","A <b>socket<\/b> = IP address + protocol + port. One connection is identified by its 5-tuple: src IP, dst IP, src port, dst port, protocol."],"video":"TCP three way handshake explained","do":{"kind":"think","text":"If a client sends SYN with seq=100 and the server replies seq=500, what ack number does each side put in the next two segments?"},"teach":"Explain why TCP needs a handshake but UDP does not, and give one app that prefers each.","simple":["<b>TCP<\/b> is the careful delivery service. Before sending data it does a <b>3-way handshake<\/b> so both sides agree to talk: client says <b>SYN<\/b> (“can we talk?”), server says <b>SYN-ACK<\/b> (“yes, can you hear me?”), client says <b>ACK<\/b> (“yes!”).","Then TCP numbers every byte (<b>sequence numbers<\/b>). The receiver replies with <b>acknowledgements<\/b> (“I got everything up to byte 2001, send 2001 next”). Anything not acknowledged in time is <b>sent again<\/b>. The <b>window<\/b> tells the sender how much it may send before waiting — this stops a fast sender from drowning a slow receiver.","<b>UDP<\/b> is the postcard: no handshake, no numbering, no resending, tiny 8-byte header. That makes it fast and light, which is perfect for DNS lookups, DHCP, live voice/video (a late packet is useless anyway) and SNMP.","Closing a TCP connection takes <b>four<\/b> messages (FIN, ACK, FIN, ACK) because each side closes its own direction. <b>RST<\/b> slams the door instantly."],"terms":[["SYN / ACK / FIN / RST","Open / acknowledge / close / abort flags."],["Sequence number","Position of the data in the stream."],["Window","How much can be sent before waiting for an ACK."],["Connectionless","No setup before sending (UDP)."]],"visuals":[{"type":"compare","title":"TCP vs UDP","cols":[["TCP","datacom",["Connection-oriented (handshake)","Reliable: ACKs + retransmission","Ordered, flow control (window)","Header ≥ 20 bytes","HTTP(S), FTP, SSH, Telnet, BGP"]],["UDP","sec",["Connectionless","Best-effort, no retransmission","Low overhead","Header 8 bytes","DNS, DHCP, TFTP, SNMP, VoIP, video"]]]},{"type":"seq","title":"Sequence and acknowledgement numbers","actors":["Client","Server"],"steps":[[0,1,"seq 1001, 500 bytes",""],[1,0,"ACK 1501","“send 1501 next”"],[0,1,"seq 1501, 500 bytes (lost ✕)",""],[0,1,"timeout → resend seq 1501","retransmission"]]}],"cards":[{"id":"L06-c1","q":"TCP 3-way handshake","a":"SYN → SYN+ACK → ACK."},{"id":"L06-c2","q":"UDP header size","a":"8 bytes."},{"id":"L06-c3","q":"Minimum TCP header size","a":"20 bytes."},{"id":"L06-c4","q":"What does the ACK number mean?","a":"The next byte the receiver expects (last byte received + 1)."},{"id":"L06-c5","q":"Purpose of the TCP window","a":"Flow control — how much data can be sent before waiting for an ACK."},{"id":"L06-c6","q":"TCP flag that aborts a connection immediately","a":"RST."},{"id":"L06-c7","q":"Why is teardown 4 steps?","a":"Ea
